<style>
  :root {
    --bg:#14161a; --panel:#1b1e23; --line:rgba(255,255,255,0.09);
    --ink:#e7e5df; --muted:#9c9a92; --accent:#5DCAA5;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  .header img { height:52px; width:auto; display:block; }
  .header .htitle { flex:1; text-align:center; }
  .header .htitle .main { font-size:22px; font-weight:600; letter-spacing:.02em; color:var(--ink); }
  .header .htitle .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .header .logo-r, .header .logo-m { flex:0 0 auto; }
  .wrap { display:flex; gap:16px; padding:16px; align-items:stretch; }
  .side { flex:0 0 300px; display:flex; flex-direction:column; gap:12px; min-width:260px; }
  .side-right { flex:0 0 360px; min-width:300px; overflow-y:auto; max-height:calc(100vh - 100px); }
  .pdiv { height:1px; background:var(--line); margin:14px 0; }
  .pblock .k:first-of-type { margin-top:10px; }
  .viewer { flex:1 1 auto; min-width:320px; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:#000; }
  .viewer iframe { width:100%; height:100%; min-height:560px; border:0; display:block; }
  h1 { font-size:15px; font-weight:600; margin:0; }
  .lead { font-size:12.5px; color:var(--muted); margin:2px 0 0; line-height:1.55; }
  .search { width:100%; height:34px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); padding:0 12px; font-size:13px; }
  .search::placeholder { color:var(--muted); }
  .presets { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .presets .ptitle { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .clr { font-size:11px; color:var(--accent); cursor:pointer; text-transform:none; letter-spacing:0; }
  .pgrid { display:flex; flex-wrap:wrap; gap:6px; }
  .pchip { font-size:12px; padding:5px 10px; border-radius:20px; cursor:pointer; border:1px solid var(--line);
    background:transparent; color:var(--ink); transition:.12s; user-select:none; }
  .pchip:hover { border-color:rgba(255,255,255,0.28); }
  .pchip.on { background:rgba(93,202,165,0.16); border-color:var(--accent); color:var(--accent); }
  .groups { overflow-y:auto; flex:1; padding-right:4px; }
  .glabel { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 4px 6px; }
  .grid { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { position:relative; font-size:12.5px; padding:6px 11px; border-radius:7px; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); transition:.12s; }
  .chip:hover { border-color:rgba(255,255,255,0.25); }
  .chip.hl { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .chip.hl::after { content:""; position:absolute; top:-3px; right:-3px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .chip.sel { background:rgba(93,202,165,0.16); color:var(--accent); }
  .chip.dim { opacity:.32; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .card .site { font-size:22px; font-weight:600; }
  .card .region { font-size:13px; color:var(--muted); margin:2px 0 12px; }
  .card .k { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 3px; }
  .card .v { font-size:13.5px; line-height:1.6; margin:0; }
  @media (max-width:900px){ .wrap { flex-direction:column; } .side, .side-right { flex:none; } .viewer { min-height:400px; order:-1; } }
</style>

    e:["F7","F8","T3","T5","T6"],

    tasks:"Verbal fluency, semantic judgment, reading and word-generation tasks.",

    note:"Relevant to the verbal side of creativity (word-based ideation); left-lateralized in most right-handers."
  },

    e:["F3","F4","F7","F8"],

    band:"Alpha (8–13 Hz), used for asymmetry",
    network:"Prefrontal affective/valence system; approach–withdrawal circuitry.",
    tasks:"Emotional-image viewing, affective induction, resting-state affect measurement.",
    metric:"Frontal alpha asymmetry index: ln(right alpha) − ln(left alpha), e.g. F4 vs F3.",
    note:"A well-established affective marker; interpret the asymmetry, not absolute power at any single site."
  },
  "Full 10-20 (all)": {
    e:"ALL",
    purpose:"Show the complete standard montage as a general reference, unfiltered by condition.",

    network:"Whole-scalp coverage across all cortical regions.",

};

const data = {
  Fp1:{r:"Left frontopolar — prefrontal cortex", f:"Over the far-front prefrontal cortex, above the left eyebrow. Picks up executive/attentional activity but is heavily contaminated by eye blinks and eye movement (EOG).", extra:"Often used as much for blink/artifact monitoring as for cortical signal."},
  Fpz:{r:"Frontopolar midline", f:"Midline frontopolar site over medial prefrontal cortex; frequently used as a ground or reference in simple montages.", extra:"Central forehead position, easy to place without hair."},
  Fp2:{r:"Right frontopolar — prefrontal cortex", f:"Right-side counterpart of Fp1, over right prefrontal cortex; also strongly affected by eye-movement artifact.", extra:"Fp1/Fp2 pair can index frontal asymmetry but need careful EOG cleaning."},
  F7:{r:"Left inferior frontal — Broca's area region", f:"Over left inferior frontal gyrus, near language/speech-production regions. Involved in verbal fluency and word retrieval.", extra:"Relevant to verbal creativity and language-based ideation tasks."},
  F3:{r:"Left dorsolateral prefrontal cortex", f:"Over left DLPFC — working memory, cognitive control, analytic/verbal processing.", extra:"Paired with F4 for frontal alpha asymmetry (engagement/approach motivation)."},
  Fz:{r:"Frontal midline — anterior cingulate / medial PFC", f:"Frontal midline theta (4–8 Hz) here is one of the most reliable EEG markers of sustained attention and cognitive effort.", extra:"A go-to channel for focus, mental workload, and flow-related attention."},
  F4:{r:"Right dorsolateral prefrontal cortex", f:"Over right DLPFC. Reduced activity (transient hypofrontality) is linked to flow states, when self-monitoring drops.", extra:"The F3–F4 asymmetry tracks motivational engagement and prefrontal disengagement."},
  F8:{r:"Right inferior frontal", f:"Right-side counterpart of F7, over right inferior frontal cortex; associated with inhibitory control and some aspects of divergent thinking.", extra:"Right frontal engagement features in several creativity findings."},
  FC5:{r:"Left frontocentral", f:"Between frontal and central regions on the left, over premotor / inferior frontal areas. Involved in action planning and speech-motor processing.", extra:"Useful when a task blends cognitive and motor-preparation demands."},
  FC1:{r:"Left frontocentral midline-adjacent", f:"Over medial premotor / supplementary motor area on the left; picks up motor preparation and effort.", extra:"Sits between Fz and Cz functionally."},
  FC2:{r:"Right frontocentral midline-adjacent", f:"Right-side counterpart of FC1 over medial premotor cortex.", extra:"Pairs with FC1 for frontocentral coverage."},
  FC6:{r:"Right frontocentral", f:"Right-side counterpart of FC5, over right premotor / inferior frontal cortex.", extra:"Action-planning and inhibitory processes."},
  T3:{r:"Left temporal (T7)", f:"Over left temporal cortex — analytic and verbal-semantic processing, memory retrieval.", extra:"Analytic counterpart for left–right temporal asymmetry."},
  T4:{r:"Right temporal (T8)", f:"Over right temporal cortex — associative, remote-association thinking and insight ('aha') processing.", extra:"Right temporal engagement is repeatedly tied to creative insight."},
  T5:{r:"Left posterior temporal (P7)", f:"Over left temporo-parietal junction — semantic integration, language comprehension, and visual-word processing.", extra:"Relevant to meaning-based and verbal ideation."},

  Cz:{r:"Central vertex — supplementary motor area", f:"The vertex, over medial sensorimotor / SMA. Sensorimotor rhythm (SMR, 12–15 Hz) here is trained in focus-oriented neurofeedback.", extra:"General arousal/alertness cross-check; central reference point of the montage."},
  C4:{r:"Right central — sensorimotor cortex", f:"Right-side counterpart of C3 over right sensorimotor cortex.", extra:"Motor and sensorimotor processing for the right/contralateral body."},
  CP5:{r:"Left centroparietal", f:"Over left inferior parietal / temporoparietal border — sensory integration and attention.", extra:"Bridges central and parietal attention networks."},
  CP1:{r:"Left centroparietal midline-adjacent", f:"Over medial parietal cortex on the left; sensory integration and attentional allocation.", extra:"Sits between Cz and Pz functionally."},
  CP2:{r:"Right centroparietal midline-adjacent", f:"Right-side counterpart of CP1 over medial parietal cortex.", extra:"Pairs with CP1 for centroparietal coverage."},
  CP6:{r:"Right centroparietal", f:"Right-side counterpart of CP5 over right inferior parietal region.", extra:"Sensory integration and spatial attention."},
  P3:{r:"Left parietal association cortex", f:"Over left parietal cortex — spatial processing, attention, and working-memory maintenance.", extra:"Contributes to the P300 attention/updating response."},
  Pz:{r:"Parietal midline — association cortex", f:"Alpha power (8–13 Hz) here is the best-replicated EEG correlate of creative ideation; posterior alpha rises during divergent thinking.", extra:"Also a canonical site for the P300 and internally-directed attention."},
  P4:{r:"Right parietal association cortex", f:"Over right parietal cortex — visuospatial processing and attention.", extra:"Right-parietal role in spatial and figural creativity."},
  O1:{r:"Left occipital — visual cortex", f:"Over left primary visual cortex. Occipital alpha rises when eyes close or attention turns inward, away from external vision.", extra:"Marker of internally-directed visual imagery during ideation."},
  Oz:{r:"Occipital midline — visual cortex", f:"Midline occipital site over primary visual cortex; classic location for the eyes-closed alpha rhythm.", extra:"Strongest, cleanest resting alpha signal on the scalp."},
  O2:{r:"Right occipital — visual cortex", f:"Right-side counterpart of O1 over right visual cortex.", extra:"O1/O2 together index visual engagement vs. internal imagery."},

  A2:{r:"Right earlobe / mastoid — reference/ground", f:"Right-side reference or ground point, mirror of A1.", extra:"Used for referencing or as the ground/common return."},
};

const groupsEl = document.getElementById('groups');
const pgridEl = document.getElementById('pgrid');
const card = document.getElementById('card');
const search = document.getElementById('search');
let chips = {};
let activePresets = new Set();

Object.keys(presets).forEach(name => {
  const b = document.createElement('button');
  b.className = 'pchip'; b.textContent = name;
  b.onclick = () => {
    if (activePresets.has(name)) activePresets.delete(name); else activePresets.add(name);
    b.classList.toggle('on');
    applyHighlight();
    renderPdesc();
  };
  pgridEl.appendChild(b);
});

document.getElementById('clr').onclick = () => {
  activePresets.clear();
  document.querySelectorAll('.pchip').forEach(c => c.classList.remove('on'));
  applyHighlight();
  renderPdesc();
};

function highlightedSet() {
  const s = new Set();
  activePresets.forEach(name => {
    const v = presets[name].e;
    if (v === "ALL") Object.keys(data).forEach(k => s.add(k));
    else v.forEach(k => s.add(k));
  });
  return s;
}

function renderPdesc() {
  const pd = document.getElementById('pdesc');
  const names = [...activePresets];
  if (!names.length) { pd.style.display = 'none'; pd.innerHTML = ''; return; }
  pd.style.display = 'block';
  pd.innerHTML = names.map(name => {
    const p = presets[name];
    const sites = p.e === "ALL" ? "All 10-20 sites" : p.e.join(", ");
    return (
      '<div class="pblock">' +
      '<div class="site" style="font-size:17px">' + name + '</div>' +
      '<div class="region">' + sites + '</div>' +
      '<p class="k">Purpose</p><p class="v">' + p.purpose + '</p>' +
      '<p class="k">Key signal</p><p class="v">' + p.signal + '</p>' +
      '<p class="k">Frequency band</p><p class="v">' + p.band + '</p>' +
      '<p class="k">Brain network</p><p class="v">' + p.network + '</p>' +
      '<p class="k">Typical tasks</p><p class="v">' + p.tasks + '</p>' +
      '<p class="k">Analysis metric</p><p class="v">' + p.metric + '</p>' +
      '<p class="k">Note</p><p class="v">' + p.note + '</p>' +
      '</div>'
    );
  }).join('<div class="pdiv"></div>');
}

function applyHighlight() {
  const hl = highlightedSet();
  const any = hl.size > 0;
  Object.entries(chips).forEach(([name, chip]) => {
    chip.classList.toggle('hl', hl.has(name));
    chip.classList.toggle('dim', any && !hl.has(name));
  });
}

function render(filter="") {
  groupsEl.innerHTML = ""; chips = {};
  const f = filter.trim().toLowerCase();
  groups.forEach(g => {
    const matches = g.items.filter(n => !f || n.toLowerCase().includes(f));
    if (!matches.length) return;
    const gl = document.createElement('div'); gl.className = 'glabel'; gl.textContent = g.label;
    groupsEl.appendChild(gl);
    const grid = document.createElement('div'); grid.className = 'grid';
    matches.forEach(name => {
      const chip = document.createElement('button');
      chip.className = 'chip'; chip.textContent = name;
      chip.onclick = () => select(name, chip);
      grid.appendChild(chip); chips[name] = chip;
    });
    groupsEl.appendChild(grid);
  });
  applyHighlight();
}

function select(name, chip) {
  Object.values(chips).forEach(c => c.classList.remove('sel'));
  if (chip) chip.classList.add('sel');
  const d = data[name];
  card.innerHTML =
    '<div class="site">' + name + '</div>' +
    '<div class="region">' + d.r + '</div>' +
    '<p class="k">Function</p><p class="v">' + d.f + '</p>' +
    '<p class="k">Note</p><p class="v">' + d.extra + '</p>';
}

search.addEventListener('input', e => render(e.target.value));
render();
</script>
