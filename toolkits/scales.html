<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which measure? — well-being instrument selector</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#141E2B; --ink70:#4A5766; --ink40:#8A94A1;
  --paper:#E7EBEE; --card:#FFF; --line:#C9D2DA; --lineSoft:#DEE4E9;
  --accent:#1B5C7A; --accentSoft:#DDEAF0;
  --pos:#B26A12; --posSoft:#F7EBD8;
  --warn:#A33327; --warnSoft:#F6E2DF;
  --ok:#2C6A4F; --okSoft:#DFEDE5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#fff}
.htop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:28px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:#8FA6B6}
h1{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:6px}
.sub{max-width:36em;color:#B9C7D2;font-size:15.5px;margin-top:8px}
.hstat{text-align:right;font-size:12px;color:#8FA6B6}
nav{display:flex;gap:4px;margin-top:24px;overflow-x:auto}
nav button{font-size:13.5px;padding:10px 14px;border-radius:6px 6px 0 0;color:#B9C7D2;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button.on{background:var(--paper);color:var(--ink);font-weight:600}
main{padding:24px 0 8px}
.cols{display:grid;gap:24px}
@media(min-width:1000px){.cols.find{grid-template-columns:340px minmax(0,1fr)}
.cols.bat{grid-template-columns:minmax(0,1fr) 320px}
.cols.lvl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px}
.label{font-size:11px;letter-spacing:.1em;color:var(--ink40)}
.small{font-size:14px;color:var(--ink70)}
.tiny{font-size:12px;color:var(--ink40)}
.fgroup{padding:12px;border-top:1px solid var(--lineSoft)}
.fgroup:first-child{border-top:none}
.fgroup h4{font-size:14.5px;font-weight:600}
.fgroup .help{font-size:12.5px;color:var(--ink40);margin-top:2px;line-height:1.4}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{font-size:12px;padding:4px 8px;border-radius:5px;background:var(--paper);color:var(--ink70);border:1px solid transparent;text-align:left}
.opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);margin-top:8px}
.clist{max-height:560px;overflow-y:auto;margin-top:10px;padding-right:6px;border-top:1px solid var(--lineSoft);padding-top:8px}
.clist::-webkit-scrollbar{width:8px}
.clist::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.cfam{display:flex;align-items:baseline;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--ink40);margin:12px 0 5px;border-bottom:1px solid var(--lineSoft);padding-bottom:3px}
.clist>.cfam:first-child{margin-top:0}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--lineSoft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.card.cmp{border-color:var(--accent)}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.abbr{font-size:18px;font-weight:600;letter-spacing:-.01em}
.fullname{font-size:14.5px;color:var(--ink70)}
.fit{font-size:20px;font-weight:600;text-align:right}
.fitl{font-size:10px;letter-spacing:.08em;color:var(--ink40);text-align:right}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--paper);color:var(--ink70);display:inline-flex;align-items:center;gap:5px}
.why{display:grid;gap:4px;margin-top:12px}
.why li,.flag{display:flex;gap:8px;font-size:14px;line-height:1.45}
.why li{color:var(--ink70);list-style:none}
.flags{background:var(--warnSoft);border-radius:6px;padding:10px;margin-top:10px}
.flag{color:var(--warn)}
.flag+.flag{margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 9px;border-radius:5px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--ink70)}
.btn.link{background:var(--accentSoft);border-color:var(--accentSoft);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.detail{border-top:1px solid var(--lineSoft);padding:14px}
.dgrid{display:grid;gap:12px}
@media(min-width:640px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .full{grid-column:1/-1}}
.dval{font-size:14px;line-height:1.5;margin-top:3px}
.dval ul{margin-top:4px;list-style:none;display:grid;gap:4px}
.anch{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.anch span{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 7px;border-radius:4px;background:var(--paper);color:var(--ink70);border:1px solid var(--lineSoft)}
.anch span b{color:var(--accent);font-weight:600}
/* rendered scale mock */
.mock{border:1px solid var(--lineSoft);border-radius:8px;padding:14px;background:var(--paper);margin-top:8px}
.mockq{font-size:14.5px;line-height:1.45}
.mockq em{color:var(--ink40);font-style:normal}
.mockrow{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-top:12px}
.mockopt{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.mockcirc{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink40);background:#fff;flex:none}
.mockcirc.on{border-color:var(--accent);box-shadow:inset 0 0 0 3.5px #fff, inset 0 0 0 12px var(--accent)}
.mocknum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink40)}
.mocklab{font-size:10.5px;color:var(--ink70);text-align:center;line-height:1.25;min-height:2.4em}
.mockblock{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--lineSoft)}
.mockblock:first-of-type{border-top:none}
.mockends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink70);margin-top:5px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
td{padding:9px 12px;border-bottom:1px solid var(--lineSoft);font-size:14px;vertical-align:top;line-height:1.45}
td.rl{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:var(--ink40);white-space:nowrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:32px;text-align:center}
.empty h3{font-size:18px;font-weight:600}
.empty p{font-size:14.5px;color:var(--ink70);margin:8px auto 0;max-width:34em}
.bar{position:sticky;bottom:0;background:var(--ink);color:#fff}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px}
.ruler{height:8px;background:var(--paper);border-radius:4px;overflow:hidden;margin-top:12px}
.ruler i{display:block;height:100%}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink40);margin-top:4px}
.dot{width:8px;height:8px;border-radius:2px;border:1px solid var(--line);flex:none}
.dot.on{background:var(--accent);border-color:var(--accent)}
.cov{display:grid;gap:6px;margin-top:10px}
.cov div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink40)}
.cov div.on{color:var(--ink)}
textarea{width:100%;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;color:var(--ink70);background:none;border:none;padding:12px;resize:vertical;display:block}
.testrow{padding:12px;border-top:1px solid var(--lineSoft)}
.testrow:first-child{border-top:none}
.testrow.ok{background:var(--okSoft)}
.note{background:var(--ink);color:#D6E0E8;border-radius:10px;padding:16px;margin-top:12px}
.warnbox{border-radius:8px;padding:12px;display:flex;gap:10px;font-size:14px;line-height:1.5;margin-bottom:8px}
.ackbox{background:var(--warnSoft);border-radius:6px;padding:8px;margin-top:10px;display:flex;gap:8px;font-size:13.5px;color:var(--warn);line-height:1.45;cursor:pointer}
.fmtcard{border-top:1px solid var(--lineSoft);padding:16px}
.fmtcard:first-child{border-top:none}
footer{padding:32px 0;font-size:12.5px;color:var(--ink40);line-height:1.6}
h2{font-size:22px;font-weight:600}
h3.s{font-size:16.5px;font-weight:600}
svg.ic{flex:none}
/* ── institutional brand bar ── */
.brandbar{background:#FFFFFF;border-bottom:2px solid #C2A87A}
.brandbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px}
.brandbar .bl{height:54px;width:auto;display:block;flex:none}
.brandbar .br{height:46px;width:auto;display:block;flex:none;border-radius:2px}
.brandtitle{font-family:Georgia,'Times New Roman',serif;font-size:22px;letter-spacing:.24em;
  color:#1B3B63;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:16px;font-weight:600}
.brandtitle:before,.brandtitle:after{content:"";width:26px;height:1.5px;background:#1B3B63;display:block}
@media(max-width:700px){
  .brandbar .wrap{padding:10px 14px;gap:10px}
  .brandtitle{font-size:14px;letter-spacing:.12em;gap:8px}
  .brandtitle:before,.brandtitle:after{width:12px}
  .brandbar .bl{height:36px}.brandbar .br{height:30px}
}
@media(max-width:400px){.brandtitle:before,.brandtitle:after{display:none}}
</style>
</head>

/* ── engine ── */
function evaluate(i,f){
  let score=50; const why=[],flags=[];
  if(f.constructs.length && !i.tags.some(t=>f.constructs.indexOf(t)>=0)) return null;
  if(f.budget && i.minutes>Number(f.budget)) return null;
  if(f.licence!=="" && LICENCE[i.licence].tier>Number(f.licence)) return null;
  if(f.population && i.populations.indexOf(f.population)<0) return null;
  if(f.constructs.length){
    const hit=i.tags.filter(t=>f.constructs.indexOf(t)>=0).map(cLabel);
    score+=22; why.push("Measures "+hit.join(" and ").toLowerCase());
  }
  if(f.population){score+=8;why.push("Validated with this group");}
  if(f.budget){score+=Math.max(0,12-i.minutes*2);why.push("About "+i.minutes+" min of respondent time");}
  const win=t=>t==="general"?"life in general":t==="recent"?"the past weeks":"the present moment";
  if(f.timeframe){
    if(i.timeframe==="any"){score+=14;why.push("Time window is set by your instructions, so it fits any design");}
    else if(i.timeframe===f.timeframe){score+=16;why.push("Asks about "+win(f.timeframe));}
    else{score-=22;flags.push("Written for "+win(i.timeframe)+" — rewording the window changes the construct, not just the wording");}
  }
  if(f.purpose==="prepost"||f.purpose==="diary"){
    if(i.sensitivity==="high"){score+=20;why.push("Sensitive enough to register change");}
    else if(i.sensitivity==="moderate"){score+=6;}
    else{score-=18;flags.push("Built as a stable trait measure — expect it to move very little between your two time points");}
    if(f.purpose==="diary"&&i.minutes>3){score-=14;flags.push(i.minutes+" minutes is heavy for repeated daily administration");}
    if(f.purpose==="diary"&&i.timeframe==="general") score-=10;
  }
  if(f.purpose==="survey"&&i.minutes<=3){score+=8;why.push("Cheap enough to add to an omnibus survey");}
  if(f.purpose==="screen"){
    if(i.family==="ill_being"||i.tags.indexOf("wbscreen")>=0){score+=16;why.push("Has published bands for describing a sample");}
    if(i.items>0&&i.items<=7){score+=8;why.push("Short enough for screening at scale");}
  }
  if(f.purpose==="crosscult"){
    if(i.translations){score+=12;why.push("Widely translated and used across countries");}
    else{score-=14;flags.push("Few published translations — you would be validating it yourself");}
    if(i.format.type==="likert"&&i.items>=20&&i.id.indexOf("panas")===0) flags.push("Adjective lists are the hardest thing to translate — use the validated version in your language rather than translating yourself");
    if(i.format.type==="forced") flags.push("Forced-choice blocks are notoriously hard to translate while keeping the intensity ordering intact");
    if(i.format.type==="pictorial"){score+=8;why.push("Pictorial format means nothing is lost in translation");}
  }
  if(f.output){
    if(f.output===i.output){score+=12;why.push(f.output==="single"?"Produces one score":"Produces subscales you can report separately");}
    else{score-=10;flags.push(f.output==="single"?"Produces subscales rather than a single score":"Produces one composite only — no subscales");}
  }
  if(f.analysis==="factor"){
    if(i.items>=10){score+=12;why.push("Enough items to support a factor model");}
    else{score-=20;flags.push((i.items||"No")+" items is thin for factor analysis or SEM");}
    if(i.level==="single_item") flags.push("A single item cannot be factor-analysed at all");
  }
  if(f.analysis==="change"&&i.sensitivity==="low"){score-=16;flags.push("Low sensitivity to change — a null result here may be the instrument, not the intervention");}
  if(f.analysis==="means"&&(i.level==="interval_rasch"||i.level==="ratio"||i.level==="interval")){score+=10;why.push("Scale level supports parametric statistics without an assumption you have to defend");}
  if((f.analysis==="means"||f.analysis==="corr")&&i.level==="single_item"){score-=12;flags.push("Single item: no reliability estimate to report, and reviewers often push back");}
  if(i.isMechanism&&(f.purpose==="prepost"||f.analysis==="change")) flags.push("This is a mechanism measure, not an outcome — use it to explain a change, not to demonstrate one");
  if(i.licence==="commercial") flags.push("Paid licence: budget for per-respondent fees before you design around it");
  if(i.family==="nonselfreport") flags.push("Not a questionnaire — plan for equipment, assay or coding costs and the ethics that come with them");
  if(i.safety) flags.push(i.safety);
  if(i.safetyNote) flags.push(i.safetyNote);
  return {inst:i,score:Math.max(1,Math.min(99,Math.round(score))),why:why.slice(0,3),flags};
}

/* ── strips ── */
function strip(fmt,w,h){
  w=w||104;h=h||16;
  const p=1,n=fmt.points,step=(w-2*p)/((n-1)||1);
  let s=`<svg width="${w}" height="${h}" aria-hidden="true">`;
  if(fmt.type==="ladder"){
    for(let k=0;k<n;k++){const x=p+k*step,bh=3+(k/(n-1))*(h-4);
      s+=`<rect x="${x}" y="${h-bh}" width="2" height="${bh}" fill="${k===n-1?C.pos:C.line}"/>`;}
  }else if(fmt.type==="forced"){
    const bw=(w-2*p)/n;
    for(let k=0;k<n;k++) s+=`<rect x="${p+k*bw}" y="2" rx="1" width="${Math.max(3,bw-3)}" height="${h-4}" fill="${k===0?"#DDEAF0":"none"}" stroke="${C.line}"/>`;
  }else if(fmt.type==="numeric"||fmt.type==="percent"){
    s+=`<line x1="${p}" y1="${h/2}" x2="${w-p}" y2="${h/2}" stroke="${C.line}"/>`;
    for(let k=0;k<n;k++){const x=p+k*step,tall=(k===0||k===n-1||k===(n-1)/2);
      s+=`<line x1="${x}" y1="${h/2-(tall?6:3)}" x2="${x}" y2="${h/2+(tall?6:3)}" stroke="${tall?C.accent:C.line}" stroke-width="${tall?1.5:1}"/>`;}
  }else if(fmt.type==="vas"){
    s+=`<line x1="${p}" y1="${h/2}" x2="${w-p}" y2="${h/2}" stroke="${C.line}" stroke-width="1.5"/>`;
    s+=`<line x1="${p}" y1="${h/2-5}" x2="${p}" y2="${h/2+5}" stroke="${C.accent}" stroke-width="1.5"/>`;
    s+=`<line x1="${w-p}" y1="${h/2-5}" x2="${w-p}" y2="${h/2+5}" stroke="${C.accent}" stroke-width="1.5"/>`;
    s+=`<circle cx="${p+(w-2*p)*0.62}" cy="${h/2}" r="4" fill="${C.pos}"/>`;
  }else if(fmt.type==="pictorial"){
    if(fmt.sub==="venn"){
      for(let k=0;k<3;k++){const cx=14+k*34;
        s+=`<circle cx="${cx-4+k*1.5}" cy="${h/2}" r="5.5" fill="none" stroke="${C.line}"/>`;
        s+=`<circle cx="${cx+4-k*1.5}" cy="${h/2}" r="5.5" fill="none" stroke="${k===2?C.accent:C.line}"/>`;}
    }else{
      s+=`<rect x="1" y="1" width="${h-2}" height="${h-2}" fill="none" stroke="${C.line}"/>`;
      for(let k=1;k<3;k++){s+=`<line x1="${1+k*(h-2)/3}" y1="1" x2="${1+k*(h-2)/3}" y2="${h-1}" stroke="${C.line}"/>`;
        s+=`<line x1="1" y1="${1+k*(h-2)/3}" x2="${h-1}" y2="${1+k*(h-2)/3}" stroke="${C.line}"/>`;}
      s+=`<circle cx="${h*0.62}" cy="${h*0.38}" r="2.5" fill="${C.accent}"/>`;
    }
  }else if(fmt.type==="other"){
    s+=`<path d="M${p} ${h/2} q ${w/8} -7, ${w/4} 0 t ${w/4} 0 t ${w/4} 0 t ${w/4} 0" fill="none" stroke="${C.ink40}" stroke-width="1.3"/>`;
  }else{
    const st=(w-2*p-6)/((n-1)||1);
    for(let k=0;k<n;k++) s+=`<circle cx="${p+3+k*st}" cy="${h/2}" r="3" fill="${k===n-1?C.accent:"none"}" stroke="${k===n-1?C.accent:C.line}"/>`;
  }
  return s+"</svg>";
}

/* ── rendered scale mock ── */
function mockScale(fmt,anchors,stem,isBlock){
  const n=fmt.points;
  const q=stem?`<div class="mockq">${stem}</div>`:"";
  if(fmt.type==="other"){
    return `<div class="mock">${q}<div class="small" style="margin-top:8px">${anchors[0]||""}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">${strip(fmt,120,18)}<span class="mono tiny">continuous / physical units</span></div></div>`;
  }
  if(fmt.type==="vas"){
    return `<div class="mock">${q}
      <div style="position:relative;margin-top:16px;height:34px">
        <div style="position:absolute;left:0;right:0;top:14px;height:2px;background:var(--ink40)"></div>
        <div style="position:absolute;left:0;top:6px;width:2px;height:18px;background:var(--ink)"></div>
        <div style="position:absolute;right:0;top:6px;width:2px;height:18px;background:var(--ink)"></div>
        <div style="position:absolute;left:62%;top:8px;width:14px;height:14px;border-radius:50%;background:var(--pos);border:2px solid #fff"></div>
      </div>
      <div class="mockends"><span>${anchors[0]||""}</span><span>${anchors[anchors.length-1]||""}</span></div></div>`;
  }
  if(fmt.type==="pictorial"&&fmt.sub==="venn"){
    let cells="";
    for(let k=0;k<n;k++){
      const off=13-k*1.7;
      cells+=`<div class="mockopt"><svg width="42" height="26" aria-hidden="true">
        <circle cx="${21-off}" cy="13" r="10" fill="none" stroke="${k===3?C.accent:C.ink40}" stroke-width="1.3"/>
        <circle cx="${21+off}" cy="13" r="10" fill="none" stroke="${k===3?C.accent:C.ink40}" stroke-width="1.3"/></svg>
        <span class="mocknum">${k+1}</span></div>`;
    }
    return `<div class="mock">${q}<div class="mockrow">${cells}</div>
      <div class="mockends"><span>separate</span><span>merged</span></div></div>`;
  }
  if(fmt.type==="pictorial"){
    let grid=`<svg width="150" height="150" aria-hidden="true">`;
    for(let r=0;r<9;r++) for(let c=0;c<9;c++)
      grid+=`<rect x="${3+c*16}" y="${3+r*16}" width="16" height="16" fill="none" stroke="${C.line}"/>`;
    grid+=`<circle cx="${3+6.5*16}" cy="${3+2.5*16}" r="5" fill="${C.accent}"/></svg>`;
    return `<div class="mock">${q}
      <div style="display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap">
        ${grid}
        <div class="small" style="max-width:16em">${anchors.map(a=>"<div>"+a+"</div>").join("")}</div>
      </div></div>`;
  }
  if(fmt.type==="percent"){
    let row="";
    for(let k=0;k<n;k++) row+=`<div class="mockopt"><span class="mockcirc${k===7?" on":""}"></span><span class="mocknum">${k}</span></div>`;
    return `<div class="mock">${q}<div class="mockrow">${row}</div>
      <div class="mockends"><span>${anchors[0]||""}</span><span>${anchors[anchors.length-1]||""}</span></div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        ${["Happy","Unhappy","Neutral"].map(l=>`<span class="mono" style="font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:#fff">${l} <b style="color:var(--accent)">___</b> %</span>`).join("")}
        <span class="mono tiny" style="align-self:center">must total 100</span>
      </div></div>`;
  }
  if(fmt.type==="forced"||isBlock){
    const opts=anchors.length===n?anchors:Array.from({length:n},(_,k)=>"Option "+k);
    return `<div class="mock">${q}<div style="margin-top:10px">${
      opts.map((o,k)=>`<div class="mockblock"><span class="mockcirc${k===1?" on":""}"></span>
        <div><span class="mono" style="font-size:11px;color:var(--ink40)">${k}</span>
        <div style="font-size:14px;line-height:1.4">${o}</div></div></div>`).join("")
    }</div></div>`;
  }
  if(fmt.type==="ladder"){
    let rungs="";
    for(let k=n-1;k>=0;k--){
      rungs+=`<div style="display:flex;align-items:center;gap:8px">
        <span class="mono" style="font-size:11px;color:var(--ink40);width:14px;text-align:right">${k}</span>
        <span style="flex:1;height:${k===7?"3px":"2px"};background:${k===7?C.accent:C.line};max-width:120px"></span>
        ${k===n-1?`<span class="mono tiny">${anchors[anchors.length-1]||""}</span>`:(k===0?`<span class="mono tiny">${anchors[0]||""}</span>`:(k===7?`<span class="mono tiny" style="color:${C.accent}">respondent's answer</span>`:""))}
      </div>`;
    }
    return `<div class="mock">${q}<div style="display:grid;gap:3px;margin-top:10px">${rungs}</div></div>`;
  }
  if(fmt.type==="numeric"){
    let row="";
    for(let k=0;k<n;k++) row+=`<div class="mockopt"><span class="mockcirc${k===7?" on":""}"></span><span class="mocknum">${k}</span></div>`;
    return `<div class="mock">${q}<div class="mockrow">${row}</div>
      <div class="mockends"><span>${anchors[0]||""}</span><span>${anchors[anchors.length-1]||""}</span></div></div>`;
  }
  // likert
  const labs=(anchors.length===n)?anchors:Array.from({length:n},(_,k)=>String(k+1));
  const pick=Math.min(n-1,Math.max(0,Math.round(n*0.72)-1));
  let row="";
  for(let k=0;k<n;k++) row+=`<div class="mockopt"><span class="mockcirc${k===pick?" on":""}"></span>
    <span class="mocknum">${k+1}</span><span class="mocklab">${labs[k]||""}</span></div>`;
  return `<div class="mock">${q}<div class="mockrow">${row}</div></div>`;
}

/* ── small bits ── */
function anchorRow(list,start){
  start=(start===undefined)?1:start;
  if(!list.length) return `<div class="tiny">No fixed response scale.</div>`;
  return `<div class="anch">${list.map((a,k)=>{
    const num=/^\d/.test(a)?"":`<b>${start+k}</b> `;
    return `<span>${a===""?num+"—":num+a}</span>`;}).join("")}</div>`;
}
function licPill(l){
  const t=LICENCE[l].tier;
  const bg=["#DFEDE5","#E7EBEE","#F7EBD8","#F6E2DF","#F6E2DF"][t],fg=[C.ok,C.ink70,C.pos,C.warn,C.warn][t];
  return `<span class="pill mono" style="background:${bg};color:${fg}">${LICENCE[l].label}</span>`;
}
const winLabel=t=>t==="any"?"any":t==="general"?"life in general":t==="recent"?"past weeks":"right now";
const answered=()=>{let n=S.f.constructs.length?1:0;
  ["purpose","timeframe","population","budget","licence","output","analysis"].forEach(k=>{if(S.f[k]!=="")n++;});return n;};
function dbHref(i){return i.dbUrl?i.dbUrl:DB_HOME+"#:~:text="+encodeURIComponent(i.dbLookup);}
function webHref(i){return "https://www.google.com/search?q="+encodeURIComponent('site:db.arabpsychology.com "'+i.dbLookup+'"');}
function copyText(t){
  try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");document.body.removeChild(ta);
    if(ok) return true;}catch(e){}
  if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>{});return true;}
  return false;
}
const itemsLabel=i=>i.items===0?"no fixed items":(i.items+" "+(i.items===1?"item":"items"));

/* ── views ── */
function vConstructFilter(){
  const q=S.q.trim().toLowerCase();
  const shown=CONSTRUCTS.filter(c=>!q||c.l.toLowerCase().indexOf(q)>=0||FAMILIES[c.f].toLowerCase().indexOf(q)>=0);
  const counts={};
  CONSTRUCTS.forEach(c=>{counts[c.id]=INSTRUMENTS.filter(i=>i.tags.indexOf(c.id)>=0).length;});
  let html="",lastF=null,open=false;
  shown.forEach(c=>{
    if(c.f!==lastF){
      if(open) html+="</div>";
      const famN=CONSTRUCTS.filter(x=>x.f===c.f).length;
      html+=`<div class="cfam"><span>${FAMILIES[c.f].toUpperCase()}</span><span>${famN}</span></div><div class="opts" style="margin-top:0">`;
      lastF=c.f;open=true;
    }
    const on=S.f.constructs.indexOf(c.id)>=0;
    html+=`<button class="opt${on?" on":""}" data-act="con" data-val="${c.id}">${c.l} <span style="opacity:.55">${counts[c.id]}</span></button>`;
  });
  if(open) html+="</div>";
  const n=S.f.constructs.length;
  return `<div class="fgroup">
    <h4>What are you measuring?</h4>
    <div class="help">${CONSTRUCTS.length} constructs across ${Object.keys(FAMILIES).length} families, with the number of instruments for each. Leave blank to see everything; pick several if your study spans more than one.</div>
    <input type="text" id="cq" placeholder="filter constructs…" value="${S.q.replace(/"/g,"&quot;")}">
    <div class="clist">${shown.length?html:`<div class="tiny" style="padding:8px 0">No construct matches “${S.q}”.</div>`}</div>
    ${n?`<div class="selbar"><span class="mono tiny">${n} selected</span>
      <button class="btn quiet mono" data-act="clearcon">${ic.cross()} Clear</button></div>`:""}
  </div>`;
}
function vFilters(){
  const groups=FILTERS.map(flt=>{
    const opts=flt.options.map(o=>{
      const on=S.f[flt.key]===o.v;
      return `<button class="opt${on?" on":""}" data-act="filter" data-key="${flt.key}" data-val="${o.v}">${o.l}</button>`;
    }).join("");
    return `<div class="fgroup"><h4>${flt.label}</h4>${flt.help?`<div class="help">${flt.help}</div>`:""}<div class="opts">${opts}</div></div>`;
  }).join("");
  return `<aside>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="mono label">FILTERS · ${answered()} OF 8 SET</span>

    </div>
    <div class="panel">${vConstructFilter()}${groups}</div>
    <p class="tiny" style="margin-top:10px;line-height:1.45">Nothing here is required. Each answer narrows the list and adds a line of reasoning under every result.</p>
  </aside>`;
}
function det(label,val){return `<div><div class="mono label">${label.toUpperCase()}</div><div class="dval">${val}</div></div>`;}

function vCard(r){
  const i=r.inst,open=S.expanded===i.id,inB=S.battery.indexOf(i.id)>=0,inC=S.compare.indexOf(i.id)>=0,a=answered();
  const fitColor=r.score>=75?C.ok:r.score>=55?C.ink:C.ink40;
  const why=r.why.length?`<ul class="why">${r.why.map(w=>`<li>${ic.check()}${w}</li>`).join("")}</ul>`:"";
  const flags=r.flags.length?`<div class="flags">${r.flags.map(f=>`<div class="flag">${i.safety===f?ic.shield():ic.alert()}<span>${f}</span></div>`).join("")}</div>`:"";
  const detail=open?`<div class="detail">
      <div class="dgrid">
        <div class="full">
          <div class="mono label">WHAT THE RESPONDENT SEES</div>
          ${mockScale(i.format,i.anchors,"<em>[item wording not reproduced — see the source]</em>")}
          ${i.anchorNote?`<div class="tiny" style="margin-top:6px;line-height:1.45">${i.anchorNote}</div>`:""}
        </div>
        ${det("Measures",i.constructs.join(" · "))}
        ${det("Scoring",i.scoring)}
        ${det("State or trait",(i.stateTrait==="either"?"either — set by the instruction wording":i.stateTrait)+" · "+winLabel(i.timeframe))}
        ${det("Sensitivity to change",i.sensitivity.replace("_","–"))}
        <div class="full">${det("Use it when","<ul>"+i.bestFor.map(b=>"<li>— "+b+"</li>").join("")+"</ul>")}</div>
        <div class="full">${det("Don't use it when","<ul>"+i.avoid.map(b=>"<li>— "+b+"</li>").join("")+"</ul>")}</div>
        <div class="full">${det("Citation",'<span class="mono" style="font-size:12.5px">'+i.citation+"</span>")}</div>
      </div>
      <p class="mono tiny" style="margin-top:12px;line-height:1.5">The mock above shows the published response format only — item wording is not reproduced. Reliability figures come from secondary sources; verify against the citation before you publish.</p>
    </div>`:"";
  return `<article class="card${inC?" cmp":""}">
    <div class="pad">
      <div class="chead">
        <div style="min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
            <span class="abbr">${i.abbrev}</span><span class="fullname">${i.name}</span>
          </div>
          <div class="mono tiny" style="margin-top:2px">${i.authors} · ${i.year}</div>
        </div>
        ${a?`<div><div class="fit mono" style="color:${fitColor}">${r.score}</div><div class="fitl mono">FIT</div></div>`:""}
      </div>
      <div class="meta">
        <span style="display:flex;align-items:center;gap:8px">${strip(i.format)}<span class="mono" style="font-size:12px;color:${C.ink70}">${i.format.label}</span></span>
        <span class="pill mono">${itemsLabel(i)}</span>

        ${licPill(i.licence)}
      </div>
      ${why}${flags}
      <div class="acts">
        <button class="btn mono${inB?" solid":""}" data-act="bat" data-id="${i.id}">${inB?ic.tick()+" In battery":ic.plus()+" Add to battery"}</button>
        <button class="btn mono${inC?" solid":""}" data-act="cmp" data-id="${i.id}" ${(!inC&&S.compare.length>=4)?"disabled title='Comparison holds four at a time'":""}>${ic.layers()} ${inC?"Comparing":"Compare"}</button>
        <button class="btn quiet mono" data-act="exp" data-id="${i.id}">${open?"Less":"Details & scale"}</button>
        <a class="btn link mono" href="${dbHref(i)}" target="_blank" rel="noreferrer noopener" data-act="dbl" data-id="${i.id}">${ic.ext()} ${i.dbUrl?"Get the instrument":"Look up on scales DB"}</a>
        ${i.dbUrl?"":`<a class="btn quiet mono" href="${webHref(i)}" target="_blank" rel="noreferrer noopener">${ic.search()} web search</a>`}

        :(i.dbUrl?"":`<div class="mono" style="font-size:11.5px;color:${C.ink40};margin-top:6px">opens the A–Z index and jumps to “${i.dbLookup}”</div>`)}
    </div>${detail}

}

function vFind(){
  const res=INSTRUMENTS.map(i=>evaluate(i,S.f)).filter(Boolean).sort((a,b)=>b.score-a.score);
  const head=`<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px">
      <div><span class="mono" style="font-size:22px;font-weight:600">${res.length}</span><span class="mono small"> of ${INSTRUMENTS.length} match</span></div>
      ${answered()===0?`<span class="mono tiny">Unfiltered — answer one question to rank these</span>`:""}
    </div>`;
  const body=res.length?res.map(vCard).join(""):
    `<div class="panel pad" style="padding:24px">
       <div style="font-weight:600;font-size:15.5px">Nothing matches all of those constraints.</div>
       <p class="small" style="margin-top:6px">The usual culprits are the minute budget and the population filter. Loosen one and the list comes back.</p>
       <div style="margin-top:12px"><button class="btn mono" data-act="clear">${ic.reset()} Clear filters</button></div>
     </div>`;
  return `<div class="cols find">${vFilters()}<section>${head}${body}</section></div>`;
}

function vCompare(){
  if(S.compare.length<2) return empty("Pick two to four instruments to compare",
    "Comparison is where the decision usually gets made — the rows that differ are the ones that matter. Add instruments from the Find tab.");
  const list=S.compare.map(byId);
  const rows=[
    ["Family",i=>FAMILIES[i.family]],
    ["Constructs",i=>i.tags.map(cLabel).join(", ")],
    ["Items",i=>itemsLabel(i)],
    ["Response format",i=>i.format.label,"strip"],
    ["Response scale",i=>i.anchors.join(" · "),"anch"],
    ["Minutes",i=>String(i.minutes)],
    ["State or trait",i=>i.stateTrait==="either"?"either, by instruction":i.stateTrait],
    ["Time window",i=>winLabel(i.timeframe)],
    ["Output",i=>i.output==="single"?"one score":"subscales"],
    ["Scale level",i=>LEVELS[i.level].short],
    ["Reliability (α)",i=>i.alpha],
    ["Sensitivity to change",i=>i.sensitivity.replace("_","–")],
    ["Licence",i=>LICENCE[i.licence].label],
    ["Scoring",i=>i.scoring]
  ];
  const shown=rows.filter(r=>{if(!S.diffOnly)return true;return new Set(list.map(r[1])).size>1;});
  const head=`<tr><th style="width:130px"></th>${list.map(i=>`<th>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div><div style="font-size:15.5px;font-weight:600">${i.abbrev}</div><div class="mono tiny" style="font-weight:400">${i.year}</div></div>
        <button data-act="cmp" data-id="${i.id}" title="Remove" style="color:${C.ink40}">${ic.cross()}</button>
      </div></th>`).join("")}</tr>`;
  const cell=(r,i)=>{
    if(r[2]==="strip") return `<div style="display:flex;flex-direction:column;gap:4px">${strip(i.format,88)}<span style="font-size:12.5px;color:${C.ink70}">${r[1](i)}</span></div>`;
    if(r[2]==="anch") return anchorRow(i.anchors);
    return r[1](i);
  };
  const body=shown.length?shown.map(r=>`<tr><td class="rl">${r[0].toUpperCase()}</td>${list.map(i=>`<td>${cell(r,i)}</td>`).join("")}</tr>`).join("")
    :`<tr><td colspan="${list.length+1}" class="small">These instruments match on every compared row. Turn off “differences only” to see the full table.</td></tr>`;
  const mocks=list.map(i=>`<div>
      <div class="mono label">${i.abbrev.toUpperCase()}</div>
      ${mockScale(i.format,i.anchors,"<em>[item wording not reproduced]</em>")}</div>`).join("");
  return `<section>
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px">
      <h2>${S.compare.length} instruments side by side</h2>
      <div style="display:flex;gap:8px">
        <button class="btn mono${S.diffOnly?" solid":""}" data-act="diff">${S.diffOnly?ic.tick():""} Differences only</button>
        <button class="btn quiet mono" data-act="clearcmp">${ic.cross()} Clear</button>
      </div>
    </div>
    <div class="tblwrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <h3 class="s" style="margin-top:24px">What each one looks like to the respondent</h3>
    <div style="display:grid;gap:14px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${mocks}</div>
    <p class="small" style="margin-top:12px">Different rulers. A four-point forced-choice block and an eleven-point ladder do not produce comparable numbers, and averaging across them is not a neutral act.</p>
  </section>`;
}

function vBattery(){
  const list=S.battery.map(byId);
  const mins=list.reduce((s,i)=>s+i.minutes,0),items=list.reduce((s,i)=>s+i.items,0);
  if(!list.length) return `<div class="cols bat"><div>${empty("Your battery is empty",
    "Most well-being studies need two or three instruments: one for the cognitive side, one for affect, and often one for distress. Add them from Find and this page will check the combination.")}</div>${vBurden(0,0,[])}</div>`;
  const warn=[];
  for(let a=0;a<list.length;a++) for(let b=a+1;b<list.length;b++)
    if(list[a].redundant.indexOf(list[b].id)>=0||list[b].redundant.indexOf(list[a].id)>=0)
      warn.push({k:"r",t:list[a].abbrev+" and "+list[b].abbrev+" cover much the same ground. Keep one unless you specifically want to compare the two measures."});
  if(mins>20) warn.push({k:"r",t:mins+" minutes is long enough that drop-out and careless responding become real threats. Consider cutting the weakest instrument."});
  if(S.f.purpose==="prepost"&&!list.some(i=>i.sensitivity==="high"))
    warn.push({k:"r",t:"You're measuring change but nothing in this battery is highly sensitive to change. A null result would be hard to interpret."});
  const fams=new Set(list.map(i=>i.family));
  if(list.length>=2&&!fams.has("affect")&&!fams.has("life_evaluation"))
    warn.push({k:"g",t:"No affect or life-evaluation measure yet. Most reviewers expect at least one of the two core well-being components."});
  if(list.length>=2&&!fams.has("ill_being"))
    warn.push({k:"g",t:"No ill-being measure. Adding one lets you show your effect is more than reduced distress."});
  if(list.length>=3&&!fams.has("nonselfreport")&&!fams.has("method"))
    warn.push({k:"g",t:"Everything here is self-report. One behavioural, biological or informant measure turns a single-method study into a multi-method one."});
  const fmts=new Set(list.map(i=>i.format.points+i.format.type));
  if(fmts.size>=4) warn.push({k:"g",t:fmts.size+" different response formats in one questionnaire. Group instruments that share a scale so respondents aren't re-learning the ruler on every page."});
  const cards=list.map(i=>`<div class="panel pad" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px">
    <div style="min-width:0">
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><strong style="font-size:15.5px">${i.abbrev}</strong><span class="small">${i.name}</span></div>
      <div class="meta" style="margin-top:8px">
        <span class="pill mono">${FAMILIES[i.family]}</span><span class="pill mono">${itemsLabel(i)}</span>
        <span class="pill mono">${ic.clock()} ${i.minutes} min</span>${licPill(i.licence)}
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">${strip(i.format,88,14)}<span class="mono tiny">${i.format.label}</span></div>
      ${i.safety?`<label class="ackbox"><input type="checkbox" data-act="ack" data-id="${i.id}" ${S.ack[i.id]?"checked":""}>
        <span><strong>Response protocol required.</strong> ${i.safety}${S.ack[i.id]?" — acknowledged.":""}</span></label>`:""}
    </div>
    <button class="btn quiet mono" data-act="bat" data-id="${i.id}">${ic.cross()}</button>
  </div>`).join("");
  const warns=warn.length?`<div style="margin-top:16px">${warn.map(w=>
    `<div class="warnbox" style="background:${w.k==="g"?"#F7EBD8":"#F6E2DF"};color:${w.k==="g"?C.pos:C.warn}">${w.k==="g"?ic.alert(C.pos):ic.alert(C.warn)}<span>${w.t}</span></div>`).join("")}</div>`:"";
  const lines=list.map(i=>{
    const fmt=i.items===0?"non-questionnaire":(i.items===1?"single-item":i.items+"-item");
    const a=i.alpha.indexOf("n/a")===0?"":" (reported α = "+i.alpha+")";
    const c=i.constructs[0].charAt(0).toUpperCase()+i.constructs[0].slice(1);
    return c+" was assessed with the "+i.name+" ("+i.abbrev+"; "+i.authors+", "+i.year+"), a "+fmt+" measure using a "+i.format.label+" response format"+a+". "+i.scoring;
  });
  const methods="Measures\n\n"+lines.join("\n\n")+"\n\nTotal estimated respondent time: "+mins+" minutes ("+items+" questionnaire items).\n\nReferences\n\n"+list.map(i=>i.citation).sort().join("\n\n");
  return `<div class="cols bat">
    <div>
      <h2 style="margin-bottom:12px">${list.length} ${list.length===1?"instrument":"instruments"}</h2>
      ${cards}${warns}
      <div class="panel" style="margin-top:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--lineSoft)">
          <strong style="font-size:15.5px">Methods paragraph</strong>
          <button class="btn mono" data-act="copy">${S.copied?ic.tick()+" Copied":ic.copy()+" Copy"}</button>
        </div>
        <textarea id="methods" readonly rows="12">${methods.replace(/</g,"&lt;")}</textarea>
        <div class="mono tiny" style="padding:0 12px 12px">A first draft, not a submission. Check every α and score range against the primary source.</div>
      </div>
    </div>
    ${vBurden(mins,items,list)}
  </div>`;
}
function vBurden(mins,items,list){
  const pct=Math.min(100,(mins/40)*100),col=mins>25?C.warn:mins>15?C.pos:C.ok;
  const msg=mins===0?"Nothing added yet.":mins<=5?"Comfortable. You could afford another measure.":
    mins<=12?"Reasonable for a one-off survey with motivated respondents.":
    mins<=25?"Getting long. Fine for a lab study, risky for an online panel.":"Long enough that fatigue will show up in your data.";
  const cov=list.length?`<div class="panel pad" style="margin-top:12px">
      <div class="mono label">COVERAGE</div><div class="cov">${
        Object.keys(FAMILIES).map(k=>{const on=list.some(i=>i.family===k);
          return `<div class="${on?"on":""}"><span class="dot${on?" on":""}"></span>${FAMILIES[k]}</div>`;}).join("")
      }</div></div>`:"";
  return `<aside>
    <div class="panel pad">
      <div class="mono label">RESPONDENT BURDEN</div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-top:8px">
        <span class="mono" style="font-size:34px;font-weight:600;line-height:1">${mins}</span>
        <span class="mono small">min · ${items} items</span>
      </div>
      <div class="ruler"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="ticks mono">${[0,10,20,30,40].map(m=>"<span>"+m+"</span>").join("")}</div>
      <div class="small" style="margin-top:10px">${msg}</div>
    </div>${cov}
  </aside>`;
}

function vLevels(){
  const L=LEVELS[S.level];
  const picks=LORDER.map(k=>`<button class="btn mono${S.level===k?" solid":""}" data-act="lvl" data-val="${k}" style="padding:6px 10px">${LEVELS[k].short}</button>`).join("");
  const exs=L.ex.map(id=>{const i=byId(id);
    return `<span class="pill" style="gap:8px">${strip(i.format,56,12)}<span class="mono" style="font-size:12px">${i.abbrev}</span></span>`;}).join("");
  const tests=TESTS.map(t=>{
    const ok=LRANK[S.level]>=t.needs;
    return `<div class="testrow${ok?" ok":""}"><div style="display:flex;gap:8px">${ok?ic.check():ic.x(C.ink40)}
      <div><div style="font-size:14.5px;font-weight:600;color:${ok?C.ink:C.ink70}">${t.t}</div>
      <div style="font-size:13.5px;color:${ok?C.ink70:C.ink40};margin-top:2px;line-height:1.45">${t.note}</div></div></div></div>`;
  }).join("");
  const fmts=FORMATS.map(f=>`<div class="fmtcard">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${strip(f.fmt,88,14)}<strong style="font-size:15.5px">${f.name}</strong>
        <span class="mono tiny">${f.fmt.points?f.fmt.points+" points":"continuous"}</span>
      </div>
      <div class="small" style="margin-top:8px">${f.note}</div>
      ${mockScale(f.fmt,f.ex,f.stem,f.isBlock)}
      <div class="mono tiny" style="margin-top:8px">used by ${f.used}</div>
    </div>`).join("");
  return `<section>
  <div class="cols lvl">
    <div>
      <h2>From scale level to statistics</h2>
      <p class="small" style="margin-top:6px">Pick a scale level to see what it permits. Or scan the test list and work backwards to the level it demands. Nominal scales are absent because well-being responses are always ordered.</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px">${picks}</div>
      <div class="panel pad">
        <h3 class="s">${L.name}</h3>
        <p class="small" style="margin-top:6px">${L.what}</p>
        <div style="margin-top:16px">
          <div class="mono" style="font-size:11px;letter-spacing:.1em;color:${C.ok}">YOU CAN</div>
          <ul class="why" style="margin-top:6px">${L.can.map(c=>`<li style="color:${C.ink}">${ic.check()}${c}</li>`).join("")}</ul>
        </div>
        <div style="margin-top:14px">
          <div class="mono" style="font-size:11px;letter-spacing:.1em;color:${C.warn}">YOU CAN'T</div>
          <ul class="why" style="margin-top:6px">${L.cant.map(c=>`<li style="color:${C.ink}">${ic.x()}${c}</li>`).join("")}</ul>
        </div>
        <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--lineSoft)">
          <div class="mono label">IN THIS LIBRARY</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${exs}</div>
        </div>
      </div>
    </div>
    <div>
      <h3 class="s">Working backwards from your test</h3>
      <p class="small" style="margin-top:5px">Highlighted rows are supported by the level selected on the left.</p>
      <div class="panel" style="margin-top:12px">${tests}</div>
      <div class="note">
        <div class="mono" style="font-size:11px;letter-spacing:.1em;color:#8FA6B6">THE HONEST VERSION</div>
        <p style="font-size:14px;margin-top:6px;line-height:1.55">Almost every well-being finding in the literature rests on treating summed ordinal items as interval data. That convention is defensible and near-universal, but it is a convention. Say so in your methods section instead of waiting for a reviewer to say it for you.</p>
      </div>
    </div>
  </div>
  <div style="margin-top:32px">
    <h2>What each scale actually looks like</h2>
    <p class="small" style="margin-top:6px;max-width:54em">Eleven response formats cover all ${INSTRUMENTS.length} instruments in the library. Each example below is rendered the way a respondent would see it, with the standard published anchors. Item wording is not reproduced — the stems shown are generic placeholders. Changing an instrument's anchors breaks comparability with every published score, so treat these as fixed.</p>
    <div class="panel" style="margin-top:14px">${fmts}</div>
  </div>
  </section>`;
}
function empty(title,body){
  return `<div class="empty"><h3>${title}</h3><p>${body}</p>
    <div style="margin-top:16px;display:flex;justify-content:center"><button class="btn solid mono" data-act="tab" data-val="find">${ic.search()} Go to Find</button></div></div>`;
}

/* ── render ── */
function render(){
  const mins=S.battery.reduce((s,id)=>s+byId(id).minutes,0);
  const items=S.battery.reduce((s,id)=>s+byId(id).items,0);
  const tabs=[["find","Find",ic.search()],["compare","Compare"+(S.compare.length?" ("+S.compare.length+")":""),ic.layers()],
              ["battery","Battery"+(S.battery.length?" ("+S.battery.length+")":""),ic.scale()],["levels","Scales & levels",ic.ruler()]];
  const body=S.tab==="find"?vFind():S.tab==="compare"?vCompare():S.tab==="battery"?vBattery():vLevels();
  document.getElementById("app").innerHTML=`
  <div class="brandbar"><div class="wrap">
    <img class="bl" src="${LOGO_MIND}" alt="MIND Lab, Chandigarh University">
    <div class="brandtitle">Mind Lab</div>
    <img class="br" src="${LOGO_REKHI}" alt="Rekhi Foundation for Happiness">
  </div></div>
  <header><div class="wrap">
    <div class="htop">
      <div>
        <div class="eyebrow mono">WELL-BEING MEASUREMENT</div>
        <h1>Which measure?</h1>
        <p class="sub">One hundred instruments, one question at a time. Answer only what you know — every field is optional, and blank fields widen the results instead of blocking them.</p>
      </div>
      <div class="hstat mono"><div>${INSTRUMENTS.length} instruments</div><div>${CONSTRUCTS.length} constructs</div><div>${Object.keys(FAMILIES).length} families</div></div>
    </div>
    <nav>${tabs.map(t=>`<button class="mono${S.tab===t[0]?" on":""}" data-act="tab" data-val="${t[0]}">${t[2]} ${t[1]}</button>`).join("")}</nav>
  </div></header>
  <main><div class="wrap">${body}</div></main>
  ${S.battery.length&&S.tab!=="battery"?`<div class="bar"><div class="wrap">
      <span class="mono" style="font-size:13.5px">${S.battery.length} in battery · ${mins} min · ${items} items</span>
      <button class="btn mono" data-act="tab" data-val="battery" style="background:var(--paper);color:var(--ink);border-color:var(--paper)">Review battery</button>
    </div></div>`:""}
  <footer><div class="wrap">Metadata and standard response anchors only — no instrument items are reproduced here, and the rendered examples use generic placeholder stems. Every card links out to its source. Psychometric values are unverified secondary figures pending a check against each primary citation, and licence tiers should be confirmed with the original authors before any published use.</div></footer>`;
  if(S.focusQ){const el=document.getElementById("cq");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
}

/* ── events ── */
document.addEventListener("input",e=>{
  if(e.target.id==="cq"){S.q=e.target.value;S.focusQ=true;render();}
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act,id=el.dataset.id,val=el.dataset.val,key=el.dataset.key;
  if(a==="dbl"){const i=byId(id);copyText(i.dbLookup);S.copiedName=id;S.focusQ=false;setTimeout(render,0);return;}
  S.focusQ=(a==="con");
  if(a==="tab"){S.tab=val;S.copiedName=null;}
  else if(a==="con"){const arr=S.f.constructs,k=arr.indexOf(val);k>=0?arr.splice(k,1):arr.push(val);}
  else if(a==="clearcon"){S.f.constructs=[];}
  else if(a==="filter"){S.f[key]=S.f[key]===val?"":val;}
  else if(a==="clear"){S.f=JSON.parse(JSON.stringify(EMPTY));S.q="";}
  else if(a==="bat"){const k=S.battery.indexOf(id);k>=0?S.battery.splice(k,1):S.battery.push(id);}
  else if(a==="cmp"){const k=S.compare.indexOf(id);if(k>=0)S.compare.splice(k,1);else if(S.compare.length<4)S.compare.push(id);}
  else if(a==="exp"){S.expanded=S.expanded===id?null:id;}
  else if(a==="diff"){S.diffOnly=!S.diffOnly;}
  else if(a==="clearcmp"){S.compare=[];}
  else if(a==="lvl"){S.level=val;}
  else if(a==="ack"){S.ack[id]=!S.ack[id];}
  else if(a==="copy"){const ta=document.getElementById("methods");copyText(ta.value);S.copied=true;render();
    setTimeout(()=>{S.copied=false;render();},1800);return;}
  else return;
  render();
});
render();

</script>
</body>
</html>
