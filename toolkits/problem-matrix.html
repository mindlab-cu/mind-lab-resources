     stmt:`Learning platforms retain keystroke and timing data alongside the submission flag, and only the flag is used. This project re-analyses retained logs to test whether non-submitters divide into students who did the work and students who never started.`,
     out:K,
     outcome:`Evidence that the completion rate conflates two very different situations, from logs already retained. If it does, intervention aimed at non-submitters has been treating them alike — established with no new collection.`},
  b:{q:`What would show whether a student did the work themselves?`,
     stmt:`Whether the submitted work is the student's own leaves no trace in submission records or platform logs, so no reanalysis can establish it. This project builds a process signal that distinguishes work done from work transcribed.`,
     out:SOL,
     outcome:`A signal schools can use, and a distinction that becomes measurable for the first time. The signal is the deliverable; what to do about it comes after.`},
  tellA:`Keystroke and timing data was collected and only the flag was read. Reanalysis reaches it.`,
  tellB:`Authorship leaves no trace in anything recorded. Build the signal.`}
],

"epi-d3":[
 {d:"nutr",area:"Body fat",
  story:`Body fat percentage is estimated from skinfold calipers or bioimpedance. Fitness assessments, clinical thresholds and research all use the figure. Both methods rest on equations fitted to a reference population decades ago.`,
  proposal:`Build a body composition app using phone camera measurements.`,
  a:{q:`When do the estimates best match measured fat?`,
     stmt:`Caliper and impedance estimates depart from directly measured fat, and the conditions under which they agree — hydration, age, body shape — have not been mapped together. This project establishes when each best matches direct measurement and produces guidance on use.`,
     out:K,
     outcome:`Correction guidance clinics and researchers can apply, and the estimate continues as a measure with documented limits. Useful, and other groups are working on it.`},
  b:{q:`Are the estimates measuring fat, or the reference population?`,
     stmt:`Both methods convert a raw reading into a percentage using an equation fitted to one population. If a person differs from that population in shape or hydration, the estimate accurately reports what the equation expects of them. This project tests whether estimates track fat or distance from the reference sample.`,
     out:K,
     outcome:`If the reference dominates, body fat figures are statements about a decades-old sample, and thresholds applied to groups unlike it have been misclassifying them systematically. What the measure studies changes.`},
  tellA:`Your result makes estimates more accurate about the same thing.`,
  tellB:`Your result says the estimate has been reporting the reference population.`},
 {d:"happy",area:"Children's wellbeing",
  story:`Children's wellbeing is measured by asking them to rate how they feel, using faces or a short scale. Schools screen with it, referrals follow the score, and children usually answer in a classroom with their teacher present.`,
  proposal:`Build a wellbeing check-in app children complete weekly.`,
  a:{q:`When do children's ratings best match independent assessment?`,
     stmt:`Children's self-ratings vary with who administers them, where, and how recently something happened, and these conditions have not been mapped together. This project establishes when ratings best match independently assessed state and produces guidance for schools.`,
     out:K,
     outcome:`Administration guidance schools can apply, and the rating continues as a screening tool with documented limits. Straightforward, and it will be answered.`},
  b:{q:`Are the ratings measuring feeling, or what is safe to report at school?`,
     stmt:`A child's rating is treated as a noisy report of how they feel. If children answer according to what is safe to say in front of a teacher and classmates, it accurately measures disclosure. This project tests whether ratings track independently assessed state or the conditions of asking.`,
     out:K,
     outcome:`If disclosure dominates, screening data is evidence about classrooms rather than children, and the children most at risk are the ones least likely to be referred. The tool survives; its subject changes.`},
  tellA:`Your result makes the rating a more accurate index of the same thing.`,
  tellB:`Your result says the rating has been indexing what is safe to say.`}
],

"epi-d4":[
 {d:"cs",area:"Search relevance",
  story:`Search relevance is judged from clicks. Ranking models are trained on what users click, quality is reported as click-through rate, and a result nobody clicks is treated as irrelevant. A user who finds the answer in the snippet never clicks anything.`,
  proposal:`Build a ranking model trained on more click data.`,
  a:{q:`What can click data never record about a good result?`,
     stmt:`Relevance is inferred from clicks, so a result that answers the question without being opened produces the same signal as one that was useless. This project characterises what click data cannot register and states what a click-through figure can and cannot establish about quality.`,
     out:K,
     outcome:`A clear account of what relevance metrics do not measure, changing how existing ranking evaluations are read. Some results demoted as irrelevant were the best ones — established from data already held.`},
  b:{q:`What would record a query answered without a click?`,
     stmt:`No instrument records satisfaction in the absence of interaction, so results that answer in place cannot be credited at all. This project builds a measure of answered-without-click and shows it identifies quality invisible to click-through.`,
     out:SOL,
     outcome:`A measure ranking teams can adopt, and a class of good result that becomes creditable. The measure is the deliverable; the reordered ranking follows.`},
  tellA:`You can name what clicks omit but not yet how to capture it. Write the account.`,
  tellB:`You can describe the missing observation concretely enough to build for it.`}
],

"epi-d5":[
 {d:"chem",area:"pH",
  story:`Acidity is reported as a pH number from a glass electrode. Process control, drug formulation and environmental limits are all written in pH. The electrode responds to hydrogen ion activity, which departs from concentration in concentrated and non-aqueous solutions.`,
  proposal:`Build a pH meter with automatic temperature compensation.`,
  a:{q:`Can electrode drift and temperature effects be corrected for?`,
     stmt:`pH readings shift with temperature, ionic strength and electrode age, and correction practice varies between laboratories. This project establishes the correction function and specifies a standard procedure.`,
     out:SOL,
     outcome:`A correction procedure laboratories can adopt, making pH values comparable between sites and instruments. pH remains the measure of acidity.`},
  b:{q:`Is pH a property of the solution, or of the electrode's surroundings?`,
     stmt:`A pH number is treated as a property of the solution. In concentrated or non-aqueous media the electrode reports activity in its own boundary layer rather than in the bulk. This project tests whether a bulk-solution value exists to be measured in such media.`,
     out:K,
     outcome:`If none exists, pH limits written into regulation for those media refer to nothing measurable, and every reported value describes an electrode surface. Side A would be correcting a reading with no referent.`},
  tellA:`Your project could never conclude pH was never measuring acidity. You are refining.`,
  tellB:`Your project could conclude there is no bulk value for the reading to be about.`},
 {d:"econ",area:"Consumer confidence",
  story:`Consumer confidence is measured by asking people whether they expect to be better off next year. Markets react to the index, governments cite it, and answers move with whatever was in the news that week.`,
  proposal:`Build a real-time confidence index from social media sentiment.`,
  a:{q:`Can survey timing and news effects be corrected for?`,
     stmt:`Confidence readings move with fielding dates, recent headlines and question order, and practice differs between waves and countries. This project models those effects and provides a correction that makes waves comparable.`,
     out:SOL,
     outcome:`A correction statistical offices can apply to existing and future waves, making month-on-month comparison defensible. Confidence remains the thing being measured.`},
  b:{q:`Does the scale move as expectations re-anchor?`,
     stmt:`Correcting for news effects assumes a stable underlying confidence that events disturb. If people re-anchor their sense of better off after a sustained downturn, the reading measures the gap from a shifting expectation. This project tests whether a stable reference exists to correct towards.`,
     out:K,
     outcome:`If none does, an economy in prolonged decline shows recovering confidence as people adjust what they expect, and the index cannot see the thing it is quoted for. Side A would correct towards a moving point.`},
  tellA:`Your project could never conclude the index was never about confidence. You are refining.`,
  tellB:`Your project could conclude expectations re-anchor and the reference moves.`},
 {d:"edu",area:"Lesson observation",
  story:`Teaching quality is scored during lesson observation against a rubric. Scores drive appraisal, development and sometimes pay. Observers know which teacher they are watching, and teachers know they are being watched.`,
  proposal:`Build an observation app that records rubric scores on a tablet.`,
  a:{q:`Can observer effects be standardised away?`,
     stmt:`Observation scores vary with the observer, the notice given, and the lesson chosen, and practice differs between schools. This project establishes which procedural choices reduce that variation and specifies a standard.`,
     out:SOL,
     outcome:`An observation protocol schools can adopt, and scores that mean the same thing across observers. The rubric remains the measure of teaching quality.`},
  b:{q:`Does the rubric measure teaching, or performance for an observer?`,
     stmt:`A rubric score is treated as a sample of normal teaching. If teachers prepare differently for observed lessons, the score accurately measures observed-lesson performance, which may be uncorrelated with the rest of the year. This project tests whether observed and unobserved lessons differ systematically.`,
     out:K,
     outcome:`If they do, appraisal has been rewarding the ability to be observed, and development aimed at rubric scores has been coaching a performance. Side A would standardise the wrong lesson.`},
  tellA:`Your project could never conclude the rubric was never about teaching. You are refining.`,
  tellB:`Your project could conclude the score is about being watched.`}
],

"met-d1":[
 {d:"mgmt",area:"Team performance",
  story:`Performance is measured per individual. Objectives are set per person, appraisal is individual, and team output is treated as the sum of its members. Managers routinely describe teams that work and teams that do not, with the same people in them.`,
  proposal:`Build a performance management tool with better individual goal tracking.`,
  a:{q:`Can existing appraisal data be re-read with the team as the unit?`,
     stmt:`Performance is recorded per person, but HR systems already record team membership and reporting lines over time. This project models performance as a property of the team using data already collected, and compares how much outcome variation the team level explains against the individual level.`,
     out:K,
     outcome:`Evidence on whether the team explains results currently attributed to individuals, using nobody's new data. If it does, appraisal has been rewarding people for their team's composition.`},
  b:{q:`What would measure what a team produces that its members do not?`,
     stmt:`No instrument measures team output as distinct from the sum of individual contributions, so the team level cannot be assessed directly at all. This project builds such a measure and shows how appraisal outcomes change under it.`,
     out:SOL,
     outcome:`A measure companies can run, and revised appraisal outcomes. Building it is the project; which teams work comes afterwards.`},
  tellA:`Team membership is already in the HR record, analysed person by person. Reorganise it.`,
  tellB:`Nothing measures team output as its own quantity. Build it.`},
 {d:"mind",area:"Social cognition",
  story:`Social cognition is studied one participant at a time. A person lies in a scanner viewing faces or vignettes and infers what others think. Real social cognition happens between two people responding to each other in real time.`,
  proposal:`Build a task battery that measures social cognition more reliably.`,
  a:{q:`Can existing datasets be re-read with the pair as the unit?`,
     stmt:`Social cognition is measured in individuals, but several datasets recorded participants who interacted with a specific partner whose data was also collected. This project models performance as a property of the pair using data already collected, and compares it with the individual account.`,
     out:K,
     outcome:`Evidence on whether the pair explains variation currently attributed to individual ability, from data already gathered. If it does, individual social cognition scores describe a partnership.`},
  b:{q:`What would measure two brains responding to each other?`,
     stmt:`No standard method records two people's neural activity while they respond to one another, so the interaction level cannot be observed directly. This project builds simultaneous two-person recording into a usable paradigm.`,
     out:SOL,
     outcome:`A paradigm laboratories can run, and an interaction that becomes observable for the first time. The paradigm is the deliverable; what it shows comes after.`},
  tellA:`Partner data was collected alongside participant data and never paired. Reorganise it.`,
  tellB:`Two-person recording has never been done at usable scale. Build it.`}
],

"met-d3":[
 {d:"chem",area:"Reaction mechanisms",
  story:`Reaction mechanisms are established by measuring how rate changes with concentration. Rate laws are fitted, mechanisms inferred, and textbooks record them. The approach assumes the reaction runs through one dominant path under the conditions tested.`,
  proposal:`Build a kinetics rig that measures reaction rates faster and more precisely.`,
  a:{q:`What rate law does the method find for a reaction not yet studied?`,
     stmt:`Kinetic analysis has established mechanisms for many reactions and few others. This project applies the standard approach to an unstudied reaction and reports the rate law and mechanism it yields.`,
     out:K,
     outcome:`One more mechanism, moderately cited, entering the reference literature. The method comes out untouched, which is why it will be funded.`},
  b:{q:`Can rate measurement find a path that is not dominant?`,
     stmt:`Fitting a rate law reports the path that dominates under the conditions used, so parallel minor paths cannot register. If real systems run several paths at once, the textbook mechanism describes the conditions chosen rather than the chemistry. This project tests whether inferred mechanisms survive a change of conditions.`,
     out:K,
     outcome:`If they do not, mechanisms in the literature describe experimental convenience, and scale-up failures that surprise everyone become predictable. A large body of reference chemistry needs re-reading.`},
  tellA:`If you are right, the field gains one more mechanism and the method carries on.`,
  tellB:`If you are right, the method explains why the recorded mechanisms look as they do.`},
 {d:"math",area:"Diagnostic items",
  story:`Mathematical understanding is measured with multiple-choice diagnostic items. Distractors are written to catch known errors, scores are reported per topic, and teaching responds to the pattern of wrong answers.`,
  proposal:`Build an item bank with thousands of diagnostic questions.`,
  a:{q:`What errors does the item bank find in a topic not yet covered?`,
     stmt:`Diagnostic item banks cover many topics and few others. This project writes and administers items for an uncovered topic and reports the error patterns they reveal.`,
     out:K,
     outcome:`One more diagnostic set, moderately used, feeding a remediation scheme for that topic. The method is unaffected, which is why it passes review.`},
  b:{q:`Can a multiple-choice item register reasoning that produces no listed answer?`,
     stmt:`A diagnostic item can only record errors its distractors anticipate, so a student reasoning in a way nobody wrote down is scored as a near-miss on a listed error. This project tests whether item-diagnosed errors match errors found by examining the student's actual reasoning.`,
     out:K,
     outcome:`If they do not, diagnostic banks describe the imagination of item writers rather than how students think, and remediation has been aimed at errors nobody made. A large assessment literature turns out to be about distractors.`},
  tellA:`If you are right, one more topic has a diagnostic set and the method continues.`,
  tellB:`If you are right, the method explains why the catalogued errors look as they do.`},
 {d:"ecol",area:"Camera traps",
  story:`Mammal abundance is estimated from camera trap detection rates. Cameras are strapped to trees along trails, detections counted, and abundance modelled from the rate. Trails are used far more heavily by some species than others.`,
  proposal:`Build an AI classifier that identifies species in camera trap images faster.`,
  a:{q:`What detection rates does the method give in a habitat not yet surveyed?`,
     stmt:`Camera trap surveys have produced abundance estimates for many habitats and few others. This project deploys the standard protocol in an unsurveyed habitat and reports the detection rates and abundance estimates it yields.`,
     out:K,
     outcome:`One more set of estimates, moderately cited, feeding that region's conservation planning. The protocol is untouched by it.`},
  b:{q:`Can a trail-placed camera register an animal that avoids trails?`,
     stmt:`Detection rate is a function of how often an animal passes a camera, and cameras sit on trails. If some species avoid trails, the method reports trail use and calls it abundance. This project tests whether estimates survive when cameras are placed independently of trails.`,
     out:K,
     outcome:`If they do not, abundance estimates across the literature describe trail behaviour rather than population size, and species that avoid people have been undercounted for decades.`},
  tellA:`If you are right, one more habitat has estimates and the protocol carries on.`,
  tellB:`If you are right, the protocol explains why the abundance figures look as they do.`}
],

 {d:"mind",area:"The present moment",

 {d:"chem",area:"Molecular structure",
  story:`A compound is identified by its structure — which atoms are bonded to which. Databases, patents and safety data sheets all key off the structure. Some molecules interconvert between forms faster than any measurement can separate them.`,
  proposal:`Build a structure prediction tool that infers structure from spectra.`,
  a:{q:`Do current identification rules disagree for molecules that interconvert?`,

     out:K,

     out:K,
     outcome:`If they do not, the structure is a convenient average rather than a description, and patents, safety sheets and property predictions all key off something no molecule ever is. A very large reference literature loses its object.`},
  tellA:`If you are right, databases adopt your rule and structure remains the identifier.`,
  tellB:`If you are right, the identifier names an average and its properties belong to a mixture.`},
 {d:"cs",area:"A software bug",

     out:K,
     outcome:`If clarity dominates, bug density is a measure of a conversation rather than of code, and teams judged on it have been penalised for ambiguous requirements written elsewhere. A large software quality literature loses its subject.`},

  tellB:`If you are right, the metric describes a relationship and a body of quality research loses its object.`},
 {d:"mind",area:"The unconscious",

"ont-d4":[
 {d:"chem",area:"Chemical space",
  story:`Drug discovery searches chemical space — the set of possible molecules. Libraries are built to cover it, diversity metrics score the coverage, and screening samples from it. In practice the space is bounded by whatever the synthesis routes currently in use can make.`,
  proposal:`Build a larger screening library that covers more chemical space.`,
  a:{q:`Where did chemical space come from, and does synthesisability carve it?`,
     stmt:`Chemical space became the unit of search because diversity metrics could be computed over it, not because anyone established that it carves the possibilities usefully. This project traces the construct and tests whether diversity in the metric corresponds to any difference that matters in screening.`,
     out:K,
     outcome:`An account of how the space got its authority, and evidence on whether covering it means anything. If diversity scores track synthetic convenience, libraries have been sampling what is easy to make. No replacement is offered.`},
  b:{q:`What unit would predict screening success better than diversity?`,
     stmt:`If diversity scores track synthesisability rather than biological difference, libraries built to maximise them will screen poorly, and nothing else exists to design against. This project defines an alternative unit and tests whether libraries built on it produce more hits than diversity-matched controls.`,
     out:SOL,
     outcome:`A library design method screening groups can adopt, and a head-to-head test it can lose. Either hit rates improve, or diversity is vindicated and everyone can stop arguing.`},
  tellA:`You can say the unit is wrong but not name what replaces it. Keep it as an account.`,
  tellB:`You can name the replacement and the hit rate it has to beat.`},
 {d:"cs",area:"Developer productivity",

     stmt:`If software work does not divide into per-person output, productivity measures predict delivery poorly, and management has nothing else to plan with. This project defines an alternative unit and tests whether it predicts delivery dates better than the output measure it would replace.`,
     out:SOL,

  tellA:`You can name what is wrong with the unit but not its replacement. Write the account.`,
  tellB:`You can name the replacement and the forecast it must beat.`},
 {d:"mind",area:"Mental imagery",

"epi-d2":[
 {d:"chem",area:"Recyclability",
  story:`Plastics are labelled recyclable on the basis that the material can in principle be reprocessed. Councils cite the label, producers rely on it, consumers sort by it, and the test that defines it is written by an industry body.`,
  proposal:`Build a household app that scans packaging and says whether it is recyclable.`,
  a:{q:`What can a can-in-principle test never establish?`,
     stmt:`Recyclability is certified by whether a material can be reprocessed under laboratory conditions, so a plastic that no facility anywhere actually accepts still passes. This project characterises what the test cannot establish and asks whether any observation could show a recyclable label to be wrong.`,
     out:K,
     outcome:`An account of a blind spot in every recycling label. Nobody asked for it, and it is unwelcome to the industry body that writes the test and the producers whose packaging passes it.`},
  b:{q:`What should a regulator require instead of a laboratory test?`,
     stmt:`Regulators accept in-principle recyclability because it is cheap to certify and applies nationally. This project identifies where it diverges from what facilities actually process and specifies an alternative requirement based on realised reprocessing.`,
     out:SOL,
     outcome:`A labelling standard that can enter regulation, adopted or refused on the regulator's timetable. The catch: they need a label to exist, so showing the current one is hollow is not enough by itself.`},
  tellA:`Nobody commissioned it and it embarrasses the body that writes the test. Note that before you start.`,
  tellB:`A labelling review is under way and needs a rule that can be enforced.`},

 {d:"mind",area:"Brain death",

  story:`Wildlife trends are reported as an index built from many species' counts. Governments report against it, targets are set on it, and the index is rebased periodically so that a reference year equals one hundred.`,

     stmt:`The index is rebased at intervals and species are added and dropped, so movements partly reflect composition changes rather than populations. This project models the composition effect and provides a corrected series.`,

  b:{q:`Can an index of relative change register a common decline?`,
     stmt:`Rebasing sets the reference year to one hundred, so the index reports change relative to whatever state existed then. If most species had already declined before the baseline, the index shows stability while abundance stays low. This project tests whether the index can detect a decline that preceded its own baseline.`,
     out:K,
     outcome:`If it cannot, decades of stable index readings are consistent with a badly depleted system, and targets set against the index can be met without recovery. Side A would correct a series that cannot see the problem.`},

"met-d5":[
 {d:"sport",area:"Personal bests",
  story:`Athletic progress is tracked by personal best. Selection uses it, funding follows it, and records stand until beaten. Conditions differ enormously between meetings — altitude, wind, track surface, pacing — and the best is whatever number was produced on the best day.`,
  proposal:`Build a performance database recording every athlete's personal best.`,
  a:{q:`Can conditions be corrected for?`,
     stmt:`Times and distances vary with altitude, wind, surface and competition depth, and correction practice differs between federations. This project models the condition effects and provides adjusted marks that are comparable between meetings.`,
     out:SOL,
     outcome:`Adjusted marks selectors and funders can compare, so an athlete is not rewarded for having raced somewhere favourable. The personal best remains the measure of ability.`},
  b:{q:`Can a maximum register ability at all?`,
     stmt:`A personal best is the extreme of a distribution, so it records the best combination of conditions, form and luck an athlete has encountered, and it can only ever rise. If the number of attempts differs between athletes, the maximum measures opportunity as much as ability. This project tests whether the best or the distribution better predicts future performance.`,
     out:K,
     outcome:`If the distribution predicts better, selection on personal bests has been selecting on how many chances someone got, and athletes with fewer opportunities have been systematically overlooked. Side A would adjust a statistic that cannot answer the question.`},
  tellA:`Your result makes existing marks more comparable about the same thing.`,
  tellB:`Your result says a maximum records opportunity as much as ability.`},
 {d:"med",area:"Screening statistics",
  story:`Screening programmes report survival gains: people whose cancer was found by screening live longer after diagnosis than those diagnosed on symptoms. Programmes are justified by the gain, and the diagnosis date is the point survival is measured from.`,
  proposal:`Build a screening dashboard reporting survival by programme.`,
  a:{q:`Can differences in diagnosis timing be adjusted for?`,
     stmt:`Screening moves the diagnosis date earlier, so survival measured from diagnosis is longer even when death occurs at the same time. Adjustment practice varies between programmes. This project models the lead-time effect and provides a corrected survival estimate.`,
     out:SOL,
     outcome:`A correction programmes can apply, and survival comparisons that account for earlier diagnosis. Survival from diagnosis remains the way screening benefit is reported.`},
  b:{q:`Can survival from diagnosis register a benefit at all?`,
     stmt:`Adjusting for lead time assumes survival from diagnosis can be made informative. If screening also detects slow cancers that would never have caused harm, then survival from diagnosis rises for two reasons that no adjustment separates. This project tests whether mortality, rather than survival, moves at all.`,
     out:K,
     outcome:`If mortality does not move, survival gains recorded for decades reflect earlier diagnosis and harmless detection, and a programme can look successful while saving nobody. Side A would correct a statistic that cannot answer the question.`},
  tellA:`Your result makes the existing statistic more precise about the same thing.`,
  tellB:`Your result says the statistic cannot register the benefit at all.`},
 {d:"mgmt",area:"Return on investment",
  story:`Initiatives are justified by return on investment. Benefits are estimated, costs are counted, and the ratio decides funding. Benefits are attributed to the initiative by comparing before and after, in a business that was changing for many other reasons.`,
  proposal:`Build an ROI calculator that standardises benefit estimation.`,
  a:{q:`Can other concurrent changes be adjusted for?`,
     stmt:`Before-and-after benefit attribution absorbs everything else that changed in the period, and adjustment practice varies between business cases. This project models the concurrent-change effect and provides a corrected attribution method.`,
     out:SOL,
     outcome:`A correction finance teams can apply, and business cases that are comparable across the portfolio. Return on investment remains the way initiatives are judged.`},
  b:{q:`Can a before-and-after comparison attribute anything?`,
     stmt:`Correction assumes a counterfactual can be estimated from surrounding data. If the business would have changed in ways no observable captures, then no adjustment recovers the attribution, and the ratio records the direction the business was already moving. This project tests whether attributions survive against genuinely comparable untreated units.`,
     out:K,
     outcome:`If they do not, portfolio returns record business momentum rather than initiative effect, and funding has followed whichever team wrote the most optimistic case. Side A would refine an attribution that cannot be made.`},
  tellA:`Your result makes the existing attribution more precise about the same thing.`,
  tellB:`Your result says the comparison cannot attribute anything.`},
 {d:"math",area:"Effect size conversion",
  story:`Meta-analysis pools results by converting each study's finding into a common effect size. Reviews report the pooled figure, guidelines cite it, and the conversion assumes the studies measured the same underlying quantity on different scales.`,
  proposal:`Build a meta-analysis tool with conversions for more study designs.`,
  a:{q:`Can conversion error between designs be quantified?`,
     stmt:`Converting between effect size metrics introduces error that depends on design, distribution and measurement scale, and it is rarely propagated. This project quantifies the conversion error and provides corrected pooled estimates with honest intervals.`,
     out:SOL,
     outcome:`Corrected pooled estimates reviewers can publish, with uncertainty that reflects the conversion. Pooling remains the way evidence is combined.`},
  b:{q:`Can studies measuring different things be pooled at all?`,
     stmt:`Conversion assumes the studies estimate one underlying quantity. If the outcomes measured are genuinely different constructs, the pooled figure averages unlike things and its precision grows with the number of unlike studies added. This project tests whether pooled outcomes share a common construct.`,
     out:K,
     outcome:`If they do not, meta-analysis has been manufacturing confidence by adding studies of different things, and the tighter the interval the more studies were combined. Side A would quantify error in a conversion that should not happen.`},
  tellA:`Your result makes the pooled estimate more precise about the same thing.`,
  tellB:`Your result says the pooling combines things that are not the same quantity.`}
]
};

  story:`Physics declares a discovery at five sigma. Journals, press offices and funding bodies all treat the threshold as the line between a hint and a result, and it has been applied uniformly across searches for decades.`,
  proposal:`Build an analysis pipeline that reaches five sigma faster.`,
  a:{q:`Can the threshold be calibrated to the search being run?`,
     stmt:`Five sigma is applied uniformly although searches differ enormously in how many hypotheses were effectively tested and how plausible the signal was in advance. This project establishes search-specific thresholds and shows they produce more consistent false-discovery behaviour.`,
     out:SOL,
     outcome:`Calibrated thresholds collaborations can adopt, so a discovery claim means the same thing across searches. Sigma remains the measure of evidential strength.`},
  b:{q:`Is sigma measuring evidence, or the size of the search?`,
     stmt:`A sigma value is treated as strength of evidence for the signal. It is computed against a background model over a search region, so it partly records how much was looked through. This project tests whether sigma tracks signal reality or search extent.`,
     out:K,
     outcome:`If search extent dominates, the threshold measures how hard the collaboration hunted, and the uniform five-sigma line has been holding wildly different searches to the same nominal bar. Side A would calibrate a quantity that reports the search.`},
  tellA:`Your project could never conclude sigma was never about evidence. You are refining.`,
  tellB:`Your project could conclude the number reports the extent of the search.`},

     outcome:`If the change is continuous, a tipping point names a place where a curve gets steep, and targets set to stay below one have been set against a modelling convention. Nobody's decision is waiting.`},
  b:{q:`What threshold should an assessment body publish in its next report?`,
     stmt:`An assessment body must publish thresholds that policymakers can act on, and current candidates rest on models that disagree. This project derives a defensible threshold definition from available evidence and tests whether independent assessors locate it consistently.`,
     out:SOL,
     outcome:`A threshold definition a body can publish next cycle, with agreement measured. Policy stops depending on which model was cited. They need a number, so a negative finding will not serve.`},
  tellA:`No report is waiting on you. You want to know whether the threshold is real.`,
  tellB:`An assessment cycle closes shortly and needs a number governments can act on.`},
 {d:"media",area:"Misinformation",
  story:`Misinformation is treated as a category of content. Platforms remove it, researchers measure its spread, regulators legislate against it, and the classification bundles fabrication, misleading framing, contested claims and things later found true.`,
  proposal:`Build a misinformation detection classifier for social platforms.`,
  a:{q:`Is misinformation one category, or several bundled?`,
     stmt:`The label covers fabricated content, accurate content framed misleadingly, and claims that were contested at the time and later resolved either way. This project tests whether the classes behave alike in how they spread and what harm follows.`,
     out:K,

  b:{q:`What criterion should a platform's moderators apply this month?`,

     out:SOL,
     outcome:`A criterion moderators can apply this month, with an agreement rate. Removals stop depending on who reviewed. They need a rule, so "the category is a bundle" cannot be the deliverable.`},

"ont-d3":[
 {d:"law",area:"Intent",
  story:`Criminal liability turns on intent. Juries are asked to find it, sentences depend on it, and it is inferred from conduct and circumstance because it cannot be observed. The same act with different inferred intent carries wildly different consequences.`,
  proposal:`Build a jury direction tool that explains intent tests more clearly.`,
  a:{q:`Do the tests for intent disagree across offences?`,
     stmt:`Different offences apply different tests for intent, and the same conduct can satisfy one and fail another. This project catalogues the divergences and tests how often they change the verdict in comparable cases.`,
     out:K,
     outcome:`A harmonised account courts could adopt, and clarity about which offences apply an unusually low bar. Intent survives as the element, better specified. Others are working on it.`},
  b:{q:`Is intent a mental state, or a conclusion the law reaches about conduct?`,
     stmt:`Intent is treated as a state the defendant had, inferred from conduct. If the inference is fully determined by the conduct and circumstances, then intent adds nothing beyond a description of what was done and how. This project tests whether findings of intent vary independently of the conduct evidence.`,
     out:K,
     outcome:`If they do not, intent is a legal conclusion wearing the clothes of a psychological fact, and centuries of doctrine about mental states describe a conduct test. A vast body of criminal law loses its subject.`},
  tellA:`If you are right, courts adopt your account and intent remains an element to be found.`,
  tellB:`If you are right, the element is a restatement of conduct and the doctrine loses its object.`},
 {d:"clim",area:"Carbon offsets",
  story:`Emissions are offset by paying for reductions elsewhere. Companies claim neutrality, registries issue credits, and an offset counts if the reduction is additional — would not have happened anyway.`,
  proposal:`Build an offset marketplace with better project search.`,
  a:{q:`Do the additionality tests disagree between registries?`,
     stmt:`Registries apply different additionality tests, and the same project can qualify under one and fail another. This project catalogues the divergences and tests how many issued credits would fail under a stricter registry's rules.`,
     out:K,
     outcome:`A harmonised test registries could adopt, and clarity about how many credits in circulation are marginal. The offset survives as an instrument, better policed. Several groups are close.`},
  b:{q:`Is additionality a property of a project, or a claim about a counterfactual?`,
     stmt:`A credit is issued when a reduction would not have happened otherwise. That is a claim about a world that did not occur and cannot be observed. This project tests whether additionality determinations track anything observable or only the plausibility of the story submitted.`,
     out:K,
     outcome:`If they track the story, additionality is unverifiable in principle, and every neutrality claim rests on a counterfactual nobody can check. The entire instrument loses its foundation.`},
  tellA:`If you are right, registries adopt your test and offsets remain workable.`,
  tellB:`If you are right, the property is unobservable and the market loses its subject.`},
 {d:"media",area:"Objectivity",
  story:`Journalism is judged by objectivity. Style guides require it, complaints bodies adjudicate on it, and it is operationalised as balance: representing both sides of a dispute. Some disputes have no symmetric sides and some have many.`,
  proposal:`Build an editorial tool that checks stories for balanced sourcing.`,
  a:{q:`Do the tests for objectivity disagree between codes?`,
     stmt:`Broadcast regulation, press codes and internal guidelines operationalise objectivity differently, and the same story can comply with one and breach another. This project catalogues the divergences and tests how often they change the adjudication.`,
     out:K,
     outcome:`A harmonised standard regulators could adopt, and clarity about which codes require symmetry where none exists. Objectivity survives as a standard, better specified.`},
  b:{q:`Is objectivity a property of a report, or the absence of an accusation?`,
     stmt:`Objectivity is treated as a property a story has. If it is established by the absence of a sustained complaint, and complaints come from whoever is organised enough to make them, then objectivity records which parties can mobilise. This project tests whether objectivity findings track story content or complainant capacity.`,
     out:K,
     outcome:`If complainant capacity dominates, objectivity is a property of the political landscape rather than of journalism, and balance requirements have amplified whoever complains most. The standard loses its subject.`},
  tellA:`If you are right, regulators adopt your standard and objectivity holds as a property.`,
  tellB:`If you are right, the property belongs to the complainants and the standard loses its object.`}
],

"ont-d4":[
 {d:"law",area:"The case",
  story:`Law is organised around the case. Courts decide cases, precedent is drawn from cases, legal education teaches cases, and databases catalogue them. Most legal disputes end in settlement or are never brought, and those leave no case.`,
  proposal:`Build a case law search engine with better citation mapping.`,
  a:{q:`Where did the case come from as a unit, and does dispute divide that way?`,
     stmt:`The case became the unit because courts produce judgments and judgments can be catalogued, not because anyone established that legal disputes divide into cases. This project traces the construct and tests, using settlement and non-filing data, whether decided cases represent the population of disputes.`,
     out:K,
     outcome:`An account of how the case acquired its authority, and evidence on what proportion of legal life it represents. If decided cases are a filtered minority, precedent describes what was worth litigating. No replacement offered.`},
  b:{q:`What unit would represent legal disputes better than the case?`,
     stmt:`If decided cases are unrepresentative, doctrine built on them misdescribes how law operates, and there is nothing else catalogued to study. This project defines an alternative unit covering settled and unbrought disputes, and tests whether it predicts outcomes better than case law alone.`,
     out:SOL,
     outcome:`A research and teaching unit the field can adopt, and a comparison it can lose. Either prediction of dispute outcomes improves, or the case is vindicated.`},
  tellA:`You can say the unit is filtered but not name a replacement. Keep it as an account.`,
  tellB:`You can name the replacement and the outcomes it must predict better.`},
 {d:"clim",area:"The carbon footprint",
  story:`The carbon footprint is the unit of climate responsibility. Individuals calculate theirs, companies report theirs, products carry one, and policy campaigns target reducing it. The concept was popularised by an oil company's advertising agency.`,
  proposal:`Build a personal carbon footprint calculator app.`,
  a:{q:`Where did the footprint come from as a unit, and does responsibility divide that way?`,
     stmt:`The footprint became the unit of responsibility because emissions can be arithmetically allocated to an actor, not because anyone established that responsibility divides that way. This project traces the construct's origin and tests whether footprint allocation corresponds to any actor's actual capacity to reduce emissions.`,
     out:K,
     outcome:`An account of how the unit acquired its authority, and evidence on whether it tracks capacity to act. If it does not, individual footprints allocate responsibility to people who cannot change the system producing it. Nothing is offered in its place.`},
  b:{q:`What unit would allocate responsibility better than the footprint?`,
     stmt:`If footprints do not track capacity to reduce, campaigns targeting them misallocate effort, and there is no alternative allocation in use. This project defines an alternative unit based on decision control and tests whether interventions targeted on it reduce emissions more.`,
     out:SOL,
     outcome:`An allocation framework campaigners and regulators can apply, and a comparison it can lose. Either reductions improve, or the footprint holds up.`},
  tellA:`You can name what is wrong with the unit but not its replacement. Write the account.`,
  tellB:`You can name the replacement and the reductions it must beat.`},
 {d:"media",area:"The audience",
  story:`Media is organised around the audience. Ratings measure it, advertising is sold against it, commissioning targets it, and it is constructed from panels and analytics as an aggregate of individuals who consumed something.`,
  proposal:`Build an audience measurement platform combining more data sources.`,
  a:{q:`Where did the audience come from as a unit, and does attention divide that way?`,
     stmt:`The audience became the unit because advertising needed something countable, not because anyone established that media effects operate on an aggregate of individual consumptions. This project traces the construct and tests whether audience measures correspond to anything about how content actually circulates.`,
     out:K,
     outcome:`An account of how the audience acquired its authority, and evidence on whether it names anything beyond a billing convenience. If content circulates through conversation rather than consumption, ratings describe a payment mechanism. No replacement offered.`},
  b:{q:`What unit would predict influence better than the audience?`,
     stmt:`If influence operates through circulation rather than consumption counts, audience figures predict effect poorly, and the industry has nothing else to trade on. This project defines an alternative unit and tests whether it predicts observed influence better than reach.`,
     out:SOL,
     outcome:`A measurement unit the industry could adopt, and a comparison it can lose. Either influence prediction improves, or reach is vindicated.`},
  tellA:`You can say the unit is a billing convenience but cannot name a replacement.`,
  tellB:`You can name the replacement and the influence it has to predict better.`}
],

"ont-d5":[
 {d:"law",area:"Access to justice",
  story:`Access to justice is reported as one indicator combining legal aid spending, court fees, waiting times and advice availability. Ministries report against it, international comparisons use it, and reform is justified by moving it.`,
  proposal:`Build an access to justice index for comparing jurisdictions.`,
  a:{q:`How do we make access indicators comparable between jurisdictions?`,
     stmt:`Jurisdictions combine the components differently and define legal aid and advice inconsistently, so index positions partly reflect definition. This project establishes a common construction and shows figures under it are comparable.`,
     out:SOL,
     outcome:`A comparable index ministries can use, so a jurisdiction's position does not depend on the compiler. Access remains one quantity a system has more or less of.`},
  b:{q:`Is access one quantity, when its components trade against each other?`,
     stmt:`Cutting fees can lengthen waits, and expanding advice can reduce representation, so the components routinely move against each other. This project tests whether they behave as one underlying quantity.`,
     out:K,
     outcome:`If they do not, a ministry can raise the index by improving whichever component is cheapest while access worsens where it matters. Side A would standardise the pricing of a trade-off.`},
  tellA:`Someone who thinks access is one quantity would approve. You are refining.`,
  tellB:`Your project could conclude the index prices a trade-off rather than measuring access.`},
 {d:"clim",area:"Climate risk",
  story:`Climate risk is reported as one score. Investors screen on it, regulators require disclosure of it, and it combines physical exposure, transition exposure and adaptive capacity into a single rating per company or asset.`,
  proposal:`Build a climate risk rating platform covering more companies.`,
  a:{q:`How do we make risk ratings comparable between providers?`,
     stmt:`Providers combine physical, transition and adaptive components with different weights and data, so ratings for the same company disagree substantially. This project establishes a common construction and shows ratings under it are comparable.`,
     out:SOL,
     outcome:`Comparable ratings investors and regulators can rely on, so a company's score does not depend on the vendor. Climate risk remains one score.`},
  b:{q:`Is climate risk one quantity, when its parts point in opposite directions?`,
     stmt:`A company heavily exposed to physical risk may have low transition risk, and the reverse, so the components can move oppositely for the same firm. This project tests whether they behave as one underlying quantity.`,
     out:K,
     outcome:`If they do not, a single rating averages exposures that require opposite responses, and a portfolio screened on it can be concentrated in exactly the risk the investor meant to avoid. Side A would harmonise a blend.`},
  tellA:`Someone who thinks a company has a climate risk would approve. You are refining.`,
  tellB:`Your project could conclude there is no single quantity to rate.`},
 {d:"media",area:"Engagement",
  story:`Media performance is reported as engagement: one figure combining time on page, shares, comments and returns. Editorial decisions follow it, advertising is priced on it, and newsroom incentives are set against it.`,
  proposal:`Build an editorial analytics dashboard with a unified engagement score.`,
  a:{q:`How do we make engagement scores comparable across platforms?`,
     stmt:`Platforms define and weight the components differently, so a publisher's engagement cannot be compared across them or over a platform change. This project establishes a common scale and shows scores under it are comparable.`,
     out:SOL,
     outcome:`A comparable metric publishers and advertisers can trade on. Engagement remains one quantity a piece of content generates.`},
  b:{q:`Is engagement one thing, when outrage and value produce the same score?`,
     stmt:`Time on page, sharing and commenting are combined although a piece that informs and a piece that enrages generate similar totals by different routes. This project tests whether the components track the same underlying response.`,
     out:K,
     outcome:`If they do not, an engagement score cannot distinguish content people valued from content that provoked them, and newsroom incentives set on it reward whichever is easier to produce. Side A would standardise that confusion.`},
  tellA:`Someone who thinks engagement is one quantity would approve. You are refining.`,
  tellB:`Your project could conclude the score cannot separate value from provocation.`}
],

 {d:"law",area:"Forensic evidence",
  story:`Convictions rest partly on forensic comparison — fingerprints, toolmarks, bite marks. An examiner declares a match, juries weigh it heavily, and laboratories retain complete case files including the images and the examiner's notes.`,
  proposal:`Build a case management system for forensic laboratories.`,
  a:{q:`Do retained case files already show how often examiners disagree?`,
     stmt:`Match declarations are reported as conclusions, while laboratories retain the underlying images and worksheets. This project re-analyses retained files by re-presenting them to independent examiners to test the rate of disagreement on cases already used in court.`,
     out:K,
     outcome:`A disagreement rate for evidence already given, from files laboratories already hold. If it is high, convictions have rested on a conclusion presented as certain — established without any new casework.`},
  b:{q:`What would measure how distinctive a feature actually is?`,
     stmt:`A match declaration implies rarity, but no reference database establishes how common the compared features are in the population, so no case file can supply it. This project builds the population frequency measurement the conclusion presupposes.`,
     out:SOL,
     outcome:`A frequency basis courts can require before a match is asserted, and a claim that becomes quantifiable rather than declared. The measurement is the deliverable; which techniques survive follows.`},
  tellA:`Images and worksheets were retained and never re-examined blind. Reanalysis reaches them.`,
  tellB:`Population frequency has never been measured for these features. Build the basis.`},
 {d:"clim",area:"Methane leaks",
  story:`Methane emissions from gas infrastructure are estimated from equipment counts multiplied by standard emission factors. Inventories use the estimate and targets are set against it. Operators run continuous pressure and flow monitoring for commercial reasons, and that data is retained.`,
  proposal:`Build an emissions inventory tool with better equipment factors.`,
  a:{q:`Does operational monitoring data already show the leaks the factors miss?`,
     stmt:`Inventories rest on standard factors, while operators retain high-frequency flow and pressure data that would show unaccounted losses. This project analyses retained operational data to test how far actual losses depart from factor-based estimates.`,
     out:K,
     outcome:`A corrected emissions estimate from data operators already collect for billing. If losses are several times the inventory, national methane figures have been wrong for decades — with no new instrumentation.`},
  b:{q:`What would detect a large intermittent release?`,
     stmt:`Short, very large releases fall between periodic surveys and are averaged away in flow data, so neither inventories nor operational records capture them. This project builds continuous detection sensitive to intermittent high-volume events.`,
     out:SOL,
     outcome:`A detection system regulators can mandate, and a class of release that becomes observable. The system is the deliverable; how much it changes the total follows.`},
  tellA:`Flow and pressure were logged for billing and never read for leaks. Reanalysis reaches them.`,
  tellB:`Short high-volume releases are captured by nothing. Build the detection.`},
 {d:"media",area:"Corrections",
  story:`Accuracy is assessed from published corrections. Media monitors count them, and outlets with few corrections are treated as accurate. Content systems retain every published version of every article, and silent edits leave no correction notice.`,

 {d:"law",area:"Expert witnesses",
  story:`Courts rely on expert evidence. Experts are instructed and paid by one party, the other side instructs its own, and the court weighs them. Judges are not equipped to assess technical validity, and the same expert often appears repeatedly for the same side.`,
  proposal:`Build a directory of expert witnesses with their case histories.`,
  a:{q:`What can party-instructed expert evidence never establish?`,
     stmt:`Expert opinion enters court through parties who select experts likely to help them, so the range of opinion presented is bounded by what each side chose to commission. This project characterises what the arrangement cannot establish and asks whether any observation could show accepted expert evidence to have been wrong.`,
     out:K,
     outcome:`An account of a blind spot in the fact-finding process. Nobody asked for it, and it is unwelcome to the experts who make a living this way and the courts that rely on them.`},
  b:{q:`What should a court require before admitting expert evidence?`,
     stmt:`Courts admit expert evidence on the instructing party's selection because they have no independent route to the field. This project identifies where party selection distorts the range of opinion and specifies an admissibility requirement a court could adopt in practice directions.`,
     out:SOL,
     outcome:`An admissibility standard that can enter procedure rules, adopted or refused on the rules committee's timetable. Trials must continue, so showing the arrangement is compromised is not enough alone.`},
  tellA:`Nobody commissioned it and it embarrasses both the experts and the courts.`,
  tellB:`A rules committee is revising practice directions and needs something workable.`},
 {d:"clim",area:"Corporate climate disclosure",

     outcome:`An account of a blind spot at the centre of sustainable investing. Nobody asked for it, and it is unwelcome to the companies disclosing and the funds marketing products screened on the disclosures.`},

  tellA:`Nobody commissioned it and it undermines a framework a large market depends on.`,
  tellB:`Disclosure rules are being drafted and need something enforceable.`},
 {d:"media",area:"Audience measurement",
  story:`Advertising is bought against audience figures. Buyers rely on them, publishers are paid on them, and the measurement is frequently supplied by the publisher's own analytics or by a body the publishers fund.`,

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mxId = "matrix", dtId = "detail";
const mxEl = () => document.getElementById(mxId);
const dtEl = () => document.getElementById(dtId);
const seen = new Set();
let active = null;

const OUT = {
  knowledge:{cls:"t-know", label:"New knowledge", sub:"leads to"},
  solution:{cls:"t-sol", label:"New solution", sub:"leads to"}
};

const renderRead = () => { const n = document.getElementById("read"); if(n) n.innerHTML = `<b>${seen.size}</b> of 15 intersections read`; };

function renderMatrix(){
  let h = `<div class="corner"><span class="cn">3 × 5</span><span class="ct">Lens against tension</span></div>`;
  h += DILS.map(d => `<button class="ch" data-axis="dil" data-id="${d.id}">
      <span class="cn">${d.n}</span><span class="ct">${esc(d.short)}</span></button>`).join("");
  for(const L of LENSES){
    h += `<button class="rh" data-axis="lens" data-id="${L.id}" data-lens="${L.id}">
        <span class="rn">${esc(L.name)}</span><span class="rq">${esc(L.q)}</span></button>`;
    h += DILS.map(d => {
      const key = L.id+"-"+d.id;
      return `<button class="cell ${seen.has(key)?"seen":""}" data-cell="${key}" data-lens="${L.id}"
        aria-current="${active===key}">
        <span class="seen"></span>
        <span class="dil">${esc(d.short)}</span>
        <span class="char">${esc(CELLS[key].char)}</span></button>`;
    }).join("");
  }
  const mx = mxEl(); if(!mx) return; mx.innerHTML = h;
  mx.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => openCell(b.dataset.cell));
  mx.querySelectorAll("[data-axis]").forEach(b => b.onclick = () => openAxis(b.dataset.axis, b.dataset.id));
}

function sideHTML(side, num, label){
  const o = OUT[side.out];
  return `<div class="side">
    <p class="sn">${esc(num)} · ${esc(label)}</p>
    <p class="sq">${esc(side.q)}</p>
    <p class="lbl">Problem statement</p>
    <p class="ps">${esc(side.stmt)}</p>
    <span class="tag ${o.cls}"><small>${esc(o.sub)}</small> ${esc(o.label)}</span>

      <p class="oc">${esc(side.outcome)}</p>
    </div>
  </div>`;
}

function show(html, lensId){
  const dt = dtEl(); if(!dt) return;
  if(lensId) dt.dataset.lens = lensId; else dt.removeAttribute("data-lens");
  dt.innerHTML = html;
  const b = dt.querySelector(".close");
  if(b) b.onclick = closeDetail;
  const s = dt.querySelector(".detail");
  if(s) s.focus({preventScroll:true});
  if(dt.scrollIntoView) dt.scrollIntoView({behavior:"smooth", block:"start"});
}
function closeDetail(){
  const dt = dtEl(); if(!dt) return;
  active = null; dt.innerHTML = ""; dt.removeAttribute("data-lens"); renderMatrix();
}

function openCell(key, vi){

  vi = vi || 0;
  const v = c.variants[vi];

/* ============================================================
   PRACTICE — turn a case into MCQs
   ============================================================ */
const PS = {step:1, lens:null, dil:null, field:null, ci:0, items:null, i:0, marks:[], streak:0, best:0};
const MASTERY = {};                 /* "cell|caseIdx" -> "cleared" | "clean" */
const STATS = {lens:{}, dil:{}};    /* id -> {n, ok} */

for(const k in PRACTICE_EXTRA){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_EXTRA[k]); }
for(const k in PRACTICE_MORE){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_MORE[k]); }
for(const k in PRACTICE_FILL){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_FILL[k]); }
for(const k in PRACTICE_FILL2){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_FILL2[k]); }
for(const k in PRACTICE_FILL3){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_FILL3[k]); }
for(const k in PRACTICE_FILL4){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_FILL4[k]); }
for(const k in PRACTICE_FILL5){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_FILL5[k]); }
for(const k in PRACTICE_FILL6){ PRACTICE[k] = (PRACTICE[k]||[]).concat(PRACTICE_FILL6[k]); }
for(const k in PRACTICE){                                  /* group by field so step 4 lists neatly */
  const order = []; PRACTICE[k].forEach(c => { if(!order.includes(c.d)) order.push(c.d); });
  PRACTICE[k].sort((x, y) => order.indexOf(x.d) - order.indexOf(y.d));
}
const casesFor = (lens, dil) => PRACTICE[lens + "-" + dil] || [];
const casesIn = (lens, dil, field) => casesFor(lens, dil).filter(c => c.d === field);
const fieldTotal = f => Object.values(PRACTICE).reduce((n, arr) => n + arr.filter(c => c.d === f).length, 0);
const lensesForField = f => LENSES.filter(L => DILS.some(d => casesIn(L.id, d.id, f).length));
const slotsForField = f => LENSES.reduce((n, L) => n + DILS.filter(d => casesIn(L.id, d.id, f).length).length, 0);
const dilsForField = (f, lens) => DILS.filter(d => casesIn(lens, d.id, f).length);
const mkey = (lens, dil, c) => lens + "-" + dil + "|" + casesFor(lens, dil).indexOf(c);
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const bump = (o, id, ok) => { o[id] = o[id] || {n:0, ok:0}; o[id].n++; if(ok) o[id].ok++; };

/* ---------- slot construction ----------
   Ten slots, filled in the order the Understanding panel reads:
   proposal, then down Side A, then down Side B, then the tell.  */
function buildItems(lens, dil, c){
  const D = DILS.find(x => x.id === dil);
  const sibs = casesFor(lens, dil).filter(x => x.d !== c.d);
  const s1 = sibs[0] || c, s2 = sibs[1] || sibs[0] || c;
  const kl = "New knowledge", sl = "New solution";
  const tag = o => o === "knowledge" ? kl : sl;
  const S = [];
  const slot = (side, part, prompt, opts, correct, why) =>
    S.push({side, part, prompt, opts:shuffle([...new Set(opts)]), correct, why});

  slot(null, "proposal", "Which of these is the project most people would propose?",
    [c.proposal, c.a.q, c.b.q], c.proposal,
    `That is the obvious project. It takes the current category and measure for granted and builds on top, so nothing it produces could change what anyone believes. The other two put the existing setup at risk.`);

  slot("a", "q", `Which question takes the "${D.a}" side?`,
    [c.a.q, c.b.q, s1.a.q], c.a.q, D.aAbout);
  slot("a", "stmt", "Which problem statement sets up that question?",
    [c.a.stmt, c.b.stmt, s1.a.stmt], c.a.stmt,
    `It has to set up Side A's question in this case. One wrong option was the same side written for a different field — right shape, wrong situation.`);
  slot("a", "tag", "What does answering Side A produce?",
    [kl, sl], tag(c.a.out),
    c.a.out === "knowledge" ? `New knowledge. What you hand over is a changed understanding; nothing gets built.`
                            : `A new solution. What you hand over is a thing that works — an instrument, a method, a rule.`);
  slot("a", "outcome", "What do you end up with if you pursue Side A?",
    [c.a.outcome, c.b.outcome, s1.a.outcome], c.a.outcome,
    `Side A leads to ${tag(c.a.out).toLowerCase()}, and the outcome has to follow from its question in this case.`);

  slot("b", "q", `Which question takes the "${D.b}" side?`,
    [c.b.q, s2.b.q, s1.a.q], c.b.q, D.bAbout);
  slot("b", "stmt", "Which problem statement sets up that question?",
    [c.b.stmt, s2.b.stmt, s1.b.stmt], c.b.stmt,
    `Side B's statement has to name the limit that makes its question necessary in this case.`);
  slot("b", "tag", "What does answering Side B produce?",
    [kl, sl], tag(c.b.out),
    c.b.out === "knowledge" ? `New knowledge. The deliverable is a changed understanding, not an object.`
                            : `A new solution. The deliverable is the thing itself, and findings can only come after it exists.`);
  slot("b", "outcome", "What do you end up with if you pursue Side B?",
    [c.b.outcome, s2.b.outcome, s1.b.outcome], c.b.outcome,
    `Side B leads to ${tag(c.b.out).toLowerCase()}. Notice whether it undercuts Side A — in many cells it does.`);

  slot(null, "tell", `Which condition puts you on Side A — "${D.a}"?`,
    [c.tellA, c.tellB], c.tellA,
    `This is the rule that separates the two sides here, and it is the part worth carrying out of the case. Side B is the other branch.`);

  return S;
}

/* ---------- render ---------- */
function drawPractice(){
  const v = document.getElementById("view");
  if(PS.step === 1) return v.innerHTML = pStep1(), wire(v);
  if(PS.step === 2) return v.innerHTML = pStep2(), wire(v);
  if(PS.step === 3) return v.innerHTML = pStep3(), wire(v);
  if(PS.step === 4) return v.innerHTML = pStep4(), wire(v);
  if(PS.step === 5) return v.innerHTML = pRun(), wire(v);
  if(PS.step === 6) return v.innerHTML = pRun(), wire(v);
}
function crumbs(upto){

  const D = PS.dil && DILS.find(x => x.id === PS.dil);

}

function pStep2(){

function pStep4(){

        <span class="pt">${esc(c.area)}</span>

        <span class="pd">${esc(c.story.split(". ").slice(0, 2).join(". "))}.</span></button>`;
    }).join("")}</div>

function currentCase(){
  return casesFor(PS.lens, PS.dil)[PS.ci];
}
function tracker(){
  const done = PS.marks.filter(m => m !== undefined).length;
  const ok = PS.marks.filter(m => m === true).length;
  const pct = Math.round(100 * done / PS.items.length);
  return `<div class="tracker">
    <div class="tbar"><i style="width:${pct}%"></i></div>
    <div class="trow">
      <span class="live">Score <b>${ok}</b> / ${done || 0}</span>
      <span>${done} of ${PS.items.length} filled in</span>
      ${PS.streak > 1 ? `<span class="stk">${PS.streak} in a row</span>` : ""}
      <span class="sp"></span>
      <button class="tbtn" data-menu>Main menu</button>
    </div>
  </div>`;
}
const KEYS = "ABCD";
function slotIndex(side, part){ return PS.items.findIndex(s => s.side === side && s.part === part); }
function activeSlot(){ return PS.marks.findIndex(m => m === undefined); }
function chooser(i){
  const s = PS.items[i];
  return `<div class="chooser">
    <p class="cl">Your turn</p>
    <p class="cq">${esc(s.prompt)}</p>
    <div class="mopts">${s.opts.map((o, k) =>
      `<button class="mopt" data-q="${i}" data-opt="${k}"><span class="k">${KEYS[k]}</span>${esc(o)}</button>`).join("")}</div>
  </div>`;
}
function mark(i){
  if(PS.marks[i] === undefined) return "";
  return `<span class="verdict ${PS.marks[i] ? "ok" : "no"}">${PS.marks[i] ? "Correct" : "Incorrect"}</span>`;
}
/* what the user picked, shown in red whenever it was not the right answer */
function chose(i){
  if(PS.marks[i] === undefined || PS.marks[i] === true) return "";
  return `<div class="youchose"><div class="yh">You chose</div><p>${esc(PS.picked[i])}</p></div>`;
}
/* wrap the correct value in green when the user got it wrong, so both are visible */
function rightWrap(i, inner){
  if(PS.marks[i] !== false) return inner;
  return `<div class="rightwrap"><div class="rh2">Correct answer</div>${inner}</div>`;
}
function why(i){
  return PS.marks[i] === undefined ? "" : `<div class="slotwhy">${esc(PS.items[i].why)}</div>`;
}
/* render one part of a side: filled as Understanding shows it, or a chooser, or a stub */
function partHTML(c, side, part){
  const i = slotIndex(side, part), done = PS.marks[i] !== undefined, act = activeSlot() === i;
  const o = OUT[c[side].out];
  if(!done && !act){
    const label = {q:"The question", stmt:"Problem statement", tag:"Leads to", outcome:"What you end up with"}[part];
    return `<div class="slot pending"><p class="lbl">${label}</p><p class="stub">to fill in</p></div>`;
  }
  if(!done) return chooser(i);
  if(part === "q")
    return PS.marks[i] === false
      ? `<p class="sq" style="opacity:.35">${esc(c[side].q)}${mark(i)}</p>${chose(i)}
         ${rightWrap(i, `<p class="sq" style="margin:0">${esc(c[side].q)}</p>`)}${why(i)}`
      : `<p class="sq">${esc(c[side].q)}${mark(i)}</p>${why(i)}`;
  if(part === "stmt")
    return `<div class="slot"><p class="lbl">Problem statement${mark(i)}</p>${chose(i)}
      ${rightWrap(i, `<p class="ps">${esc(c[side].stmt)}</p>`)}${why(i)}</div>`;
  if(part === "tag")
    return `<div class="slot"><p class="lbl">Leads to${mark(i)}</p>${chose(i)}
      ${rightWrap(i, `<span class="tag ${o.cls}"><small>leads to</small> ${esc(o.label)}</span>`)}${why(i)}</div>`;
  return `<div class="oc-wrap"><p class="lbl">What you end up with${mark(i)}</p>${chose(i)}
    ${rightWrap(i, `<p class="oc">${esc(c[side].outcome)}</p>`)}${why(i)}</div>`;
}
function pRun(){
  const c = currentCase(), D = DILS.find(x => x.id === PS.dil), L = LENSES.find(x => x.id === PS.lens);
  const cs = casesIn(PS.lens, PS.dil, PS.field);
  const cell = CELLS[PS.lens + "-" + PS.dil];
  const pi = slotIndex(null, "proposal"), ti = slotIndex(null, "tell");
  const act = activeSlot(), allDone = act === -1;
  if(allDone && !PS.recorded) finish();

    ? `<p style="margin:0 0 4px">${mark(pi)}</p>${chose(pi)}
       ${rightWrap(pi, `<p class="obvious"><em>${esc(c.proposal)}</em></p>`)}${why(pi)}`
    : (act === pi ? chooser(pi) : `<div class="slot pending"><p class="stub">to fill in</p></div>`);

    ? `<p style="margin:0 0 8px">${mark(ti)}</p>${chose(ti)}

       <div class="branch" style="margin-top:8px"><span class="bdg">Side B</span><p>${esc(c.tellB)}</p></div>`)}${why(ti)}`

        `<button class="dombtn" data-area="${esc(x.area)}" aria-pressed="${x === c}">${esc(x.area)}</button>`).join("")}</div>
    </div>

    <div class="block">
      <p class="bh">The case · <span>${esc(DOMAINS[c.d])}</span></p>

    </div>

    <div class="block">
      <p class="bh">What most people propose</p>

    <div class="block" style="max-width:none"><p class="bh">The same case, taken each way</p></div>
    <div class="diptych">
      <div class="side">
        <p class="sn">Side A · ${esc(D.a)}</p>
        ${partHTML(c, "a", "q")}${partHTML(c, "a", "stmt")}${partHTML(c, "a", "tag")}${partHTML(c, "a", "outcome")}
      </div>
      <div class="side">
        <p class="sn">Side B · ${esc(D.b)}</p>
        ${partHTML(c, "b", "q")}${partHTML(c, "b", "stmt")}${partHTML(c, "b", "tag")}${partHTML(c, "b", "outcome")}

  </div>`;
}
function resultBlock(c, D, L){
  const ok = PS.marks.filter(Boolean).length, n = PS.marks.length;
  const sort6 = [0,1,2,4,5,6,8].filter(i => PS.marks[i]).length;
  return `<div class="result">

    <div class="sl2">${esc(L.name)} · ${esc(D.short)} · ${esc(c.area)}</div>

      : sort6 < 5 ? "The sorting slots are where it slipped. Read the tension description at the top again — the two sides are doing genuinely different work, not the same work at different scale."

    <div class="backrow" style="margin-top:20px">

function progressLine(){
  const total = Object.values(PRACTICE).reduce((n, x) => n + x.length, 0);
  const cleared = Object.keys(MASTERY).length, clean = Object.values(MASTERY).filter(v => v === "clean").length;
  if(!cleared) return `<p class="intro">${total} cases across ${Object.keys(DOMAINS).length} fields. Pick a lens to begin.</p>`;
  return `<p class="intro"><b>${Math.round(100 * cleared / total)}%</b> of cases cleared, ${Math.round(100 * clean / cleared)}% of those without a mistake.</p>`;

function masterySection(){
  const total = Object.values(PRACTICE).reduce((n, a2) => n + a2.length, 0);
  const cleared = Object.keys(MASTERY).length, clean = Object.values(MASTERY).filter(v => v === "clean").length;
  const attempted = Object.values(STATS.lens).reduce((n, r) => n + r.n, 0);

  return `<h3 class="sub2">Where you are</h3>

    <tr><td>Answers correct overall</td><td class="mono">${acc}%</td></tr>
    <tr><td>Cases cleared</td><td class="mono">${Math.round(100 * cleared / total)}% <span style="color:var(--muted)">(${cleared} of ${total})</span></td></tr>
    <tr><td>Cleared without a mistake</td><td class="mono">${cleared ? Math.round(100 * clean / cleared) : 0}%</td></tr>
  </tbody></table>`;
}

/* ---------- practice events ---------- */
function startRun(){
  const c = currentCase();
  PS.items = buildItems(PS.lens, PS.dil, c);
  PS.i = 0; PS.marks = new Array(PS.items.length).fill(undefined); PS.picked = [];
  PS.streak = 0; PS.best = 0; PS.recorded = false; PS.step = 5;
}
function wire(v){
  v.querySelectorAll(".pick[data-field1]").forEach(b => b.onclick = () => {
    PS.field = b.dataset.field1; PS.lens = null; PS.dil = null; PS.step = 2; drawPractice();
  });
  v.querySelectorAll(".pick[data-lens]").forEach(b => b.onclick = () => {
    PS.lens = b.dataset.lens; document.body.dataset.lens = PS.lens; PS.dil = null; PS.step = 3; drawPractice();
  });
  v.querySelectorAll(".pick[data-dil]").forEach(b => b.onclick = () => {
    PS.dil = b.dataset.dil;
    const cs = casesIn(PS.lens, PS.dil, PS.field);
    if(cs.length === 1){ PS.ci = casesFor(PS.lens, PS.dil).indexOf(cs[0]); startRun(); } else PS.step = 4;
    drawPractice();
  });
  v.querySelectorAll("[data-area]").forEach(b => b.onclick = () => {
    const c = casesFor(PS.lens, PS.dil).find(x => x.area === b.dataset.area);
    PS.ci = casesFor(PS.lens, PS.dil).indexOf(c); PS.field = c.d; startRun(); drawPractice();
  });
  v.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { PS.step = +b.dataset.goto; drawPractice(); });
  v.querySelectorAll("[data-opt]").forEach(b => { if(!b.disabled) b.onclick = () => answer(+b.dataset.q, +b.dataset.opt); });
  v.querySelectorAll("[data-menu]").forEach(b => b.onclick = () => { PS.step = 1; drawPractice(); try{ window.scrollTo(0, 0); }catch(e){} });
  const ag = v.querySelector("[data-again]"); if(ag) ag.onclick = () => { PS.step = 3; drawPractice(); };
  const sp = v.querySelector("[data-surprise]"); if(sp) sp.onclick = surprise;
}
function answer(qi, k){
  if(PS.marks[qi] !== undefined) return;
  const it = PS.items[qi], chosen = it.opts[k], ok = chosen === it.correct;
  PS.picked[qi] = chosen; PS.marks[qi] = ok;
  PS.streak = ok ? PS.streak + 1 : 0;
  PS.best = Math.max(PS.best, PS.streak);
  bump(STATS.lens, PS.lens, ok); bump(STATS.dil, PS.dil, ok);
  drawPractice();
  const nxt = document.querySelector(".qcard:not(.answered):not(.locked)");
  try{ if(nxt && nxt.scrollIntoView) nxt.scrollIntoView({behavior:"smooth", block:"center"}); }catch(e){}
}
function finish(){
  const c = currentCase(), key = mkey(PS.lens, PS.dil, c);
  const clean = PS.marks.every(Boolean);
  if(clean || MASTERY[key] !== "clean") MASTERY[key] = clean ? "clean" : "cleared";
  PS.recorded = true;
}
function surprise(){
  const pool = [];
  for(const L of LENSES) for(const d of DILS) casesFor(L.id, d.id).forEach((c, i) => {
    if(!MASTERY[mkey(L.id, d.id, c)]) pool.push([L.id, d.id, i, c]);
  });
  if(!pool.length){ PS.step = 1; return drawPractice(); }
  const [l, d, i, c] = pool[Math.floor(Math.random() * pool.length)];
  PS.lens = l; PS.dil = d; PS.field = c.d; PS.ci = i;
  document.body.dataset.lens = l;
  startRun(); drawPractice();
}

/* ============================================================
   Tabs
   ============================================================ */
let TAB = "understand";
const TABDEFS = [{id:"understand", label:"Understanding"}, {id:"practice", label:"Practice"}];
function renderTabs(){
  document.getElementById("tabs").innerHTML = `<div class="inner">${TABDEFS.map(t =>
    `<button role="tab" data-tab="${t.id}" aria-selected="${TAB === t.id}">${t.label}</button>`).join("")}</div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderTabs(); route(); });
}
function route(){
  const v = document.getElementById("view");
  const read = document.getElementById("read");
  if(TAB === "understand"){
    v.innerHTML = `<p class="intro">Three ways to interrogate a field, crossed with five tensions every project takes a side on. Each cell works one real case: what people actually do, the project most would propose, and the two better ones built from the same material.</p>
      <div class="matrix" id="matrix"></div><div id="detail"></div>`;
    renderMatrix(); renderRead();
  } else {
    if(read) read.innerHTML = `<b>${Object.keys(MASTERY).length}</b> of ${Object.values(PRACTICE).reduce((n, a) => n + a.length, 0)} cases cleared`;
    drawPractice();
  }
}
renderTabs(); route();

</script>
