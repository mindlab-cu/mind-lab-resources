/* ---------- brand bar ---------- */
.brandbar{background:var(--cell);border-bottom:1px solid var(--rule);}
.brandinner{max-width:1200px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;}
.brandinner img{display:block;}
.brandinner .rekhi{height:38px;width:auto;}
.brandinner .seal{height:42px;width:42px;}
.brandinner .bt{flex:1;text-align:center;font-family:var(--mono);font-size:clamp(13px,2vw,19px);
  font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#4A5560;padding-left:.32em;}
@media (max-width:620px){
  .brandinner{padding:10px 16px;gap:12px;}
  .brandinner .rekhi{height:28px;}
  .brandinner .seal{height:32px;width:32px;}
  .brandinner .bt{font-size:12px;letter-spacing:.2em;}
}
header.top{background:var(--cell);border-bottom:1px solid var(--rule);}
.mast{max-width:1200px;margin:0 auto;padding:13px 22px;display:flex;gap:16px;align-items:baseline;justify-content:space-between;}
.mast h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.012em;}
.read{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-align:right;}
.intro{margin:24px 0 0;font-size:15px;color:var(--ink-2);max-width:76ch;}
.stepn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
.read b{color:var(--ink);font-weight:600;}

/* ---------- matrix ---------- */
.matrix{display:grid;grid-template-columns:186px repeat(5,1fr);margin-top:30px;
  border:1px solid var(--rule);background:var(--hair);gap:1px;}
.corner,.ch,.rh,.cell{border:0;font:inherit;text-align:left;}
.corner{background:var(--corner);padding:14px 14px 13px;}
.corner .cn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:block;}
.corner .ct{display:block;font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.3;}
.ch{background:var(--colhead);padding:14px 13px 13px;cursor:pointer;color:var(--ink);transition:background .14s;}
.ch:hover{background:var(--corner);}
.ch .cn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);display:block;margin-bottom:6px;}
.ch .ct{display:block;font-size:13.5px;line-height:1.3;font-weight:600;letter-spacing:-.005em;}
.rh{background:var(--pale);padding:16px 14px;cursor:pointer;transition:background .14s;}
.rh:hover{filter:brightness(.975);}
.rh .rn{display:block;font-size:17px;font-weight:600;color:var(--lens);letter-spacing:-.012em;}
.rh .rq{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:5px;}
.cell{background:var(--cell);cursor:pointer;padding:15px 13px;min-height:96px;position:relative;transition:background .14s;}
.cell:hover{background:var(--wash);}
.cell .char{display:block;font-size:14.5px;line-height:1.32;max-width:22ch;}
.cell .dil{display:none;}
.cell .seen{position:absolute;right:11px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--lens);opacity:0;}
.cell.seen .seen{opacity:.6;}
.cell[aria-current="true"]{background:var(--pale);box-shadow:inset 3px 0 0 var(--lens);}
.ch:focus-visible,.rh:focus-visible,.cell:focus-visible{outline:2px solid var(--lens);outline-offset:-3px;}

@media (max-width:880px){
  .matrix{display:block;background:none;border:0;}
  .corner,.ch{display:none;}
  .rh{display:block;width:100%;border:1px solid var(--rule);margin-top:16px;}
  .cell{display:block;width:100%;min-height:0;padding:13px 14px;border:1px solid var(--hair);border-top:0;}
  .cell .dil{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .cell .char{max-width:none;}
}

/* ---------- detail ---------- */
.detail{margin-top:36px;background:var(--cell);border:1px solid var(--rule);border-top:3px solid var(--lens);
  padding:28px 30px 30px;animation:fade .26s ease;}
@media (max-width:600px){.detail{padding:22px 18px 24px;}}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.detail .eye{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lens);margin:0 0 9px;}
.detail h2{margin:0 0 12px;font-size:clamp(19px,2.5vw,26px);line-height:1.24;font-weight:600;letter-spacing:-.015em;max-width:32ch;}
.what{margin:0;font-size:16.5px;line-height:1.55;color:var(--ink-2);max-width:70ch;}

.block{margin-top:24px;max-width:74ch;}
.block .bh{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;}
.block .bh span{color:var(--lens);}
.case{background:var(--pale);padding:16px 18px;font-size:15.5px;line-height:1.55;margin:0;}
.obvious{border:1px dashed var(--rule);padding:14px 18px;margin:0;font-size:15.5px;color:var(--ink-2);}
.obvious em{font-style:normal;color:var(--ink);}

.diptych{display:grid;grid-template-columns:1fr 1fr;margin-top:28px;border-top:1px solid var(--rule);gap:0;}
@media (max-width:780px){.diptych{grid-template-columns:1fr;}}
.side{padding:20px 26px 4px 0;}
.side+.side{border-left:1px solid var(--hair);padding-left:26px;padding-right:0;}
@media (max-width:780px){.side{padding:20px 0 4px;}.side+.side{border-left:0;border-top:1px solid var(--hair);padding-left:0;}}
.side .sn{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lens);margin:0 0 7px;}
.side .sq{margin:0 0 16px;font-size:17.5px;font-weight:600;letter-spacing:-.012em;line-height:1.34;}
.side .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px;}
.side .ps{margin:0;font-size:15.5px;line-height:1.52;padding-left:13px;border-left:2px solid var(--pale);}
.side .oc{margin:0;font-size:16.5px;line-height:1.56;color:#333E4A;}
.side .oc-wrap{margin-top:18px;padding-top:15px;border-top:1px dotted var(--rule);}
.side .oc-wrap .lbl{font-size:11px;color:var(--lens);}
.tag{display:inline-flex;align-items:baseline;gap:7px;margin-top:16px;border:1px solid;border-radius:2px;padding:4px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;}
.tag small{font-size:8.5px;letter-spacing:.07em;opacity:.7;}
.t-know{color:var(--know);border-color:var(--know);}
.t-sol{color:var(--sol);border-color:var(--sol);}

.branchwrap{margin-top:30px;border-top:1px solid var(--rule);padding-top:20px;max-width:78ch;}
.branchwrap .bhh{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin:0 0 14px;}
.branch{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:start;padding:11px 14px;background:var(--wash);border-left:3px solid var(--lens);}
.branch+.branch{margin-top:8px;}
.branch .bdg{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--lens);font-weight:700;padding-top:2px;}
.branch p{margin:0;font-size:15px;line-height:1.5;}
@media (max-width:560px){.branch{grid-template-columns:1fr;gap:5px;}}

.dompick{margin-top:24px;}
.dompick .dh{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;}
.dombtns{display:flex;gap:7px;flex-wrap:wrap;}
.dombtn{appearance:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:8px 14px;
  border:1px solid var(--rule);border-radius:2px;background:var(--cell);color:var(--ink-2);cursor:pointer;transition:all .14s;}
.dombtn:hover{border-color:var(--lens);color:var(--ink);}
.dombtn[aria-pressed="true"]{background:var(--lens);border-color:var(--lens);color:#fff;}
.dombtn:focus-visible{outline:2px solid var(--lens);outline-offset:2px;}
.variant{animation:fade .22s ease;}

/* ---------- top tabs ---------- */
nav.tabs{background:var(--cell);border-bottom:1px solid var(--rule);}
nav.tabs .inner{max-width:1200px;margin:0 auto;padding:0 22px;display:flex;gap:0;}
nav.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:13px 16px;cursor:pointer;}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);}
nav.tabs button:focus-visible{outline:2px solid var(--lens);outline-offset:-3px;}

/* ---------- practice wizard ---------- */
.pwrap{padding-top:30px;}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.07em;color:var(--muted);margin-bottom:24px;}
.crumbs button{appearance:none;background:var(--cell);border:1px solid var(--rule);border-radius:2px;
  font:inherit;color:var(--ink);padding:5px 10px;cursor:pointer;}
.crumbs button:hover{border-color:var(--lens);}
.crumbs span.sep{color:var(--rule);}
.stepq{font-size:clamp(19px,2.5vw,25px);line-height:1.26;margin:0 0 6px;font-weight:600;letter-spacing:-.015em;}
.steph{margin:0 0 22px;color:var(--ink-2);font-size:15px;max-width:64ch;}
.picks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));}
.pick{text-align:left;background:var(--cell);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;
  cursor:pointer;font:inherit;color:inherit;transition:all .14s;}
.pick:hover{border-color:var(--lens);transform:translateY(-1px);}
.pick:focus-visible{outline:2px solid var(--lens);outline-offset:2px;}
.pick .pt{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;}
.pick .ps{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:5px;}
.pick .pd{display:block;font-size:13.5px;color:var(--ink-2);margin-top:7px;}
.pick[disabled]{cursor:not-allowed;opacity:.45;background:transparent;border-style:dashed;transform:none;}
.pick[disabled]:hover{border-color:var(--rule);transform:none;}
.pick.done{border-left:3px solid var(--open);}

/* ---------- run ---------- */
.runbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
.pips{display:flex;gap:4px;}
.pip{width:20px;height:5px;background:var(--rule);border-radius:1px;}
.pip.ok{background:var(--open);}
.pip.no{background:var(--sol);}
.pip.now{background:var(--ink);}
.streak{color:var(--lens);font-weight:600;}
.qbox{background:var(--cell);border:1px solid var(--rule);border-top:3px solid var(--lens);padding:24px 26px 26px;}
@media (max-width:600px){.qbox{padding:20px 17px 22px;}}
.qbox .qn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lens);margin:0 0 8px;}
.qbox .qq{font-size:clamp(17px,2.1vw,21px);line-height:1.32;margin:0 0 18px;font-weight:600;letter-spacing:-.012em;}
.mopts{display:grid;gap:9px;}
.mopt{text-align:left;background:var(--page);border:1px solid var(--rule);border-radius:2px;padding:13px 15px;
  cursor:pointer;font:inherit;color:inherit;font-size:15.5px;line-height:1.48;transition:all .12s;position:relative;padding-left:44px;}
.mopt .k{position:absolute;left:15px;top:13px;font-family:var(--mono);font-size:11px;color:var(--muted);}
.mopt:hover:not([disabled]){border-color:var(--lens);background:var(--cell);}
.mopt:focus-visible{outline:2px solid var(--lens);outline-offset:2px;}
.mopt[disabled]{cursor:default;}
.mopt.right{border-color:var(--open);background:#F0F8F3;}
.mopt.right .k{color:var(--open);}
.mopt.wrong{border-color:var(--sol);background:#FBF2F0;}
.mopt.wrong .k{color:var(--sol);}
.mopt.dim{opacity:.5;}
.fb{margin-top:16px;padding:13px 16px;border-left:3px solid var(--lens);background:var(--wash);font-size:15px;}
.fb b{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:5px;font-weight:400;}
.fb.good b{color:var(--open);}
.fb.bad b{color:var(--sol);}
.casebox{background:var(--pale);padding:16px 18px;font-size:15.5px;line-height:1.55;margin:0 0 20px;}
.casebox .ch2{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;}

/* ---------- score + mastery ---------- */
.score{background:var(--cell);border:1px solid var(--rule);border-top:3px solid var(--lens);padding:26px 28px;}
.score .big2{font-family:var(--mono);font-size:40px;letter-spacing:-.03em;line-height:1;}
.score .sl2{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;}
.mast{display:grid;grid-template-columns:150px repeat(5,1fr);gap:1px;background:var(--hair);border:1px solid var(--rule);margin-top:14px;}
.mast .mh{background:var(--colhead);padding:9px 10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);}
.mast .mr{padding:11px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--lens);}
.mast .mc{background:var(--cell);padding:11px 8px;display:flex;gap:4px;align-items:center;justify-content:center;}
.mast .md{width:9px;height:9px;border-radius:50%;border:1px solid var(--rule);}
.mast .md.cleared{background:var(--crowded,#B36A16);border-color:var(--crowded,#B36A16);}
.mast .md.clean{background:var(--open);border-color:var(--open);}
@media (max-width:760px){.mast{grid-template-columns:104px repeat(5,1fr);}.mast .mh,.mast .mr{font-size:8px;padding:7px 5px;}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin-top:12px;align-items:center;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid var(--rule);margin-right:5px;vertical-align:-1px;}
.legend i.cleared{background:#B36A16;border-color:#B36A16;}
.legend i.clean{background:var(--open);border-color:var(--open);}
.rows{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;}
.rows th,.rows td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);}
.rows th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;}
.rows .bar2{height:6px;background:var(--page);min-width:64px;position:relative;}
.rows .bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--lens);}
h3.sub2{font-size:16px;margin:30px 0 4px;font-weight:600;}
p.sub2p{margin:0 0 12px;color:var(--ink-2);font-size:14px;max-width:66ch;}

/* ---------- progress + live score ---------- */
.tracker{position:sticky;top:0;z-index:20;background:var(--cell);border-bottom:1px solid var(--rule);
  margin:0 -22px 24px;padding:11px 22px 10px;}
.tbar{height:4px;background:var(--page);border-radius:2px;overflow:hidden;}
.tbar i{display:block;height:100%;background:var(--lens);transition:width .25s ease;}
.trow{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-top:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.trow .live{color:var(--ink);font-size:14px;letter-spacing:0;text-transform:none;font-weight:600;}
.trow .live b{font-family:var(--mono);font-size:15px;}
.trow .stk{color:var(--lens);font-weight:600;}
.trow .sp{flex:1;}

/* ---------- one-page run ---------- */
.qcard{background:var(--cell);border:1px solid var(--rule);border-left:3px solid var(--rule);padding:20px 22px 22px;margin-top:14px;}
.qcard.answered{border-left-color:var(--lens);}
.qcard.correct{border-left-color:var(--open);}
.qcard.incorrect{border-left-color:var(--sol);}
@media (max-width:600px){.qcard{padding:17px 15px 18px;}}
.qcard .qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.qcard .qn{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lens);margin:0;}
.qcard .mk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;}
.qcard .mk.ok{color:var(--open);}
.qcard .mk.no{color:var(--sol);}
.qcard .qq{font-size:17px;line-height:1.34;margin:0 0 15px;font-weight:600;letter-spacing:-.01em;}
.locked{opacity:.55;pointer-events:none;}
.locknote{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;}

/* ---------- slot choosers inside the Understanding layout ---------- */
.slot{margin-top:16px;}
.slot.pending{border:1px dashed var(--rule);padding:11px 13px;opacity:.55;}
.slot.pending .lbl{margin:0 0 3px;}
.slot.pending .stub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);}
.chooser{border:1px solid var(--lens);border-left-width:3px;background:var(--wash);padding:14px 15px;margin-top:16px;}
.chooser .cq{font-size:15.5px;font-weight:600;line-height:1.35;margin:0 0 12px;letter-spacing:-.01em;}
.chooser .cl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--lens);margin:0 0 6px;}
.chooser .mopt{font-size:14.5px;padding:11px 13px 11px 38px;background:var(--cell);}
.chooser .mopt .k{left:13px;top:11px;}
.slotmark{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-left:9px;vertical-align:1px;}
.slotmark.ok{color:var(--open);}
.slotmark.no{color:var(--sol);}
.slotwhy{margin-top:10px;padding:10px 13px;border-left:2px solid var(--rule);background:var(--cell);font-size:13.5px;color:var(--ink-2);}
.result{background:var(--cell);border:1px solid var(--rule);border-top:3px solid var(--lens);padding:24px 26px;margin-top:32px;}
.result .big2{font-family:var(--mono);font-size:36px;letter-spacing:-.03em;line-height:1;}
.result .sl2{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;}

/* ---------- your answer vs the right one ---------- */
.verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;border:1px solid;border-radius:2px;padding:3px 8px;margin-left:9px;vertical-align:2px;}
.verdict.ok{color:var(--open);border-color:var(--open);background:#F0F8F3;}
.verdict.no{color:var(--sol);border-color:var(--sol);background:#FBF2F0;}
.youchose{border:1px solid var(--sol);border-left-width:3px;background:#FBF2F0;padding:11px 13px;margin-top:12px;}
.youchose .yh{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sol);margin:0 0 5px;}
.youchose p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2);}
.rightwrap{border-left:3px solid var(--open);padding-left:13px;margin-top:12px;}
.rightwrap .rh2{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--open);margin:0 0 6px;}
footer.foot{max-width:1200px;margin:0 auto;padding:24px 22px 40px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);}
</style>
</head>
