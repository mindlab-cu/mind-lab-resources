/* ============================================================
   THE PROBLEM MATRIX — content
   15 intersections. Each worked twice, in two different fields.
   ============================================================ */

const LENSES = [
 {id:"ont",name:"Ontological",q:"What exists?",
  about:`Every field has a list of things it treats as real — capability, a skill, engagement, inflation, a nutrient, dark matter. Most were named before anyone understood them, and the name has been quietly doing work ever since. This lens asks whether the named thing is really a thing.`,
  about2:`It is the least used lens, because working on method feels more productive. But if you are wrong about what exists, measuring better will not help. The mistake spreads into everything built on top. When a field stops making progress, this is usually why.`},
 {id:"epi",name:"Epistemological",q:"How do we know?",
  about:`You almost never see the thing you care about directly. You see a stand-in: a test score, a survey answer, a GPS reading, a lab result. This lens takes the pair — the claim and its stand-in — and asks what the stand-in cannot show.`,
  about2:`The most useful move is to ask whether the stand-in is the thing, or just something that usually comes with it, and then look for cases where the two separate. A thermometer is checked against the thing it reports, so there is no gap. A pain score out of ten measures what someone can and will say. Same move, completely different result.`},
 {id:"met",name:"Methodological",q:"How do we investigate?",
  about:`Everything gets studied at some level — a neuron, a student, a household, a nutrient, a finished proof. That level was picked partly because it fits and partly because it was the one you could reach. This lens asks whether it fits.`,
  about2:`Three directions, not one: down to something smaller, up to the whole system, or sideways into a method nobody has built. People avoid the third, because you deliver a tool instead of a finding. That is exactly where a new ability to see things comes from.`}
];

const DILS = [
 {id:"d1",n:"I",name:"Clever questions vs changing the machinery",short:"Clever question vs new machinery",
  a:"Ask a cleverer question", b:"Change the machinery",
  about:`Some questions can be answered with the tools you already have, if you ask them better. Others cannot be answered until someone builds something. Getting this wrong wastes years.`,
  aAbout:`Work with what exists. Cheaper and faster. The answer is often already sitting in data someone collected and never looked at.`,
  bAbout:`The limit is what you can see, not how hard you think. What you deliver is the tool. Slower and harder to fund, and sometimes the only way.`},
 {id:"d2",n:"II",name:"Curiosity-driven vs demand-driven innovation",short:"Curiosity vs demand",
  a:"Curiosity-driven", b:"Demand-driven",
  about:`Either nobody is waiting for the answer, or someone is. Waiting does not make a question better. It changes who gets to say the answer is good enough.`,
  aAbout:`Worth asking even though nobody asked. Freer, and honest about having no one behind it.`,
  bAbout:`Someone cannot make a decision until this is answered. Tighter deadlines, easier funding — but they usually need the current answer to keep working.`},
 {id:"d3",n:"III",name:"Predictable vs transformative research",short:"Predictable vs transformative",
  a:"Predictable", b:"Transformative",
  about:`Ask what happens if you are right. Predictable: the field gets the result it expected. Transformative: part of the field loses what it was about. Both are real work. Only one is easy to fund.`,
  aAbout:`It will get answered, probably by several groups at once. Fine work, and it limits how far the result can travel.`,
  bAbout:`If it lands, the field rearranges. Most attempts fail, and failures here are hard to publish.`},
 {id:"d4",n:"IV",name:"Process vs product research",short:"Process vs product",
  a:"Process", b:"Product",
  about:`Does the work end with understanding how something happens, or with a thing that did not exist before? You usually know early, and it often gets blurred in the writing.`,
  aAbout:`You deliver an explanation. Right when you cannot yet name the thing you would build.`,
  bAbout:`You deliver an object, with a test it has to pass. Concrete, and it commits you.`},
 {id:"d5",n:"V",name:"Quantitative refinement vs qualitative change",short:"Refinement vs qualitative change",
  a:"Quantitative refinement", b:"Qualitative change",
  about:`Same category measured better, or the category itself changes. These look almost the same on paper and end up in completely different places. One gives you a better number. The other says the number was never measuring what it claimed.`,
  aAbout:`More precision inside the category you already have. Useful and quickly adopted. Any mistake in the category stays.`,
  bAbout:`The category is what changes. Your result would make old findings artefacts, not approximations.`}
];

const DOMAINS = {
  phys:"Physics", chem:"Chemistry", math:"Mathematics", econ:"Economics",
  mgmt:"Management", ecol:"Ecology", nutr:"Nutrition", med:"Health & medicine",
  sport:"Sports", happy:"Science of happiness", mind:"Consciousness",
  cs:"Computer science", edu:"Education",
  law:"Law & justice", clim:"Climate & energy", media:"Media & journalism"
};
const K = "knowledge", SOL = "solution";

const CELLS = {

/* ================= ONTOLOGICAL ================= */

"ont-d1":{char:"Reason it out, or build the thing that could tell",
 what:`Some doubts about whether a thing exists can be settled with data someone already has. Others need a tool nobody has built.`,
 variants:[
 {d:"phys",
  story:`Galaxies spin too fast for the matter we can see. The standard answer is dark matter — stuff that has mass but does not interact with light. Underground detectors have hunted it for thirty years and found nothing. Meanwhile telescope surveys keep producing maps, and most of that archive sits unexamined.`,
  proposal:`Build a bigger, more sensitive dark matter detector.`,
  a:{q:`Do existing sky surveys separate extra matter from a different law of gravity?`,
     stmt:`Dark matter and modified gravity predict the same spin curves in ordinary galaxies, but they come apart in a few specific systems: colliding clusters, very sparse galaxies, and cases where the visible mass sits away from the gravitational centre. Public survey archives already contain these systems. This project assembles them and tests which account survives.`,
     out:K,
     outcome:`You find out whether the two accounts can be told apart with data already on disk. If they can, one of them is wrong, and no new detector was needed to show it. If they cannot, that is the argument for building one — and now you know what it has to do.`},
  b:{q:`What would detect a particle that interacts with almost nothing?`,
     stmt:`Existing detectors search a narrow range of particle mass, chosen when the field expected something different. A null result there rules out very little. This project builds a detector sensitive in a range no current instrument reaches, and says in advance what a null result would eliminate.`,
     out:SOL,
     outcome:`A working detector, and a region of the possibilities that gets settled either way it comes out. The detector is what you deliver. Whether dark matter turns up is not something you can promise, and a proposal that promises it is lying.`},
  tellA:`The systems that separate the two accounts already exist in public archives. Nothing needs building. Go and assemble them.`,
  tellB:`The mass range you care about has never been probed by any instrument. No archive contains it, so building is the only route.`},
 {d:"chem",
  story:`A drug is patented as a compound, and separately as a crystal form. Different crystal forms of the same molecule dissolve at different rates, so the "same drug" can behave differently in the body. Whether two samples are the same substance is decided by their X-ray diffraction pattern.`,
  proposal:`Build a database that stores diffraction patterns for every known drug form.`,
  a:{q:`Do published diffraction patterns already show that samples called the same form are not?`,
     stmt:`Thousands of diffraction patterns for marketed drugs sit in public and regulatory archives, filed under compound names rather than compared with each other. This project re-analyses them to test whether samples labelled as one crystal form are in fact several, and whether dissolution differences track those splits.`,
     out:K,
     outcome:`You learn whether a substance identity used in patents and approvals is actually one thing. If it is not, some products approved as equivalent are not equivalent — established from patterns already filed, with no new samples run.`},
  b:{q:`What would resolve forms that powder diffraction cannot separate?`,
     stmt:`Some crystal forms differ only in disorder that powder diffraction cannot resolve, so two genuinely different solids give the same pattern. No archive can settle those cases. This project develops a characterisation method that separates them, and validates it on pairs known to behave differently in the body.`,
     out:SOL,
     outcome:`A method labs and regulators can run, and a set of substances that turn out to be two things rather than one. The method is the deliverable; which drugs are affected can only be found once it exists.`},
  tellA:`The patterns were collected and filed, and nobody compared them. Reanalysis will settle it.`,
  tellB:`The difference you suspect leaves no trace in any pattern ever recorded. Only a new method can reach it.`}
 ]},

"ont-d2":{char:"Idle question, or a clinic is waiting",
 what:`Some questions have nobody waiting on the answer. Others have a clinic or an office waiting. Waiting does not improve the question — it changes who decides the answer is good enough.`,
 variants:[
 {d:"med",
  story:`Long COVID is treated as one condition. Clinics run long COVID services, trials recruit long COVID patients, and disability assessors work from a long COVID diagnosis. Patients arrive with breathlessness, or crushing fatigue, or a racing heart, or brain fog — often with no overlap at all.`,
  proposal:`Build an app that helps long COVID patients track their symptoms.`,
  a:{q:`Is long COVID one condition, or several that share a trigger?`,
     stmt:`Long COVID groups patients by what happened before they got ill rather than by what is wrong with them, and the symptom clusters barely overlap. This project tests whether the population divides into distinct conditions with different mechanisms, using records already held by existing clinics.`,
     out:K,
     outcome:`If it divides, every trial that recruited "long COVID patients" was mixing different diseases together — which would explain the long run of trials finding no effect. Future trials would recruit by mechanism instead. Nobody asked for this and no decision was waiting on it.`},
  b:{q:`What definition should a disability assessor apply tomorrow?`,
     stmt:`Assessors have to decide claims now and need a rule they can apply the same way every time, but there is no agreed criterion for who has long COVID and who does not. This project derives a decision rule from existing clinic records and measures whether independent assessors reach the same verdict using it.`,
     out:SOL,
     outcome:`A written criterion assessors can use, and a measured rate of agreement between them. Claims stop depending on which assessor a patient happens to get. The catch: the office needs some rule to exist, so "it is not really one condition" is not an answer they can act on.`},
  tellA:`Nobody's decision is blocked, and you would have to invent someone waiting to claim otherwise. Say plainly that it is curiosity-driven.`,
  tellB:`You can name an office making a decision this month that turns on the answer. Their deadline and their standard of proof become yours.`},
 {d:"edu",
  story:`Schools identify dyslexia and allocate support against the diagnosis. It usually rests on a gap between reading ability and general ability. Children arrive with slow decoding, or poor spelling, or trouble holding a sequence in mind — frequently not together.`,
  proposal:`Build a screening app that flags children at risk of dyslexia.`,
  a:{q:`Is dyslexia one condition, or several that share a symptom?`,
     stmt:`Dyslexia is identified by a gap between reading and general ability, which groups children by what they cannot do rather than by why. This project uses existing assessment records to test whether the identified group divides into distinct profiles that respond differently to the same support.`,
     out:K,
     outcome:`If it divides, intervention studies that recruited "children with dyslexia" were averaging across groups that need different things — which would explain why so many report small effects. Nobody commissioned it.`},
  b:{q:`What criterion should a school use to allocate support this term?`,
     stmt:`Schools must allocate a fixed support budget now, and the current criterion produces different decisions in different schools for similar children. This project derives a criterion from existing records and tests whether independent assessors applying it reach the same allocation.`,
     out:SOL,
     outcome:`A rule a school can apply this term, with a measured agreement rate. Support stops depending on which school a child attends. The constraint is that the school needs some rule, so "the category does not hold" cannot be the deliverable.`},
  tellA:`No one is blocked on it. You want to know whether the category holds. Say so.`,
  tellB:`A school has to allocate a budget this term and cannot wait. Their timetable is yours.`}
 ]},

"ont-d3":{char:"Tidy the category, or dissolve it",
 what:`One version tidies up a category. The other says the category should not exist. Both are real work. Only the first is easy to fund.`,
 variants:[
 {d:"cs",
  story:`Language models are said to hallucinate. Products report a hallucination rate, retrieval gets offered as the fix, and the one word covers invented citations, wrong arithmetic, and confidently misreading a document you handed over.`,
  proposal:`Build a tool that detects hallucinations and flags them to the user.`,
  a:{q:`Does one hallucination rate hide several unrelated failures?`,
     stmt:`Invented citations, arithmetic errors and misreadings of supplied text are reported under one hallucination rate, though they have different causes and different fixes. This project separates them and tests whether the combined rate can fall while one type gets worse.`,
     out:K,
     outcome:`A breakdown buyers and vendors can use, and proof that two products quoting the same rate may fail in completely different ways. Hallucination survives as a category, better organised. Several groups will get there around when you do.`},
  b:{q:`Is hallucination in the model, or in our ability to check?`,
     stmt:`Calling an output a hallucination assumes there is another mode where the model is not making things up. If the model generates the same way in both cases and only our ability to verify differs, then hallucination describes the checker, not the model. This project tests whether the distinction survives when verification is held constant.`,
     out:K,
     outcome:`If it does not survive, a hallucination rate stops being a fact about the model and becomes a measure of how well we can check its work. Every product quoting one has been advertising its own verifier. A large body of published numbers loses what it was about.`},
  tellA:`If you are right, people adopt your definition and the category carries on in better shape.`,
  tellB:`If you are right, a body of published numbers loses the thing it was about.`},
 {d:"med",
  story:`Burnout is measured by a questionnaire, reported as a rate, and treated as a condition of the person. Employers respond with resilience training and wellbeing days. Reported rates keep climbing.`,
  proposal:`Build a wellbeing platform that screens staff for burnout risk.`,
  a:{q:`Does the burnout score cover several states that move separately?`,
     stmt:`Burnout scores combine exhaustion, cynicism and a reduced sense of accomplishment into one figure, though the three can move independently in the same person. This project separates them and tests whether an overall rate can improve while one component gets worse.`,
     out:K,
     outcome:`A breakdown employers and clinicians can use, and evidence that a falling burnout rate may be hiding a rising component. Burnout survives as a category, in better order.`},
  b:{q:`Does burnout describe the person, or the job?`,
     stmt:`Burnout is scored on individuals and treated as something they have. If it appears reliably under particular working conditions and disappears when those change, regardless of who is in the role, then it names a property of the job rather than the person. This project tests whether burnout travels with people or with posts.`,
     out:K,
     outcome:`If it travels with posts, every individual-level intervention has been treating the wrong object, and resilience training was always going to fail. Burnout becomes a measure of a workplace, and staff-level screening becomes hard to justify.`},
  tellA:`If you are right, the questionnaire gets better and the category stays put.`,
  tellB:`If you are right, an entire industry of individual interventions loses its target.`}
 ]},

"ont-d4":{char:"Account for the category, or replace it",
 what:`A doubt about a category is naturally a question about how it came to be used. Turning it into a product means promising to build the replacement.`,
 variants:[
 {d:"edu",
  story:`The skill is the unit of vocational education. Curricula list skills, courses teach them one at a time, assessment certifies them separately, and employers hire against skill lists. A graduate leaves with a certificate showing thirty skills ticked off.`,
  proposal:`Build a platform that maps college courses to the skills employers ask for.`,
  a:{q:`Where did the skill come from, and does real work divide up that way?`,
     stmt:`The skill was adopted as an administrative unit because it makes curricula and certificates easy to write, not because anyone showed that competence comes in skill-sized pieces. This project traces how the unit was chosen, and tests by watching people do the actual work whether performance separates the way the framework does.`,
     out:K,
     outcome:`An account of how the skill got its authority, plus evidence on whether real work divides that way. If it does not, the thirty-tick certificate describes the curriculum rather than the graduate. You offer no replacement, and you promise none.`},
  b:{q:`What unit would predict job performance better than the skill?`,
     stmt:`If competence does not come in skill-sized pieces, skill-based certificates will predict performance poorly, and there is currently nothing else to certify against. This project defines an alternative unit and tests whether it predicts supervisor-rated performance better than the skill list it would replace.`,
     out:SOL,
     outcome:`A working alternative framework, and a head-to-head test it can lose. Colleges either get something better to certify against, or clear evidence the skill was fine all along. Both are useful.`},
  tellA:`You can say what is wrong with the unit but not what would replace it. That is honest process work — do not dress it up as a product.`,
  tellB:`You can name the replacement unit and the test it has to pass. It has to be able to fail.`},
 {d:"mgmt",
  story:`Performance appraisal rates people against a list of competencies. Managers score each one on a scale, the scores roll up into a rating, and the rating drives pay and promotion. The competency list is usually inherited from a consultancy framework nobody at the company chose.`,
  proposal:`Build an appraisal tool that collects competency ratings from more colleagues.`,
  a:{q:`Where did the competency come from, and does managerial work divide that way?`,
     stmt:`The competency became the unit of appraisal because it makes rating forms and pay bands easy to write, not because managerial performance was shown to separate into competencies. This project traces the origin of the list in use and tests, by observing managers at work, whether performance divides as the form assumes.`,
     out:K,
     outcome:`An account of where the appraisal categories came from, and evidence on whether they carve anything real. If they do not, appraisal scores describe the form rather than the manager. No replacement offered.`},
  b:{q:`What unit would predict promotion success better than a competency score?`,
     stmt:`If managerial performance does not divide into competencies, competency ratings will predict success in a bigger role poorly, and nothing else currently exists to appraise against. This project defines an alternative unit and tests whether it predicts performance after promotion better than the current rating.`,
     out:SOL,
     outcome:`An appraisal instrument the company can run, and a comparison it can lose. Either promotions get better predictions, or you have shown the existing form was adequate.`},
  tellA:`You can say the unit is wrong but not what replaces it. Keep it as an account.`,
  tellB:`You can name the replacement and the prediction test it must beat.`}
 ]},

"ont-d5":{char:"Where the insight gets wasted",
 what:`Cleaning up a measurement inside a category you already doubt is the usual way a good insight gets wasted. The number improves and the mistake stays.`,
 variants:[
 {d:"mgmt",
  story:`Employee engagement is measured by an annual survey and reported as one score. Executives track it quarter to quarter, tie bonuses to it, and compare divisions. Every vendor's survey asks different questions, so scores cannot be compared between companies.`,
  proposal:`Build a dashboard that tracks the engagement score in real time.`,
  a:{q:`How do we make engagement scores comparable across companies?`,
     stmt:`Engagement is measured with a different instrument by every vendor, so scores cannot be compared between companies, or within one company that changes provider. This project defines a common scale and shows that scores taken under it are comparable.`,
     out:SOL,
     outcome:`A shared benchmark that HR teams and investors can use, and it will be adopted fast because everyone wants the comparison. It treats engagement as one thing from start to finish.`},
  b:{q:`Is engagement one thing, when its parts move in opposite directions?`,
     stmt:`Willingness to recommend the employer, hours worked voluntarily, and intention to stay are all reported as engagement, yet in the same workforce they routinely move in opposite directions. This project tests whether they are separate things, and what happens to an engagement score if they are.`,
     out:K,
     outcome:`If they come apart, the single score averages things that disagree, and a division can raise it by making one part worse. Bonuses tied to it are rewarding a number that describes nothing. The shared benchmark in Side A becomes impossible to build.`},
  tellA:`Your project would make complete sense to someone who thinks the category is fine. You are refining.`,
  tellB:`Your project could end by concluding the thing is not one thing. The category itself is what moves.`},
 {d:"happy",
  story:`National wellbeing is reported as one index, combining life satisfaction, day-to-day mood and a sense of purpose. Governments track the index, compare countries, and set targets against it. Different countries weight the three parts differently.`,
  proposal:`Build a wellbeing dashboard that shows the index by region and month.`,
  a:{q:`How do we make the wellbeing index comparable across countries?`,
     stmt:`Countries combine the components of wellbeing using different weights, so index movements partly reflect weighting choices rather than wellbeing. This project establishes a standard weighting and shows that indices built under it are comparable across countries and over time.`,
     out:SOL,
     outcome:`A standard a statistics office can adopt, and rankings that mean the same thing from one country to the next. The index stays the measure of how well life is going.`},
  b:{q:`Do the three parts of wellbeing move together at all?`,
     stmt:`The index assumes life satisfaction, mood and purpose belong to one underlying quantity. If they routinely move in opposite directions within the same population, combining them produces a figure that describes none of them. This project tests whether the components share a common movement.`,
     out:K,
     outcome:`If they do not, the index is an average of things that disagree, and a country can raise it while one component falls. Every wellbeing ranking becomes unreadable, and the standard weighting in Side A would be standardising a mixture.`},
  tellA:`Someone who thinks wellbeing is one quantity would fully approve of your project. You are refining.`,
  tellB:`Your project could end by showing there is no single quantity there.`}
 ]},

/* ================= EPISTEMOLOGICAL ================= */

"epi-d1":{char:"Thrown away, or never collected",
 what:`You measure the thing through a stand-in, and the stand-in has a blind spot. Either clever analysis gets round it, or something has to be built.`,
 variants:[
 {d:"sport",
  story:`Football clubs cap training by total distance run. GPS vests record how many kilometres each player covers, staff set a weekly ceiling, and anyone near it gets rested. The vests have been standard for over a decade. Hamstring injury rates have not fallen.`,
  proposal:`Build a dashboard that warns the coach when a player nears their weekly distance limit.`,
  a:{q:`Do sprints predict hamstring injury where total kilometres do not?`,
     stmt:`Training load is capped on total distance, which treats a kilometre jogged and a kilometre sprinted as the same thing. The GPS files already hold the full speed trace, but only the summed distance is used. This project re-analyses existing GPS and injury records to test whether high-speed exposure predicts hamstring injury when total distance does not.`,
     out:SOL,
     outcome:`A rest rule based on sprints instead of kilometres, built from data clubs already have and have been throwing away. A club could change next season's training week without buying anything. If the pattern is not there, you have shown the vest was never the problem — and saved the field years of distance dashboards.`},
  b:{q:`What would measure the thing that actually tears?`,
     stmt:`Hamstrings tear during rapid lengthening under load, usually in the late swing phase of a sprint. Neither distance nor speed measures lengthening, so no monitoring system watches the thing it exists to prevent. This project builds a wearable that measures muscle-tendon lengthening rate directly, and validates it against injuries that happen while conventional load numbers stay inside safe limits.`,
     out:SOL,
     outcome:`A sensor clubs can put on players, and a kind of injury that becomes visible for the first time — the ones that happen while the dashboard says the player is fine. The device is what you deliver. Who is at risk can only be worked out after it exists.`},
  tellA:`The information was collected and then thrown away. Every vest recorded the speed trace and the summing step deleted it. Nothing needs building — go and ask the file the question nobody asked it.`,
  tellB:`The information was never collected by anything. No club has ever measured lengthening rate, so re-reading old records will never produce it. Building is the only route.`},
 {d:"phys",
  story:`A planet is called potentially habitable when it sits in its star's habitable zone. That zone is worked out from the planet's orbit and the star's brightness. It is a stand-in for liquid water, which nobody has seen on any of them. Space telescopes have meanwhile collected thousands of transit spectra.`,
  proposal:`Build a catalogue that ranks known planets by how habitable they look.`,
  a:{q:`Do existing transit spectra already carry a water signature nobody looked for?`,
     stmt:`Habitability is inferred from orbital position, while archived transit spectra contain direct information about atmospheric composition that has mostly been searched for other molecules. This project re-analyses existing spectra for water signatures in planets already classified by zone, and tests whether the classification predicts them.`,
     out:K,
     outcome:`You find out whether the zone tells you anything about actual water, using data already collected. If it does not, the habitable-zone label has been sorting planets by something else, and every catalogue built on it needs rewriting.`},
  b:{q:`What would detect water on a small planet around a dim star?`,
     stmt:`Water signatures on small rocky planets fall below the sensitivity of every current spectrograph, so the archive cannot settle the question however it is re-analysed. This project specifies and builds the instrument capability needed, and states what a non-detection at that sensitivity would rule out.`,
     out:SOL,
     outcome:`An instrument capability that makes a whole class of planet observable for the first time. The capability is the deliverable; which planets have water can only follow.`},
  tellA:`The information sits in spectra already collected, filed under other questions. Reanalysis will reach it.`,
  tellB:`The signal is below what any instrument can see. No archive contains it. Build.`}
 ]},

"epi-d2":{char:"Nobody asked, or your funder owns the test",
 what:`When someone is waiting on an answer, they usually also control the measurement — and need it to keep working.`,
 variants:[
 {d:"chem",
  story:`Drinking water is declared safe by testing against a list of regulated contaminants. Labs run the panel, results go to the regulator, and a pass is published. PFAS compounds sat in water supplies for decades while every panel returned a pass, because nothing on the list was looking for them.`,
  proposal:`Build a faster, cheaper version of the standard contaminant panel.`,
  a:{q:`What can a target-list test never find?`,
     stmt:`Water safety is certified by assays that test for named compounds, so anything not on the list returns a pass no matter how much of it is there. This project works out what a target-list approach cannot detect by design, and asks whether any observation could show a pass to be wrong rather than just lucky.`,
     out:K,
     outcome:`A clear account of a blind spot sitting in the middle of every water safety certificate. Nobody asked for it, and it makes the current standard harder to lean on — including for the labs that sell the panel and the regulator that requires it.`},
  b:{q:`What should a regulator require instead of a target list?`,
     stmt:`Regulators certify water against named-compound panels, which assumes the list stays ahead of whatever enters the supply. This project identifies the conditions under which it does not, and specifies a non-targeted screening requirement a regulator could write into the rules.`,
     out:SOL,
     outcome:`A screening standard that can go into regulation, taken up or turned down on the regulator's timetable rather than yours. The catch: they need some standard to exist, so "the current one cannot work" is not an answer they can act on by itself.`},
  tellA:`Nobody commissioned it, and your finding would make the current measure harder to trust. Note who that inconveniences before you start.`,
  tellB:`An office needs a replacement standard they can write down. Their deadline is yours, and a purely negative result is not an option.`},
 {d:"edu",
  story:`School quality is certified by standardised test results. Inspectorates rank schools on them, parents choose by the ranking, and funding follows. The tests are designed and sold by organisations whose business depends on them being accepted as the measure.`,
  proposal:`Build a parent-facing website that compares schools on their test results.`,
  a:{q:`What can a standardised test never detect about a school?`,
     stmt:`School quality is inferred from aggregate test scores, which can only register what a written test can ask. This project works out what the instrument cannot see — and asks whether any observation could show a school's ranking to be wrong rather than merely a reflection of its intake.`,
     out:K,
     outcome:`An account of what a school ranking does not establish, which changes how existing league tables are read. Nobody asked for it, and it is inconvenient for the bodies that publish and sell the tests.`},
  b:{q:`What should an inspectorate require instead of a test score?`,
     stmt:`An inspectorate must publish judgements on a fixed cycle and currently leans on test scores because they arrive on time. This project identifies where scores fail to reflect what inspectors care about, and specifies an alternative evidence requirement that fits the inspection cycle.`,
     out:SOL,
     outcome:`An evidence standard an inspectorate can adopt next cycle. Their timetable sets your scope, and they need something to publish, so "scores cannot do this" is not enough on its own.`},
  tellA:`Nobody commissioned it, and it makes the current measure harder to defend. Notice whose business that touches.`,
  tellB:`An inspectorate has to publish next year and needs something to use. Their cycle is your deadline.`}
 ]},

"epi-d3":{char:"Better instrument, or a century of data re-read",
 what:`One version makes the stand-in more reliable. The other says the stand-in was never reaching the thing.`,
 variants:[
 {d:"mind",
  story:`Ask someone why they took one job over another and they will tell you. Psychology treats that answer as evidence about their reasons. Surveys, interviews, and most of what is claimed about motivation rest on it. People also give confident explanations for choices made before they were aware of choosing.`,
  proposal:`Build a survey instrument that measures motivation more accurately.`,
  a:{q:`When does self-report track the real causes of a choice best?`,
     stmt:`Self-report varies in accuracy with how soon it is asked, how much is at stake, and how the question is worded, but these conditions have never been mapped together. This project establishes when reports best match causes measured independently, and turns that into design rules for asking.`,
     out:K,
     outcome:`Rules that researchers and survey designers can follow, and self-report carries on as a method with known limits. Useful, and several groups are probably working on it already.`},
  b:{q:`If some causes never reach report, what has self-report been measuring?`,
     stmt:`Self-report is treated as a noisy measure of a person's reasons. If some causes of a choice cannot reach report at all, then it is not noisy — it is an accurate measure of something else, namely the account the person puts together afterwards. This project tests whether the two can be told apart.`,
     out:K,
     outcome:`If they cannot, a century of interview and survey data becomes evidence about how people explain themselves rather than about why they act. The method survives; what it studies changes. Anything resting on stated preference has to be read again.`},
  tellA:`Your result would make old findings more accurate. The instrument improves and its subject stays put.`,
  tellB:`Your result would make old findings evidence about something else. The instrument stays and its subject moves.`},
 {d:"mgmt",
  story:`Companies run exit interviews and code the reason each leaver gives. The distribution of reasons drives retention strategy: if pay comes top, pay gets reviewed. The interview is usually conducted by the HR function of the employer the person is leaving, sometimes before a reference is written.`,
  proposal:`Build an exit interview platform that collects reasons more consistently.`,
  a:{q:`When are the reasons given in exit interviews most accurate?`,
     stmt:`Stated reasons for leaving vary with who conducts the interview, how anonymous it is, and when it happens relative to a reference request, but these conditions have not been mapped. This project establishes when stated reasons best match reasons established independently after the person has left.`,
     out:K,
     outcome:`Guidance on how and when to run the interview, and exit interviews continue as a method with known limits. Adoptable straight away.`},
  b:{q:`Does an exit interview record why people leave, or what is safe to say?`,
     stmt:`Exit interviews assume a leaver can and will name their actual reason. If the real reason often cannot be said safely to the employer, then the interview accurately measures what is sayable rather than what happened. This project tests whether stated reasons and independently established reasons come apart systematically.`,
     out:K,
     outcome:`If they do, decades of retention strategy has been responding to the distribution of safe answers. Companies fixing pay may have been fixing the thing people were willing to mention. What the method studies changes entirely.`},
  tellA:`Your result makes the interview more accurate about the same thing.`,
  tellB:`Your result says the interview has been accurate about a different thing all along.`}
 ]},

"epi-d4":{char:"Name the blind spot, or build the eye",
 what:`A blind spot names something an instrument could see. Whether you can build it depends on whether you can say what the missing observation looks like.`,
 variants:[
 {d:"ecol",
  story:`A species is declared recovering when counts rise at monitoring sites. Surveyors visit fixed locations on a schedule, count what they see, and the trend sets conservation status. Those sites were picked decades ago, where the species was then common and where access happened to be easy.`,
  proposal:`Build an app that lets volunteers submit species sightings.`,
  a:{q:`What do fixed monitoring sites fail to see by design?`,
     stmt:`Population trends come from counts at sites chosen when the species was abundant there, so a population moving its range would look like a decline while the total stayed the same — or the reverse. This project identifies what the site network cannot observe, and states what a recovery trend can and cannot establish.`,
     out:K,
     outcome:`A clear statement of what conservation status does not certify, which changes how existing trends get read. Several statuses may need looking at again on evidence already in hand. Nothing new to run.`},
  b:{q:`What would detect a species where nobody thought to look?`,
     stmt:`Fixed-site counting cannot detect a population that has moved somewhere unsurveyed, and no current method samples unvisited habitat at scale. This project builds environmental DNA sampling into a protocol that covers habitat rather than sites, and validates it against populations already known.`,
     out:SOL,
     outcome:`A survey method agencies can run across whole regions, and populations that become visible for the first time. The protocol is what you deliver; revised statuses follow and cannot come first.`},
  tellA:`You can say what is missing but not yet what would show it. Stay with the account.`,
  tellB:`You can describe the missing observation concretely enough to build for it. Name the thing and the test it must pass.`},
 {d:"cs",
  story:`Product teams work out why users leave from event logs. Logs record what people clicked. Someone who gives up while a page is still loading, or who never finds the button, leaves almost nothing behind — and looks the same as someone who simply had no need.`,
  proposal:`Build a churn prediction model on the event log data.`,
  a:{q:`What can a server log never record about someone giving up?`,
     stmt:`Churn analysis is built on logs of completed actions, so abandonment that produces no action produces no record. This project identifies what the log cannot capture about giving up, and states what churn analysis can and cannot establish about why people leave.`,
     out:K,
     outcome:`A clear account of what the logs do not contain, which changes how existing churn findings get read. Some conclusions about why users left turn out to be about the users who stayed long enough to be recorded.`},
  b:{q:`What would record the moment someone gives up?`,
     stmt:`No current instrumentation captures abandonment that leaves no server-side event, so the population that gives up early cannot be studied at all. This project builds client-side instrumentation that records those moments, and shows it identifies a class of loss invisible in the logs.`,
     out:SOL,
     outcome:`Instrumentation a team can deploy, and a group of lost users who become visible for the first time. The instrumentation is the deliverable; why they left comes after.`},
  tellA:`You can name what is missing but not yet what would capture it. Write the account.`,
  tellB:`You can describe the missing observation precisely enough to instrument for it. Build it.`}
 ]},

"epi-d5":{char:"A better number, or the number was never that",
 what:`One version makes the measure more reliable. The other says the measure has been recording a different thing from the one reported.`,
 variants:[
 {d:"happy",
  story:`National wellbeing surveys ask people to rate their life from 0 to 10. Governments track the average, compare countries, and set policy targets against it. The same person's answer moves with their mood, the weather, and whatever they were asked just before.`,
  proposal:`Build a better wellbeing survey with more questions, so the score comes out more accurate.`,
  a:{q:`Does fixing the time and question order reduce the noise?`,
     stmt:`Life satisfaction ratings shift with mood, weather and question order, but survey protocols differ between countries and between waves, so some of the difference between them is the instrument rather than wellbeing. This project establishes which protocol choices reduce that variation and specifies a standard one.`,
     out:SOL,
     outcome:`A survey protocol a statistics office could adopt next cycle, and year-on-year comparisons you can actually trust. The 0–10 scale stays the measure of a good life.`},
  b:{q:`Does the scale itself move after a major life event?`,
     stmt:`A 0–10 rating assumes the respondent's scale holds still, so that a 6 means the same thing before and after their circumstances change. If people re-anchor after a major life event, the rating measures the gap between life and expectation rather than life. This project tests whether the scale itself moves.`,
     out:K,
     outcome:`If the scale moves, a country that genuinely got happier and one that quietly lowered its expectations look identical in the data. Every wellbeing ranking becomes unreadable and policy targets set against the average stop meaning anything. Side A would be standardising a ruler that changes length.`},
  tellA:`Your project could never conclude that the measure was never measuring the thing. You are refining.`,
  tellB:`Your project could conclude the measure has been recording something else all along.`},
 {d:"med",
  story:`Pain is recorded as a score out of ten. The number drives prescribing, referral, and whether a patient is believed. Clinics word the question differently and anchor the ends differently, so a 7 in one clinic is not a 7 in another.`,
  proposal:`Build an app where patients log their pain score daily.`,
  a:{q:`Does standard wording and anchoring make pain scores comparable between clinics?`,
     stmt:`Pain scores are collected with different wording and different descriptions of what 0 and 10 mean, so scores are not comparable across clinics or studies. This project establishes which wording and anchoring choices reduce that variation, and specifies a standard.`,
     out:SOL,
     outcome:`A standard clinics and trials can adopt, and pain scores that mean the same thing from one place to the next. The score out of ten remains the measure of pain.`},
  b:{q:`Does a patient re-anchor as pain persists?`,
     stmt:`A score out of ten assumes the patient's scale holds still over time, so that a 7 in week one and a 7 after two years describe the same experience. If people re-anchor as pain becomes their normal, the score measures the gap from a shifting baseline. This project tests whether the scale moves as pain persists.`,
     out:K,
     outcome:`If it moves, chronic pain can look stable in the record while genuinely worsening, and a patient who adapts appears to have improved. Trials that measured change in pain score over long follow-up have been measuring adaptation as well as treatment. Side A would be standardising a moving scale.`},
  tellA:`Your project could never conclude the score was never measuring pain. You are refining.`,
  tellB:`Your project could conclude the score has been tracking a shifting baseline rather than pain.`}
 ]},

/* ================= METHODOLOGICAL ================= */

"met-d1":{char:"Borrow a level, or build one",
 what:`Either the level you need can be reached by rearranging tools that exist, or nothing works at that level yet.`,
 variants:[
 {d:"edu",
  story:`Learning is measured student by student. Test scores are individual, teachers are rated on their students' gains, and school quality is an average of individual results. Teachers, meanwhile, talk about classes that learn well and classes that do not — as classes.`,
  proposal:`Build a system that gives every student a personalised learning path.`,
  a:{q:`Can existing data be re-read with the class, not the student, as the unit?`,
     stmt:`Learning is measured student by student, but school datasets already record which class each student sat in. This project models learning as a property of the class using data already collected, and compares how much variation the class level explains against the individual level.`,
     out:K,
     outcome:`You find out whether the class explains variation currently blamed on teachers or on students, using nobody's new data. If it does not, individual measurement is vindicated cheaply and the argument can stop there.`},
  b:{q:`What would measure what a class knows, rather than what its students know?`,
     stmt:`No instrument measures what a class knows collectively, as distinct from the sum of its students' scores, so the class level cannot be tested directly at all. This project builds such a measure and shows how teacher ratings change when it is used.`,
     out:SOL,
     outcome:`An instrument schools can run, and revised teacher ratings. Building it is the project. Which classes actually learn well comes afterwards and cannot come before.`},
  tellA:`Somebody's existing records already contain the level you want. Reorganise them.`,
  tellB:`No instrument anywhere works at that level. Build it, and say the instrument is the output.`},
 {d:"sport",
  story:`Football analytics rates individual players — passes completed, distance covered, expected goals. Transfer fees are priced off individual ratings. Coaches, meanwhile, talk about pairs of players who work well together and cannot say why.`,
  proposal:`Build a scouting tool that ranks players on their individual metrics.`,
  a:{q:`Can existing match data be re-read with the partnership as the unit?`,
     stmt:`Player value is estimated from individual event counts, but match event data already records who passed to whom and who was where. This project models performance as a property of pairs using data already collected, and compares how much outcome variation the pair level explains against the individual level.`,
     out:K,
     outcome:`Evidence on whether partnerships explain results that individual ratings miss, from data every club already buys. If they do, transfer pricing has been valuing the wrong unit. No new collection needed.`},
  b:{q:`What would measure how a pair coordinates?`,
     stmt:`Nothing currently measures the coordination itself — the shared anticipation and off-ball adjustment that happens before any event is recorded — so the pair level cannot be observed directly. This project builds a measure of coordination from positional and gaze data, and shows it distinguishes pairs with identical event statistics.`,
     out:SOL,
     outcome:`A measure clubs can use in training, and a difference between pairs that no existing statistic shows. The measure is the deliverable; which pairs work comes after it exists.`},
  tellA:`The event data already records the interactions. Reorganise it around pairs.`,
  tellB:`Coordination leaves no trace in any recorded event. Build the measure.`}
 ]},

"met-d2":{char:"Does the level fit, or is a decision blocked",
 what:`One version asks whether the level fits the thing. The other asks it for someone whose decision is stuck.`,
 variants:[
 {d:"econ",
  story:`Inflation is measured by pricing a fixed basket of goods and reporting one national figure. Central banks set interest rates against it. The basket stands for an average household, and a household spending most of its income on rent and food experiences something quite different.`,
  proposal:`Build a calculator that shows a household its own personal inflation rate.`,
  a:{q:`Does inflation exist at the household level, or only in the aggregate?`,
     stmt:`Inflation is defined and measured nationally, and household figures are produced by reweighting the same basket. This project asks whether inflation is a property any individual household has at all, or a genuinely aggregate quantity that reweighting cannot recover.`,
     out:K,
     outcome:`An answer about where the quantity actually lives. If it is aggregate only, personal inflation calculators produce a number with nothing behind it however carefully they reweight. Nobody is waiting for this.`},
  b:{q:`What would a central bank have to measure to see distributional effects?`,
     stmt:`A central bank must set one rate for an economy whose households face very different price changes, and the aggregate figure hides that spread completely. This project specifies what would have to be measured at household level to inform that decision, and what the aggregate cannot show.`,
     out:SOL,
     outcome:`A measurement specification a statistics office could implement, with a stated list of what it still would not reveal. Scope and timetable are set by the rate-setting cycle, not by you.`},
  tellA:`Nobody's decision is waiting. You want to know whether the level is real at all.`,
  tellB:`An institution has to decide and the aggregate is failing them. Their cycle sets your scope.`},
 {d:"med",
  story:`Vaccination programmes work to a national coverage target. Protection is a population property — enough people covered and transmission stalls. A national figure of ninety per cent can sit on top of a district at forty, and outbreaks start in the district.`,
  proposal:`Build a dashboard showing national vaccination coverage in real time.`,
  a:{q:`Is protection a property one person has, or only a population?`,
     stmt:`Herd protection is defined at population level, but coverage is reported nationally and individual protection is inferred by dividing it down. This project asks at what level protection is actually a property, and whether a national figure can be disaggregated to say anything about a person or a district.`,
     out:K,
     outcome:`Clarity on what a coverage figure does and does not describe. If protection exists only at population level, individual risk estimates derived from national coverage have nothing behind them. Nobody commissioned this.`},
  b:{q:`What must a programme measure locally to decide where doses go?`,
     stmt:`A programme must decide where to send a limited supply next month, and the national figure gives no basis for choosing between districts. This project specifies what has to be measured at district level to make that allocation, and what the national figure cannot support.`,
     out:SOL,
     outcome:`An allocation procedure a programme can use next cycle, with its blind spots stated. Their supply schedule sets your deadline, and they need a rule, so a conceptual answer will not do.`},
  tellA:`No allocation is waiting on you. You want to know which level the property belongs to.`,
  tellB:`Doses ship next month and somebody has to choose districts. That schedule is yours now.`}
 ]},

"met-d3":{char:"Another data point, or the method explains its own results",
 what:`One version applies a settled method to a new case. The other says the method is producing its own findings.`,
 variants:[
 {d:"nutr",
  story:`Diet research works through food-frequency questionnaires. People recall how often they ate listed foods, answers get converted into nutrient totals, and outcomes are related to nutrients — grams of fat, milligrams of sodium. Guidelines are then written in nutrients.`,
  proposal:`Build an app that logs meals and reports nutrient intake automatically.`,
  a:{q:`What nutrient associations appear in a population not yet studied?`,
     stmt:`Food-frequency questionnaires have produced nutrient-outcome associations in many populations but few in others. This project administers the instrument in an unstudied population and reports the associations it yields.`,
     out:K,
     outcome:`One more set of associations, moderately cited, and possibly a regional guideline. The method itself is untouched, which is exactly why it gets funded.`},
  b:{q:`Can this method find anything that is not a nutrient?`,
     stmt:`The questionnaire turns recalled foods into nutrient totals, so its findings can only ever be about nutrients. If the health effect of a diet depends on combinations, processing or timing, the instrument cannot register it and a nutrient will take the credit. This project tests whether nutrient associations survive when whole-diet patterns are modelled instead.`,
     out:K,
     outcome:`If they do not survive, decades of nutrient-level findings describe the shape of a questionnaire rather than the biology, and guidelines written in grams and milligrams lose their basis. Advice aimed at single nutrients loses its target.`},
  tellA:`If you are right, the field gains one more result and the method carries on.`,
  tellB:`If you are right, the method explains why the existing results look the way they do.`},
 {d:"edu",
  story:`Reading ability is measured by a timed test: words read correctly per minute. Interventions target fluency, policy tracks the score, and a child below the benchmark gets extra practice at reading faster.`,
  proposal:`Build a reading app that tracks words per minute and sets daily practice.`,
  a:{q:`What does the fluency test show in a cohort nobody has tested?`,
     stmt:`Timed reading measures have been applied widely in some languages and populations and hardly at all in others. This project administers the measure in an untested cohort and reports the distribution and its relationship to later attainment.`,
     out:K,
     outcome:`A benchmark for that cohort, moderately cited, possibly feeding a local policy. The measure itself comes out unchanged.`},
  b:{q:`Can a timed word test register anything except decoding speed?`,
     stmt:`A timed reading measure can only record how fast words are decoded, because that is what the format allows. If comprehension is not decoding speed, the fluency literature describes the instrument's grain rather than reading. This project tests whether fluency scores predict comprehension once decoding speed is held constant.`,
     out:K,
     outcome:`If they do not, the fluency benchmark has been sorting children by speed and calling it reading, and interventions that raise the score need not have taught anyone to read. A large policy literature turns out to be about a stopwatch.`},
  tellA:`If you are right, one more cohort has a benchmark and the test continues.`,
  tellB:`If you are right, the test explains why the fluency literature says what it says.`}
 ]},

"met-d4":{char:"The mismatch, or the instrument",
 what:`One version asks whether the level fits. The other builds the method for the level that does.`,
 variants:[
 {d:"math",
  story:`Mathematical understanding is studied through finished proofs. Papers present the argument in final form, textbooks teach the polished version, and students are assessed on producing valid steps. How a proof was found — the dead ends, the guesses, the reformulations — is not recorded anywhere.`,
  proposal:`Build a tool that checks student proofs automatically and marks the errors.`,
  a:{q:`What can a finished proof never show about how it was found?`,
     stmt:`Mathematical practice is studied almost entirely through its finished products, though the thing being taught is the search for a proof rather than its presentation. This project works out what the finished form cannot show by its nature, and what that means for how understanding is assessed.`,
     out:K,
     outcome:`An argument that the evidence and the skill being taught do not match, set out precisely enough for others to build on. No tool is offered and none is promised, which is the honest position when none exists.`},
  b:{q:`What would record the search rather than the result?`,
     stmt:`No method captures the process of finding a proof at a usable scale, so the search cannot be studied or assessed directly. This project builds an environment that records the search — attempts, abandonments, reformulations — and shows it distinguishes students whose finished proofs look identical.`,
     out:SOL,
     outcome:`A recording environment departments can use, and evidence that identical final answers come from very different searches. The environment is what you deliver. How mathematicians think comes only after it exists.`},
  tellA:`You can state the mismatch, no method exists, and you are not building one. Say that rather than promising a finding you cannot produce.`,
  tellB:`You can name the instrument and the test it must pass. The instrument is the output.`},
 {d:"cs",
  story:`Software engineering is studied through merged pull requests. Researchers mine repositories, relate code properties to defects, and draw conclusions about what makes code good. How the code was actually produced — the reverts, the debugging, the abandoned approach — is not in the repository.`,
  proposal:`Build a static analysis tool that flags code likely to contain defects.`,
  a:{q:`What can a merged commit never show about how the code was written?`,
     stmt:`Conclusions about code quality are drawn from repository history, which records only what was kept. This project works out what a merged commit cannot show about the process that produced it, and what that means for claims relating code properties to defects.`,
     out:K,
     outcome:`An account of what repository mining cannot establish, set out clearly enough to act on. Some findings about what makes good code turn out to be findings about what survives review.`},
  b:{q:`What would record the debugging session that produced the commit?`,
     stmt:`No method captures the editing and debugging process at a usable scale, so the work that produces code cannot be studied directly. This project builds an environment that records it, and shows that identical final diffs come from very different processes.`,
     out:SOL,
     outcome:`A recording environment teams and researchers can use, and evidence that the same code arrived by very different routes. The environment is the deliverable; what it says about good practice comes later.`},
  tellA:`You can name the mismatch and you are not building the recorder. Write the account and do not promise more.`,
  tellB:`You can specify the recorder and what it has to demonstrate. Build it.`}
 ]},

"met-d5":{char:"Correct the measurement, or change what it measured",
 what:`One version improves precision at the level you already use. The other shows that level is creating the pattern it claims to find.`,
 variants:[
 {d:"mind",
  story:`Dreams are studied through reports given after waking. Sleepers are woken, asked what they were experiencing, and the answers get coded for themes and emotions. REM sleep is treated as the period when the dreaming happened. Reports vary with how long after waking they are collected.`,
  proposal:`Build an app that records dream reports on waking and analyses their themes.`,
  a:{q:`How much does delay after waking distort a dream report?`,
     stmt:`Dream reports vary with time elapsed since waking, but the relationship has never been quantified, so content analyses collected on different schedules are not comparable. This project establishes the delay function and provides a correction for it.`,
     out:SOL,
     outcome:`A correction researchers can apply, making decades of existing content analyses comparable for the first time. What is being studied stays exactly where it was.`},
  b:{q:`Does a report record a dream, or a story made on waking?`,
     stmt:`A dream report is produced after waking, in language, by a mind that is now awake. If it is a narrative put together at that moment rather than a record of an earlier experience, then dream content analysis studies waking narration. This project tests whether the two can be told apart.`,
     out:K,
     outcome:`If they cannot, decades of dream content findings become findings about how waking minds build stories, and treating REM sleep as the period of dreaming loses its support. Side A would be correcting the wrong thing.`},
  tellA:`Your result makes old measurements more precise at the level you already use.`,
  tellB:`Your result makes old measurements explainable as products of the method itself.`},
 {d:"happy",
  story:`Wellbeing is measured by asking people once, in a survey, how satisfied they are with their life. Answers are known to move with the mood of the day, the weather, and events in the news that week. Averages are compared across months and countries.`,
  proposal:`Build a wellbeing survey that runs monthly instead of annually.`,
  a:{q:`Can day-of-survey conditions be corrected for?`,
     stmt:`Survey answers move with weather, local events and day of the week, and surveys are fielded on different days in different places, so some of the difference between them is timing. This project models those effects and provides a correction that makes fielded waves comparable.`,
     out:SOL,
     outcome:`A correction a statistics office can apply to existing and future waves, making comparisons across months and countries defensible. Life satisfaction stays the thing being measured.`},
  b:{q:`Is the rating read off a standing state, or built at the moment of asking?`,
     stmt:`Correcting for day effects assumes there is a stable underlying satisfaction that the day's mood distorts. If the rating is instead constructed when the question is asked, from whatever is available at that moment, then the survey measures an act of construction and there is no underlying value to recover. This project tests whether a stable value exists to be corrected towards.`,
     out:K,
     outcome:`If there is no standing value, day-effect corrections are adjusting towards a number that does not exist, and the whole practice of tracking a national average changes meaning. Side A becomes a well-executed correction to nothing.`},
  tellA:`Your result makes the existing average more accurate about the same thing.`,
  tellB:`Your result says there was no standing value for the average to be about.`}
 ]}
};

 {d:"math",area:"Proof checking",
  story:`Journals establish that a proof is correct by peer review. Two or three referees read the argument and recommend publication. Errors are found in published proofs years later, and referee reports are archived by the journal and never looked at again.`,
  proposal:`Build a proof-checking tool that verifies submitted papers automatically.`,
  a:{q:`Do archived referee reports show which errors review reliably misses?`,
     stmt:`Journals hold decades of referee reports alongside later corrections and retractions, but the two have never been matched. This project pairs them to test which kinds of error review catches and which pass through consistently.`,
     out:K,
     outcome:`Evidence on what peer review can and cannot certify about a proof, from records journals already hold. If a category of error passes routinely, editors can change what they ask referees to check — with no new system built.`},
  b:{q:`What would check a step nobody can hold in their head?`,
     stmt:`Some proofs contain case analyses too large for any referee to verify by reading, so review certifies them without checking them, and no archive can reveal that. This project builds machine verification for that class of step.`,
     out:SOL,
     outcome:`A verification tool journals can require for large-case proofs, and a class of unchecked step that becomes checkable. The tool is the deliverable; which published proofs fail comes after.`},
  tellA:`The reports were written, filed, and never matched against what went wrong. Reanalysis reaches it.`,
  tellB:`Nobody has ever checked those steps, so no record of checking them exists. Build the checker.`},
 {d:"nutr",area:"Salt intake",

 {d:"econ",area:"Credit scoring",
  story:`Lending decisions rest on a credit score built from repayment history. Someone with no borrowing history scores as unknown and is refused. The bureaus that build the scores sell them to the lenders who use them, and regulators accept them as evidence of fair lending.`,
  proposal:`Build a credit scoring model that uses more data sources.`,
  a:{q:`What can a repayment-history score never see?`,
     stmt:`A credit score is computed from records of borrowing, so anyone who has not borrowed produces no signal and is treated as risky. This project characterises what the score structurally cannot observe, and asks whether any observation could show a refusal to have been wrong.`,
     out:K,
     outcome:`An account of a blind spot at the centre of every lending decision, and of a population invisible to it. Nobody asked for it, and it is inconvenient for the bureaus who sell the scores and the regulators who accept them.`},
  b:{q:`What should a regulator require instead of a score?`,
     stmt:`Regulators accept credit scores as evidence of fair lending, which assumes the score captures creditworthiness rather than borrowing history. This project identifies where the two come apart and specifies an alternative evidentiary requirement a regulator could write into rules.`,
     out:SOL,
     outcome:`A fairness standard that can go into regulation, taken up or rejected on the regulator's timetable. The catch: they need some standard, so showing the current one cannot work is not enough by itself.`},
  tellA:`Nobody commissioned it, and it makes the current measure harder to defend. Note whose business that touches.`,
  tellB:`A regulator has to publish rules and needs something usable. Their timetable is yours.`},
 {d:"med",area:"Drug approval",
  story:`Drugs are approved on surrogate endpoints. A cancer drug can be licensed for shrinking tumours rather than for extending life, because tumour size arrives in months and survival takes years. The manufacturer designs the trial and the regulator accepts the endpoint.`,

     out:SOL,
     outcome:`A confirmatory standard a regulator can write into its process, adopted or refused on their schedule. They need approvals to keep happening, so "surrogates cannot work" is not an answer they can act on.`},

  tellB:`A regulator has approvals queued and needs a workable rule. Their cycle sets your scope.`},
 {d:"sport",area:"Doping tests",

 {d:"econ",area:"GDP",
  story:`GDP is reported as one figure: the value of everything produced. Governments target its growth, ratings agencies read it, and it excludes unpaid household work while counting cleanup after a disaster as output.`,
  proposal:`Build a live GDP nowcasting tool from payment data.`,
  a:{q:`How do we make GDP comparable across countries?`,
     stmt:`Countries treat imputed rents, informal activity and public services differently, so international comparisons partly reflect accounting convention. This project establishes a harmonised treatment and shows figures under it are comparable.`,
     out:SOL,
     outcome:`A harmonised measure statistical offices can adopt, and comparisons that mean the same thing across borders. GDP stays one figure throughout.`},
  b:{q:`Is GDP one quantity, when its parts pull in opposite directions?`,
     stmt:`Production, income and expenditure are treated as three routes to one number. If they diverge systematically rather than by measurement error, GDP is a reconciliation of things that disagree. This project tests whether the three converge on one quantity.`,
     out:K,
     outcome:`If they do not, the headline figure is a negotiated settlement between three accounts, and growth targets are set against a reconciliation. Harmonising it in Side A would harmonise the negotiation.`},
  tellA:`Someone who thinks GDP is one quantity would fully approve. You are refining.`,
  tellB:`Your project could conclude there is no single quantity there.`},
 {d:"med",area:"Frailty",
  story:`Frailty is scored on an index and used to decide who is offered surgery, who gets intensive care, and who is referred for comprehensive assessment. The index sums deficits: slow walking, weight loss, grip strength, exhaustion, low activity.`,
  proposal:`Build a frailty screening tool for use in emergency departments.`,
  a:{q:`How do we make frailty scores comparable between settings?`,
     stmt:`Frailty is scored with different indices in different settings, so a score reflects the instrument as much as the patient. This project establishes a common index and shows scores under it are comparable across settings.`,
     out:SOL,
     outcome:`A common index hospitals can adopt, and decisions that do not depend on which index a department uses. Frailty remains one quantity.`},
  b:{q:`Is frailty one state, when its deficits arise separately?`,
     stmt:`The index sums deficits as though they indicate one underlying state. If they arise from unrelated causes and respond to different treatment, summing them produces a score that describes no one. This project tests whether the deficits share a common cause.`,
     out:K,
     outcome:`If they do not, a frailty score is an arithmetic total rather than a condition, and a patient can be denied surgery on the strength of five unrelated problems. The common index in Side A would standardise an addition.`},
  tellA:`Someone who thinks frailty is a real state would approve of your project. You are refining.`,
  tellB:`Your project could conclude frailty is a sum rather than a state.`},
 {d:"edu",area:"Attendance",

  tellA:`Someone who thinks attendance is one quantity would approve. You are refining.`,
  tellB:`Your project could conclude attendance is not one quantity at all.`}

 {d:"chem",area:"Purity",
  story:`A compound is declared pure at ninety-nine per cent by chromatography. Purity claims govern what can be sold, published and used in trials. Chromatography reports what the detector responds to, and anything it does not respond to contributes nothing to the total.`,

  a:{q:`Under what conditions does a purity figure best match true composition?`,
     stmt:`Purity by chromatography varies with detector type, solvent and method, but the conditions under which it best matches independently determined composition have not been mapped. This project establishes those conditions and produces reporting rules.`,
     out:K,
     outcome:`Reporting standards journals and regulators can adopt, and realistic error bars on published purity. Purity continues as a measure of composition, with documented limits.`},
  b:{q:`Is a purity figure a measure of the compound, or of the detector?`,
     stmt:`Purity is treated as a property of the sample. If a substantial fraction of possible impurities is invisible to the detector used, then the figure accurately measures what that detector can see. This project tests whether purity figures track composition or detector response.`,
     out:K,
     outcome:`If detector response dominates, published purities are statements about instruments, and a compound declared pure may carry impurities nobody has ever looked for. Every purity claim needs re-reading.`},
  tellA:`Your result makes purity figures more accurate about the same thing.`,
  tellB:`Your result says the figure has been describing the detector.`},
