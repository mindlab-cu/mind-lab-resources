.mono{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{font-weight:500;letter-spacing:-.02em;margin:0}


/* ---------------- brand bar ---------------- */
.brandbar{background:#FFFFFF;border-bottom:1.5px solid #B8985C}
.brandbar-in{max-width:1480px;margin:0 auto;padding:11px 26px;display:flex;align-items:center;gap:18px}
.brand-seal{height:58px;width:58px;flex:none;display:block}
.brand-word{
  flex:1;display:flex;align-items:center;justify-content:center;gap:15px;
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;
  font-size:clamp(15px,2.6vw,27px);letter-spacing:.26em;color:#1B2A6B;
  text-transform:uppercase;white-space:nowrap;
}
.brand-word span.t{margin-right:-.26em}
.brand-word i{width:clamp(12px,2vw,26px);height:1.5px;background:#1B2A6B;flex:none;display:block}
.brand-rekhi{height:46px;flex:none;display:block}
@media (max-width:640px){
  .brand-seal{height:40px;width:40px}
  .brand-rekhi{height:32px}
  .brand-word{gap:9px;letter-spacing:.18em}
  .brandbar-in{padding:9px 16px;gap:12px}
}
@media (max-width:400px){ .brand-word i{display:none} }

/* ---------------- horizon meter ---------------- */
.horizon{position:relative;height:112px;margin:14px -22px 0;border-bottom:1px solid var(--line);overflow:hidden}
.horizon-fill{position:absolute;left:0;right:0;bottom:0;transition:height .9s cubic-bezier(.22,.9,.25,1);opacity:.5}
.horizon-line{position:absolute;left:0;right:0;height:1px;transition:bottom .9s cubic-bezier(.22,.9,.25,1),background-color .9s ease}
.horizon-meta{position:absolute;left:22px;right:22px;top:12px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.h-big{font-size:15px;font-weight:500}
.h-sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.horizon.idle .horizon-fill{opacity:0}
.horizon.idle .horizon-line{opacity:.1}

/* ---------------- generic ---------------- */
.eyebrow{display:flex;align-items:center;gap:14px;margin:30px 0 20px}
.eyebrow .rule{flex:1;height:1px;background:var(--line)}
.moves{display:flex;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--line-2)}
.dot.used{background:var(--ink-3);border-color:transparent}
p.lead{font-size:16px;line-height:1.65;color:var(--ink-2);max-width:34em;margin:0 0 18px}
p.lead b{font-weight:500;color:var(--ink)}
button.act{
  font-family:var(--display);font-size:14.5px;font-weight:500;letter-spacing:-.01em;
  background:var(--paper);color:var(--ink);border:1px solid var(--line-2);
  border-radius:7px;padding:11px 20px;cursor:pointer;
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
button.act:hover,button.act:focus-visible{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 14px rgba(22,32,42,.07)}
button.act.quiet{background:transparent;border-color:transparent;color:var(--ink-3);padding-left:0}
button.act.quiet:hover{color:var(--ink);box-shadow:none;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.panel{border-top:1px solid var(--line);margin-top:34px;padding-top:26px}

/* ---------------- annotated example (intro) ---------------- */
.anno{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start;margin:26px 0 30px}
.anno-notes{flex:1;min-width:230px;display:flex;flex-direction:column;gap:16px}
.anno-note{display:flex;gap:12px;align-items:flex-start}
.anno-note .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:3px;flex:none;width:16px}
.anno-note .t{font-size:14px;line-height:1.55;color:var(--ink-2)}
.anno-note .t b{font-weight:500;color:var(--ink)}

/* ---------------- deck reference ---------------- */
.deck-sec{margin-bottom:34px}
.deck-sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.deck-sec-head h3{font-size:18px}
.deck-sec-note{font-size:14px;line-height:1.6;color:var(--ink-2);max-width:38em;margin:0 0 20px}
.deck-item{display:flex;gap:24px;align-items:flex-start;padding:20px 0;border-top:1px solid var(--line)}
.deck-item-side{flex:1;min-width:220px;padding-top:2px}
.deck-item-side .asks{font-size:15.5px;line-height:1.5;margin:0 0 10px}
.reach{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.reach b{font-weight:400;color:var(--stirred)}
.deck-item .card{animation:none;cursor:default}
.deck-item .card:hover{transform:rotate(0deg)!important;box-shadow:none}

/* ---------------- situation menu ---------------- */
.sit-list{margin-top:6px}
.sit{
  width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:11px;padding:20px 22px;margin-bottom:10px;cursor:pointer;
  font-family:inherit;color:var(--ink);display:flex;gap:18px;align-items:flex-start;
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
.sit:hover,.sit:focus-visible{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,32,42,.07)}
.sit-text{flex:1;font-size:16.5px;line-height:1.45;letter-spacing:-.01em}
.sit-side{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:4px}
.tag.settled{background:var(--action-bg);color:var(--action)}
.tag.part{background:#FBF1E6;color:var(--stirred)}
.tag.stuck{background:var(--ground-2);color:var(--ink-3)}
.mini-row{display:flex;gap:4px}
.mini{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--ground-2)}
.mini svg{width:15px;height:15px}
.mini.thought{color:var(--thought)}
.mini.action{color:var(--action)}

/* ---------------- the moment ---------------- */
.moment-text{
  font-size:clamp(23px,3.9vw,34px);line-height:1.26;letter-spacing:-.025em;
  max-width:21em;margin:8px 0 0;transition:opacity .5s,font-size .4s;
}
.moment-text.dim{opacity:.62;font-size:clamp(17px,2.4vw,21px);max-width:30em}
.empty{
  margin:38px 0 0;padding:30px 0 34px;border-top:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2);
  display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;
}
.empty-copy{font-size:14.5px;line-height:1.6;color:var(--ink-3);max-width:24em}
.summon{
  font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:-.01em;
  background:var(--ink);color:var(--ground);border:0;border-radius:8px;
  padding:14px 24px;cursor:pointer;transition:transform .18s,opacity .18s;
}
.summon:hover,.summon:focus-visible{transform:translateY(-2px)}
.timer{height:1px;background:var(--line-2);margin:24px 0 0;position:relative;overflow:hidden}
.timer i{position:absolute;inset:0;background:var(--ink-3);transform-origin:left center;display:block}
.tcount{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--stirred);margin-top:8px;min-height:14px;opacity:0;transition:opacity .6s}

/* ---------------- cards ---------------- */
.fan-head{display:flex;align-items:baseline;gap:12px;margin:32px 0 14px;flex-wrap:wrap}
.fan-head h3{font-size:17px}
.fan{display:flex;flex-wrap:wrap;gap:13px;align-items:flex-start}
.card{
  position:relative;width:154px;flex:none;border:1px solid var(--line);padding:0;
  background:var(--paper);color:var(--ink);border-radius:10px;cursor:pointer;
  text-align:left;font-family:inherit;
  transition:transform .26s cubic-bezier(.22,.9,.25,1),box-shadow .2s,opacity .4s;
  animation:surface .55s cubic-bezier(.2,.85,.25,1) both;
}
@keyframes surface{from{opacity:0;transform:translateY(22px) rotate(0deg) scale(.96)}}
.card-inner{padding:22px 15px 15px;display:block}
.suit{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.glyph{height:46px;margin:9px 0 11px;display:flex;align-items:center}
.glyph svg{width:42px;height:42px}
.words{font-size:15.5px;line-height:1.25;font-weight:500;letter-spacing:-.015em}
.notch{position:absolute;top:-1px;left:50%;background:var(--ground);transform:translateX(-50%)}
.card.thought .suit{color:var(--thought)}
.card.action .suit{color:var(--action)}
.card.thought{background:linear-gradient(var(--paper),var(--paper))}
.card:hover:not(:disabled),.card:focus-visible:not(:disabled){
  transform:translateY(-7px) rotate(0deg)!important;box-shadow:0 12px 28px rgba(22,32,42,.13)}
.card:disabled{
  cursor:not-allowed;background:transparent;border-style:dashed;border-color:var(--line-2);
  color:var(--ink-3);opacity:.72;
}
.card:disabled .notch{background:transparent}
.card:disabled .suit{color:var(--ink-3)}
.card:disabled .glyph{opacity:.4}
.locked-why{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:7px;line-height:1.4}
.key{font-size:12.5px;line-height:1.6;color:var(--ink-3);margin-top:18px;max-width:40em}

/* ---------------- chosen / flip ---------------- */
.chosen-area{display:flex;flex-wrap:wrap;gap:30px;margin-top:30px;align-items:flex-start}
.chosen-card{width:206px;flex:none;perspective:1300px}
.flipper{position:relative;transition:transform .62s cubic-bezier(.3,.8,.25,1);transform-style:preserve-3d}
.flipper.turned{transform:rotateY(180deg)}
.face{border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--paper);border:1px solid var(--line);padding:26px 18px 20px;position:relative;min-height:196px}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);padding:22px 19px;display:flex;flex-direction:column;justify-content:space-between;border-radius:11px}
.back-text{font-size:15.5px;line-height:1.45}
.chosen-side{flex:1;min-width:230px}
.delta{font-family:var(--mono);font-size:30px;letter-spacing:-.03em;margin:0 0 6px}
.delta.up{color:var(--settled)} .delta.down{color:var(--stirred)} .delta.flat{color:var(--ink-3)}

/* ---------------- resolution ---------------- */
.res-title{font-size:clamp(24px,4vw,34px);line-height:1.18;letter-spacing:-.025em;margin:0 0 14px;max-width:22em}
.glyph-row{display:flex;gap:8px;align-items:center;margin:0 0 20px;flex-wrap:wrap}
.chip{width:40px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line)}
.chip svg{width:25px;height:25px}
.chip.thought{color:var(--thought)} .chip.action{color:var(--action)}
.arrowlet{color:var(--ink-3);font-family:var(--mono);font-size:12px}
.bar{height:5px;border-radius:3px;background:var(--ground-2);position:relative;max-width:420px;margin:4px 0 8px}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .was{background:var(--line-2)}
.bar .now{background:var(--settled)}
.bar .now.down{background:var(--stirred)}
.claim{display:flex;flex-wrap:wrap;gap:11px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}
.claim .who{flex:1;min-width:210px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.claim .who b{font-weight:500;color:var(--ink)}
.claimed{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--settled)}
.claimed.no{color:var(--ink-3)}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:560px){
  .card{width:calc(50% - 7px)}
  .sit{flex-direction:column;gap:12px}
  .sit-side{align-items:flex-start;text-align:left}
}
</style>
</head>

  { text:"You've been looking forward to one thing all week. It's tomorrow, and you can feel yourself expecting it to fix everything.",
    start:55,
    fx:{nofix:22,zoomout:16,small:14,walk:8,friend:6,onemsg:6,outloud:5,away:4,twomin:2,fuel:0} },
  { text:"Something small went right today and nobody noticed. You've already moved on to the next thing.",
    start:57,
    fx:{small:19,onemsg:12,outloud:10,friend:6,walk:6,zoomout:4,nofix:3,away:1,twomin:0,fuel:0} }
];

const MOVES = 3, GOAL = 67, WINDOW_MS = 120000, WARN_MS = 20000;

/* ===================== state ===================== */
let S, results;
function boot(){
  results = {};                 /* index -> {end,start,cards,claims} */
  S = { phase:'intro', i:null, meter:50, moves:0, used:new Set(),
        chosen:null, turned:false, lastDelta:0, cards:[], startMeter:50,
        fanOpen:false, missed:false, revealed:false };
}
boot();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const band = m => m>=GOAL ? 'settled' : m>=34 ? 'unsettled' : 'stirred up';
function lerpColor(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const[r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}
function effect(card, sit, meter){
  const base = sit.fx[card.id] ?? 0;
  if(card.suit==='thought' && base>0) return Math.round(base*clamp((meter-18)/46,.35,1));
  return base;
}
const locked=(c,m)=>m<c.min;

function paintHorizon(){
  const inMoment = S.phase==='moment' || S.phase==='chosen' || S.phase==='resolved';
  document.getElementById('horizon').classList.toggle('idle', !inMoment);
  const m = clamp(S.meter,0,100), col = lerpColor('#B85F2C','#1E8E7E', m/100), h = 6+m*0.55;
  const f=document.getElementById('hFill'), l=document.getElementById('hLine');
  f.style.height=h+'px'; f.style.background=`linear-gradient(to top, ${col}, transparent)`;
  l.style.bottom=h+'px'; l.style.backgroundColor=col;
  document.getElementById('hLabel').textContent = inMoment ? band(m) : 'not in a moment';
  document.getElementById('hNum').textContent = inMoment ? Math.round(m) : '—';
  document.getElementById('hCtx').textContent = inMoment ? `${S.moves} of ${MOVES} moves used`
    : `${Object.keys(results).length} of ${SITUATIONS.length} practised`;
}

/* ===================== card markup ===================== */
function notchStyle(c){
  const w=18+c.effort*5, h=5+c.effort*3;
  return c.suit==='thought'
    ? `width:${w}px;height:${h}px;border-radius:0 0 ${w}px ${w}px;`
    : `width:${w}px;height:${h}px;clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);`;
}
function cardHTML(c,{tilt=0,delay=0,dis=false}={}){
  return `<button class="card ${c.suit}" data-id="${c.id}" ${dis?'disabled':''}
    style="transform:rotate(${tilt}deg);animation-delay:${delay}ms"
    aria-label="${c.suit}: ${c.words}${dis?' — out of reach, you are too stirred up':''}">
    <span class="notch" style="${notchStyle(c)}"></span>
    <span class="card-inner">
      <span class="suit">${c.suit}</span>
      <span class="glyph">${G[c.id]}</span>
      <span class="words">${c.words}</span>
      ${dis?'<span class="locked-why">out of reach — too stirred up</span>':''}
    </span></button>`;
}
const chip=c=>`<span class="chip ${c.suit}" title="${c.words}">${G[c.id]}</span>`;
const mini=c=>`<span class="mini ${c.suit}" title="${c.words}">${G[c.id]}</span>`;

/* ===================== render ===================== */
const stage=document.getElementById('stage');
const say=t=>document.getElementById('live').textContent=t;
function render(){
  paintHorizon();
  stage.innerHTML = ({intro:vIntro, deck:vDeck, menu:vMenu, moment:vMoment,
                      chosen:vChosen, resolved:vResolved})[S.phase]();
  wire();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------- the whole deck, meanings shown ---------- */
function reachNote(c){
  if(c.min===0) return 'reachable from anywhere';
  if(c.min<=12) return 'reachable from almost anywhere';
  if(c.min<=32) return `<b>needs some ground first</b> — out of reach below ${c.min}`;
  if(c.min<=42) return `<b>needs room made for it</b> — out of reach below ${c.min}`;
  return `<b>needs you fairly settled</b> — out of reach below ${c.min}`;
}
function deckItem(c){
  return `<div class="deck-item">
    <div style="flex:none">${cardHTML(c,{tilt:0})}</div>
    <div class="deck-item-side">
      <p class="asks">${c.back}</p>
      <div class="reach">${reachNote(c)}</div>
    </div>
  </div>`;
}
function vDeck(){
  const acts=CARDS.filter(c=>c.suit==='action');
  const thos=CARDS.filter(c=>c.suit==='thought').sort((a,b)=>a.min-b.min);
  return `
  <div class="eyebrow"><span class="mono">the whole deck · ten cards</span><span class="rule"></span></div>
  <h2 style="font-size:clamp(23px,3.8vw,31px);line-height:1.2;max-width:21em;margin-bottom:10px">
    Read all ten before you start. None of this is meant to be a secret.</h2>
  <p class="lead">You'll almost certainly agree with every card here. That's the point — you already know
    all of it. What the game measures is whether any of it shows up while something is happening to you.</p>

  <div class="deck-sec">
    <div class="deck-sec-head"><h3>Actions</h3><span class="mono">five cards · change the moment</span></div>
    <p class="deck-sec-note">Cheap and available when you're at your worst. They don't fix anything on their
      own — they buy you enough ground to reach a thought.</p>
    ${acts.map(deckItem).join('')}
  </div>

  <div class="deck-sec">
    <div class="deck-sec-head"><h3>Thoughts</h3><span class="mono">five cards · change how you're reading it</span></div>
    <p class="deck-sec-note">These are the ones that actually shift things, and they're the ones you can't
      reach while you're stirred up. Played too early they barely register, which is the whole reason
      order matters.</p>
    ${thos.map(deckItem).join('')}
  </div>

  <div class="panel"><div class="row">
    <button class="act" data-a="menu">I've read them — see the situations</button>
  </div></div>`;
}

/* ---------- intro: teach the card in one screen ---------- */
function vIntro(){
  const ex = byId('walk');
  return `
  <div class="eyebrow"><span class="mono">how a card works</span><span class="rule"></span></div>
  <h1 style="font-size:clamp(25px,4.2vw,36px);line-height:1.2;max-width:20em">
    Ten cards. Each one is a thought or a move that changes how a moment goes.</h1>
  <div class="anno">
    <div style="flex:none">${cardHTML(ex,{tilt:0})}</div>
    <div class="anno-notes">
      <div class="anno-note"><span class="n">01</span><span class="t">
        <b>Thought or action.</b> A thought changes how you're reading the moment. An action changes
        the moment itself. Some moments only respond to one of them.</span></div>
      <div class="anno-note"><span class="n">02</span><span class="t">
        <b>The picture is the card.</b> The words fade with use; the picture is what you'll actually
        recall when something is happening to you.</span></div>
      <div class="anno-note"><span class="n">03</span><span class="t">
        <b>The notch on top</b> tells you how much it asks of you. Shallow is nearly free. Deep costs
        you something real. Rounded means thought, angled means action.</span></div>
      <div class="anno-note"><span class="n">04</span><span class="t">
        <b>Choosing and turning it over are separate moves.</b> You'll have read all ten meanings before
        you start — knowing them was never the hard part. You commit from the picture and the words,
        then find out whether it was the card the moment was asking for.</span></div>
    </div>
  </div>
  <p class="lead">Three moves per situation. Thoughts stay out of reach while you're too stirred up to
    reach them — you'll have to change something first before you can think clearly about it.</p>
  <div class="row"><button class="act" data-a="deck">Read all ten cards</button></div>`;
}

/* ---------- menu of situations ---------- */
function vMenu(){
  const done=Object.keys(results).length;
  return `
  <div class="eyebrow"><span class="mono">${done?`${done} of ${SITUATIONS.length} practised`:'pick something that has happened to you'}</span><span class="rule"></span></div>
  <h2 style="font-size:clamp(22px,3.6vw,29px);line-height:1.22;max-width:22em;margin-bottom:8px">
    Which one of these do you recognise?</h2>
  <p class="lead">Choose one and it will happen to you. Nothing will surface on its own — you'll have to
    go looking for what comes to mind, which is the part that's actually hard.</p>
  <div class="sit-list">
    ${SITUATIONS.map((s,k)=>{
      const r=results[k];
      let tag='';
      if(r) tag = r.end>=GOAL ? '<span class="tag settled">settled</span>'
        : r.end>r.start ? '<span class="tag part">better</span>'
        : '<span class="tag stuck">still in it</span>';
      return `<button class="sit" data-a="open" data-i="${k}">
        <span class="sit-text">${s.text}</span>
        <span class="sit-side">${tag}
          ${r&&r.cards.length?`<span class="mini-row">${r.cards.map(id=>mini(byId(id))).join('')}</span>`:''}
        </span></button>`;
    }).join('')}
  </div>
  <div class="row" style="margin-top:16px">
    <button class="act quiet" data-a="deck">Read the ten cards again ↗</button>
  </div>`;
}

/* ---------- the moment ---------- */
function vMoment(){
  const sit=SITUATIONS[S.i];
  const dots=Array.from({length:MOVES},(_,k)=>`<span class="dot ${k<S.moves?'used':''}"></span>`).join('');
  let body;
  if(!S.fanOpen){
    body=`
      <div class="empty">
        <span class="empty-copy">Nothing has come to mind yet. It won't, on its own — that's the
          whole problem this is about. Go and get it.</span>
        <button class="summon" data-a="summon">What comes to mind</button>
      </div>
      <div class="timer"><i id="tbar"></i></div>
      <div class="tcount" id="tcount">&nbsp;</div>`;
  }else{
    const avail=CARDS.filter(c=>!S.used.has(c.id));
    const tilts=[-3,2,-1,3,-2,1,-2.5,2.5,-1.5,1.5];
    body=`
      <div class="fan-head">
        <h3>${S.moves?'What comes to mind now':'What came to mind'}</h3>
        <span class="mono">${avail.filter(c=>!locked(c,S.meter)).length} within reach</span>
      </div>
      <div class="fan">${avail.map((c,k)=>cardHTML(c,{tilt:tilts[k%tilts.length],delay:k*110,dis:locked(c,S.meter)})).join('')}</div>
      <p class="key">Dashed cards are real cards you can't reach from where you are. Bring yourself down
        first and they open up.</p>
      ${S.moves===0?'<div class="timer"><i id="tbar"></i></div><div class="tcount" id="tcount">&nbsp;</div>':''}`;
  }
  return `
  <div class="eyebrow"><span class="mono">it's happening</span><span class="rule"></span>
    <span class="moves" aria-label="${S.moves} of ${MOVES} moves used">${dots}</span></div>
  <p class="moment-text ${S.fanOpen?'dim':''}">${sit.text}</p>
  ${body}`;
}

/* ---------- chosen, then flipped ---------- */
function vChosen(){
  const c=S.chosen, sit=SITUATIONS[S.i], d=S.lastDelta;
  const dots=Array.from({length:MOVES},(_,k)=>`<span class="dot ${k<S.moves?'used':''}"></span>`).join('');
  const bg = c.suit==='thought'?'var(--thought-bg)':'var(--action-bg)';
  const fg = c.suit==='thought'?'var(--thought)':'var(--action)';
  const side = !S.turned
    ? `<h3 style="font-size:19px;margin-bottom:10px">Committed.</h3>
       <p class="lead">You've already read this card — that was never the hard part. Turn it over and
       find out whether it was the one this moment was asking for.</p>
       <button class="act" data-a="flip">Turn it over</button>`
    : `<div class="delta ${d>0?'up':d<0?'down':'flat'}">${d>0?'+':''}${d}</div>
       <h3 style="font-size:19px;margin-bottom:10px">${d>=14?'That was the card this moment wanted.'
          :d>0?'That helped a little.':d===0?'That did nothing here.':'That made it worse.'}</h3>
       <p class="lead">${verdict(c,sit,d)}</p>
       <button class="act" data-a="next">${S.meter>=GOAL||S.moves>=MOVES?'See how it landed':'What comes next'}</button>`;
  return `
  <div class="eyebrow"><span class="mono">it's happening</span><span class="rule"></span>
    <span class="moves">${dots}</span></div>
  <p class="moment-text dim">${sit.text}</p>
  <div class="chosen-area">
    <div class="chosen-card"><div class="flipper ${S.turned?'turned':''}">
      <div class="face front">
        <span class="notch" style="${notchStyle(c)}"></span>
        <div class="suit" style="color:${fg}">${c.suit}</div>
        <div class="glyph" style="height:58px;margin:12px 0 14px">${G[c.id]}</div>
        <div class="words" style="font-size:20px">${c.words}</div>
      </div>
      <div class="face back" style="background:${bg};border:1px solid ${fg}33">
        <div class="suit" style="color:${fg}">${c.suit} · what it asks</div>
        <div class="back-text">${c.back}</div>
      </div>
    </div></div>
    <div class="chosen-side">${side}</div>
  </div>`;
}
function verdict(c,sit,d){
  const best=Object.entries(sit.fx).sort((a,b)=>b[1]-a[1])[0][0];
  const raw=sit.fx[c.id]??0;
  if(c.id===best && raw>0 && d<raw*0.65)
    return `Right card, too early. This is the card this moment wants — but you reached for it while you
      were still too stirred up, so it landed at ${d} instead of ${raw}. An action first, then this.`;
  if(c.id===best) return "That was the strongest card available here.";
  if(d>=10) return `Reasonable. The strongest card in this moment was <b>${byId(best).words.toLowerCase()}</b>.`;
  if(c.suit==='thought' && S.meter<40)
    return "The card is sound — you were too stirred up for it to land. Thoughts need room made for them first.";
  return `This card belongs to a different moment. Here it was <b>${byId(best).words.toLowerCase()}</b>.`;
}

/* ---------- resolution ---------- */
function optimal(i){
  const sit=SITUATIONS[i]; let m=sit.start, used=new Set(), seq=[];
  for(let k=0;k<MOVES;k++){
    let best=null,bv=-99;
    for(const c of CARDS){ if(used.has(c.id)||locked(c,m)) continue;
      const v=effect(c,sit,m); if(v>bv){bv=v;best=c;} }
    if(!best||bv<=0) break;
    m=clamp(m+bv,0,100); used.add(best.id); seq.push(best.id);
    if(m>=GOAL) break;
  }
  return {end:m,seq};
}
function vResolved(){
  const r=results[S.i], sit=SITUATIONS[S.i], opt=optimal(S.i);
  const settled=r.end>=GOAL, moved=r.end-r.start;
  let title,body;
  if(r.missed){
    title="The moment passed.";
    body="You had ten cards and used none of them. Nothing prompted you, so nothing happened — which is the version of this that actually occurs.";
  }else if(settled){
    title="Settled.";
    body=`You got there in ${r.cards.length} move${r.cards.length>1?'s':''}.`;
  }else if(moved>0){
    title="Better, not settled.";
    body=`You moved it ${moved} points and ran out of moves.`;
  }else{
    title="Still in it.";
    body="No ground gained. Look at what you reached for — if they were all thoughts, that's the pattern: you can't think your way out of a state you haven't interrupted yet.";
  }
  const wasL=clamp(r.start,0,100), nowL=clamp(r.end,0,100);
  const doPlayed=[...new Set(r.cards.filter(id=>byId(id).suit==='action'))];
  const claims=doPlayed.map(id=>{
    const c=byId(id), st=r.claims[id];
    return `<div class="claim"><span class="who"><b>${c.words}</b> — ${c.back}</span>
      ${st===undefined
        ? `<button class="act" data-a="claim" data-id="${id}" data-v="1">Did it</button>
           <button class="act quiet" data-a="claim" data-id="${id}" data-v="0">Didn't</button>`
        : `<span class="claimed ${st?'':'no'}">${st?'carried out':'not done — logged'}</span>`}</div>`;
  }).join('');

  return `
  <div class="eyebrow"><span class="mono">how it landed</span><span class="rule"></span></div>
  <h2 class="res-title">${title}</h2>
  ${r.cards.length?`<div class="glyph-row">${r.cards.map((id,k)=>(k?'<span class="arrowlet">→</span>':'')+chip(byId(id))).join('')}</div>`:''}
  <p class="lead">${body}</p>
  <div class="mono" style="margin-bottom:5px">${Math.round(r.start)} → ${Math.round(r.end)}</div>
  <div class="bar">
    <i class="was" style="left:0;width:${wasL}%"></i>
    <i class="now ${r.end<r.start?'down':''}" style="left:0;width:${nowL}%"></i>
  </div>
  <p class="mono" style="margin:0 0 24px">${band(r.end)}</p>

  <div class="panel">
    ${S.revealed
      ? `<div class="mono" style="margin-bottom:8px">what was available</div>
         <div class="glyph-row">${opt.seq.map((id,k)=>(k?'<span class="arrowlet">→</span>':'')+chip(byId(id))).join('')}</div>
         <p class="lead">${opt.seq.map(id=>byId(id).words.toLowerCase()).join(' → ')} — reaching
           ${opt.end}${opt.end>=GOAL?', settled':''}. Notice the order: the cheap move first, to buy
           access to the one that actually does the work.</p>`
      : `<button class="act quiet" data-a="reveal">Show what was available ↗</button>`}
  </div>

  ${doPlayed.length?`<div class="panel">
    <div class="mono" style="margin-bottom:6px">these ones leave the game</div>
    <p class="lead">You played these. They're real instructions and they're still live. Claiming one is
      worth more than anything you did in here.</p>${claims}</div>`:''}

  <div class="panel"><div class="row">
    <button class="act" data-a="retry">Run this moment again</button>
    <button class="act quiet" data-a="menu">Back to the situations</button>
  </div></div>`;
}

/* ===================== timer ===================== */
let timer=null, tick=null;
function runTimer(ms,onEnd){
  stopTimer();
  const bar=document.getElementById('tbar');
  if(bar){ bar.style.transition='none'; bar.style.transform='scaleX(1)';
    requestAnimationFrame(()=>{ bar.style.transition=`transform ${ms}ms linear`; bar.style.transform='scaleX(0)'; }); }
  const t0=Date.now();
  tick=setInterval(()=>{
    const left=ms-(Date.now()-t0), el=document.getElementById('tcount');
    if(el && left<=WARN_MS){ el.textContent=Math.max(0,Math.ceil(left/1000))+'s'; el.style.opacity='1'; }
  },250);
  timer=setTimeout(onEnd,ms);
}
function stopTimer(){ if(timer){clearTimeout(timer);timer=null;} if(tick){clearInterval(tick);tick=null;} }

/* ===================== flow ===================== */
function enter(i){
  stopTimer();
  const sit=SITUATIONS[i];
  S.i=i; S.meter=sit.start; S.startMeter=sit.start;
  S.moves=0; S.used=new Set(); S.cards=[]; S.chosen=null; S.turned=false;
  S.fanOpen=false; S.missed=false; S.revealed=false; S.phase='moment';
  render();
  runTimer(WINDOW_MS, ()=>{ S.meter=clamp(S.meter-9,0,100); S.missed=true; close(); });
}
function close(){
  stopTimer();
  results[S.i]={ start:S.startMeter, end:S.meter, cards:[...S.cards],
                 missed:S.missed, claims:(results[S.i]&&results[S.i].claims)||{} };
  S.phase='resolved'; render();
}
function pick(id){
  const c=byId(id); if(!c||locked(c,S.meter)) return;
  stopTimer(); S.chosen=c; S.turned=false; S.phase='chosen'; render();
}
function flip(){
  const sit=SITUATIONS[S.i], c=S.chosen, d=effect(c,sit,S.meter);
  S.lastDelta=d; S.turned=true; S.moves++; S.used.add(c.id); S.cards.push(c.id);
  render();
  setTimeout(()=>{ S.meter=clamp(S.meter+d,0,100); paintHorizon();
    say(`${band(S.meter)}, ${Math.round(S.meter)}`); },640);
}
function afterFlip(){
  if(S.meter>=GOAL||S.moves>=MOVES){ close(); return; }
  S.chosen=null; S.turned=false; S.fanOpen=true; S.phase='moment'; render();
}

/* ===================== events ===================== */
function wire(){
  stage.querySelectorAll('.card:not(:disabled)').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.id)));
  stage.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.a;
    if(a==='menu'){ stopTimer(); S.phase='menu'; S.i=null; S.meter=50; render(); }
    else if(a==='deck'){ stopTimer(); S.phase='deck'; S.i=null; S.meter=50; render(); }
    else if(a==='open') enter(+b.dataset.i);
    else if(a==='summon'){ stopTimer(); S.fanOpen=true; render(); runTimer(WINDOW_MS,()=>{ S.meter=clamp(S.meter-9,0,100); S.missed=true; close(); }); }
    else if(a==='flip') flip();
    else if(a==='next') afterFlip();
    else if(a==='retry') enter(S.i);
    else if(a==='reveal'){ S.revealed=true; render(); }
    else if(a==='claim'){ results[S.i].claims[b.dataset.id]=b.dataset.v==='1'; render(); }
  }));
}

render();
</script>
</body>
</html>
