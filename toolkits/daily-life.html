    letter-spacing:-0.01em;
    color:var(--ink);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- shell ---------- */
  .shell{max-width:760px;margin:0 auto;padding:0 20px 80px;}

  header.top{
    padding:20px 0 18px;
    border-bottom:1px solid var(--border);
    margin-bottom:28px;
  }
  .masthead{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding-bottom:18px;margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .masthead-logo{height:40px;width:auto;display:block;border-radius:6px;flex:none;}
  .masthead-title{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    text-align:center;flex:1;
  }
  .masthead-seal{height:52px;width:52px;border-radius:50%;display:block;flex:none;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:22px;}
  .brand .mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);flex:none;
  }
  .brand h1{font-size:26px;}
  .brand .sub{color:var(--ink-soft);font-size:14px;margin-left:2px;}

  .stepper{display:flex;gap:6px;flex-wrap:wrap;}
  .step-tab{
    flex:1 1 0;
    min-width:70px;
    text-align:left;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid transparent;
    background:none;
    cursor:default;
    font-family:'Inter',sans-serif;
    color:var(--ink-faint);
    font-size:12px;
    transition:background .15s ease, color .15s ease;
  }
  .step-tab .num{
    display:block;font-family:'IBM Plex Mono',monospace;
    font-size:11px;margin-bottom:2px;
  }
  .step-tab.done{color:var(--accent-dark);}
  .step-tab.active{
    background:var(--accent-soft);
    color:var(--accent-dark);
    border-color:var(--accent);
    font-weight:500;
  }
  .step-tab.clickable{cursor:pointer;}
  .step-tab.clickable:hover{background:var(--accent-soft);}

  /* ---------- stage card ---------- */
  .stage{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--data);margin-bottom:8px;
  }
  .stage h2{font-size:24px;margin-bottom:10px;}
  .stage .intro{color:var(--ink-soft);margin-bottom:26px;max-width:58ch;}

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }

  /* ---------- stage 1: hook ---------- */
  .rating-row{display:flex;gap:6px;margin:18px 0 8px;flex-wrap:wrap;}
  .rating-btn{
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--border);background:var(--bg-card);
    font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);
    cursor:pointer;transition:all .15s ease;
  }
  .rating-btn:hover{border-color:var(--accent);}
  .rating-btn.selected{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;
    color:var(--ink);background:var(--bg-card);resize:vertical;min-height:64px;
  }
  textarea:focus,input:focus,select:focus,.rating-btn:focus{
    outline:2px solid var(--accent);outline-offset:1px;
  }
  label.field-label{display:block;font-size:13px;color:var(--ink-soft);margin:18px 0 4px;}

  /* ---------- stage 2 & 3: belief cards ---------- */
  .belief-card{
    border-left:3px solid var(--border);
    padding-left:16px;
  }
  .belief-text{font-size:16px;margin-bottom:12px;}
  .choice-row{display:flex;gap:10px;flex-wrap:wrap;}
  .choice-btn{
    padding:8px 16px;border-radius:20px;border:1px solid var(--border);
    background:var(--bg-card);font-family:'Inter',sans-serif;font-size:13px;
    font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .15s ease;
  }
  .choice-btn:hover{border-color:var(--ink-soft);}
  .choice-btn.chosen-myth{background:var(--myth-soft);border-color:var(--myth);color:var(--myth);}
  .choice-btn.chosen-fact{background:var(--fact-soft);border-color:var(--fact);color:var(--fact);}
  .choice-btn.chosen-neutral{background:var(--data-soft);border-color:var(--data);color:var(--data);}
  .progress-note{font-size:13px;color:var(--ink-faint);margin-top:4px;}

  /* ---------- stage 4: research reveal ---------- */
  .reveal-card{padding:0;overflow:hidden;}
  .reveal-head{padding:16px 20px 12px;}
  .reveal-your-answer{font-size:13px;color:var(--ink-soft);margin-bottom:2px;}
  .tag{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:2px 8px;border-radius:20px;margin-right:6px;
  }
  .tag.myth{background:var(--myth-soft);color:var(--myth);}
  .tag.fact{background:var(--fact-soft);color:var(--fact);}
  .research-box{
    background:var(--data-soft);
    border-top:1px solid var(--border);
    padding:14px 20px;
  }
  .research-box .lead{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--data);margin-bottom:6px;
  }
  .research-box p{margin:0 0 6px;font-size:14px;}
  .research-box .source{font-size:12.5px;color:var(--ink);font-weight:500;margin-top:2px;}
  .research-box .source b{color:var(--data);font-weight:600;}
  .bar-wrap{margin-top:10px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;}
  .bar-label{width:64px;flex:none;color:var(--ink-soft);}
  .bar-track{flex:1;height:8px;background:#fff;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .bar-fill{height:100%;background:var(--data);}
  .bar-val{width:34px;flex:none;text-align:right;font-family:'IBM Plex Mono',monospace;}
  .compare-wrap{margin-top:10px;}
  .compare-row{display:flex;align-items:center;gap:8px;}
  .compare-pill{
    flex:1;background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:13px;text-align:center;color:var(--ink);
  }
  .compare-vs{flex:none;font-size:12px;color:var(--data);}
  .compare-caption{font-size:12px;color:var(--ink-faint);margin-top:6px;font-style:italic;}

  /* ---------- stage 5: formula builder ---------- */
  .situation-select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    font-family:'Inter',sans-serif;font-size:14px;background:var(--bg-card);color:var(--ink);
  }
  .slider-row{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .slider-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .slider-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:2px;}
  .slider-top .label-main{font-weight:500;}
  .slider-top .val{font-family:'IBM Plex Mono',monospace;color:var(--accent-dark);flex:none;}
  input[type=range]{
    width:100%;accent-color:var(--accent);height:16px;margin:2px 0;
  }
  .slider-note{font-size:11px;color:var(--ink-faint);}
  .slider-source{font-size:11px;color:var(--data);margin-top:2px;font-weight:500;}
  .lever-card{padding-top:16px;}
  .lever-card-boost{border-left:3px solid var(--fact);}
  .lever-card-drain{border-left:3px solid var(--myth);}
  .lever-drain input[type=range]{accent-color:var(--myth);}

  .dashboard{
    background:var(--accent-dark);color:#EFEEE6;border-radius:var(--radius);
    padding:22px;margin:20px 0;box-shadow:var(--shadow);
  }
  .dash-headline{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;}
  .dash-headline .score{font-family:'Fraunces',serif;font-size:48px;font-weight:500;}
  .dash-headline .score-label{font-size:13px;color:#C6D2C4;max-width:24ch;}
  .pie-row{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .pie-seg{height:100%;}
  .pie-legend{display:flex;gap:16px;font-size:11px;color:#C6D2C4;flex-wrap:wrap;margin-bottom:18px;}
  .pie-legend span.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .metric{background:rgba(255,255,255,0.06);border-radius:8px;padding:12px 14px;}
  .metric .m-label{font-size:11px;color:#B7C4B4;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .metric .m-val{font-family:'IBM Plex Mono',monospace;font-size:20px;}
  .metric .m-note{font-size:11px;color:#9FAE9C;margin-top:4px;}

  /* ---------- stage 6: outcome ---------- */
  .outcome-item{display:flex;gap:14px;margin-bottom:16px;}
  .outcome-item .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none;}
  .outcome-item .body b{font-weight:600;}
  .lever-choice{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .lever-choice-card{
    flex:1 1 220px;text-align:left;background:var(--bg-card);border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;cursor:pointer;font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .lever-choice-card:hover{border-color:var(--accent);}
  .lever-choice-card.chosen{background:var(--fact-soft);border-color:var(--fact);}
  .lcc-label{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:4px;}
  .lcc-source{font-size:11px;color:var(--data);}

  /* ---------- nav ---------- */
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;}
  button.primary{
    background:var(--accent);color:#fff;border:none;border-radius:24px;
    padding:11px 22px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
    cursor:pointer;transition:background .15s ease;
  }
  button.primary:hover{background:var(--accent-dark);}
  button.primary:disabled{background:var(--border);color:var(--ink-faint);cursor:not-allowed;}
  button.ghost{
    background:none;border:1px solid var(--border);border-radius:24px;
    padding:11px 20px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink-soft);
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--ink-soft);}
  button.ghost:disabled{opacity:0;pointer-events:none;}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  @media (max-width:600px){
    .metrics{grid-template-columns:1fr;}
    .step-tab .label{display:none;}
    .stepper{gap:4px;}
    .masthead-logo{height:28px;}
    .masthead-seal{height:36px;width:36px;}
    .masthead-title{font-size:11px;letter-spacing:.08em;}
  }
</style>
</head>

/* ============================= STATE ============================= */

const state = {
  currentStage:1,
  maxUnlocked:1,
  baselineRating:null,
  baselineReason:"",
  beliefAnswers:{},
  scenarioAnswers:{},
  situationId:null,
  leverValues:{}, // situationId -> { leverId: 0-10 }
  chosenLever:null
};

function getLeverValue(situationId, leverId){
  if(!state.leverValues[situationId]) state.leverValues[situationId]={};
  if(state.leverValues[situationId][leverId]===undefined) state.leverValues[situationId][leverId]=3;
  return state.leverValues[situationId][leverId];
}
function setLeverValue(situationId, leverId, val){
  if(!state.leverValues[situationId]) state.leverValues[situationId]={};
  state.leverValues[situationId][leverId]=val;
}

/* ============================= HELPERS ============================= */

function el(html){
  const t=document.createElement("template");
  t.innerHTML=html.trim();
  return t.content.firstElementChild;
}
function allBeliefsAnswered(){return BELIEFS.every(b=>state.beliefAnswers[b.id]);}
function allScenariosAnswered(){return SCENARIOS.every(s=>state.scenarioAnswers[s.id]);}
function beliefScore(){
  let correct=0;
  BELIEFS.forEach(b=>{
    const ans=state.beliefAnswers[b.id];
    if((ans==="myth")===b.isMyth) correct++;
  });
  return correct;
}
function scenarioScore(){
  let correct=0;
  SCENARIOS.forEach(s=>{ if(state.scenarioAnswers[s.id]===s.correct) correct++; });
  return correct;
}

function computeFormula(){
  const situation = SITUATIONS.find(s=>s.id===state.situationId) || SITUATIONS[0];
  const boostLevers = situation.levers.filter(l=>l.type==="boost");
  const drainLevers = situation.levers.filter(l=>l.type==="drain");
  const maxBoost = boostLevers.reduce((sum,l)=>sum+l.impact,0);
  const maxDrain = drainLevers.reduce((sum,l)=>sum+l.impact,0);

  let boostPoints=0, drainPoints=0;
  boostLevers.forEach(l=>{ boostPoints += (getLeverValue(situation.id,l.id)/10)*l.impact; });
  drainLevers.forEach(l=>{ drainPoints += (getLeverValue(situation.id,l.id)/10)*l.impact; });

  const activityScore = boostPoints - drainPoints; // can be negative
  const setPoint = 50; // fixed, not editable
  const total = Math.round(setPoint + situation.circumstance + activityScore);
  const clamped = Math.max(0,Math.min(100,total));

  const activityFraction = Math.max(0,Math.min(1,(activityScore+maxDrain)/(maxBoost+maxDrain)));
  const predictedAccuracy = Math.round(10 + activityFraction*(58-10));

  let resilienceLabel, resilienceNote;
  if(activityFraction < 0.34){
    resilienceLabel="Lower resilience band";
    resilienceNote="Early-life positivity research (the nun study) links this band to a flatter survival curve over decades — small, consistent habits shift this over time.";
  } else if(activityFraction < 0.67){
    resilienceLabel="Middle resilience band";
    resilienceNote="Comparable to the middle quartiles in the nun study's early-life positivity data.";
  } else {
    resilienceLabel="Higher resilience band";
    resilienceNote="Comparable to the top quartile in the nun study, associated with a notably better survival curve over decades.";
  }

  return {situation, boostPoints:Math.round(boostPoints), drainPoints:Math.round(drainPoints), setPoint, total:clamped, predictedAccuracy, resilienceLabel, resilienceNote};
}

function renderStepper(){
  const wrap=document.getElementById("stepper");
  wrap.innerHTML="";
  STAGE_NAMES.forEach((name,i)=>{
    const n=i+1;
    const btn=document.createElement("button");
    const classes=["step-tab"];
    if(n===state.currentStage) classes.push("active");
    else if(n<state.currentStage) classes.push("done");
    if(n<=state.maxUnlocked && n!==state.currentStage) classes.push("clickable");
    btn.className=classes.join(" ");
    btn.innerHTML=`<span class="num mono">0${n}</span><span class="label">${name}</span>`;
    if(n<=state.maxUnlocked){
      btn.addEventListener("click",()=>{state.currentStage=n;render();scrollTop();});
    } else {
      btn.disabled=true;
    }
    wrap.appendChild(btn);
  });
}

function barChart(stat){

  const rows=stat.labels.map((label,i)=>`

      <div class="bar-track"><div class="bar-fill" style="width:${stat.values[i]}%"></div></div>
      <div class="bar-val mono">${stat.values[i]}%</div>
    </div>
  `).join("");
  return `<div class="bar-wrap">${rows}</div>`;
}

function compareChart(compare){
  if(!compare) return "";
  return `
    <div class="compare-wrap">
      <div class="compare-row">
        <div class="compare-pill">${compare.left}</div>
        <div class="compare-vs mono">+</div>
        <div class="compare-pill">${compare.right}</div>
      </div>
      <div class="compare-caption">${compare.caption}</div>

  `;
}

function chartFor(item){
  return item.stat ? barChart(item.stat) : compareChart(item.compare);

          <div class="metric">
            <div class="m-label">Helping your score</div>
            <div class="m-val mono" style="color:#9FDABB;">+${f.boostPoints}</div>
            <div class="m-note">From the habits marked "tends to help" above.</div>
          </div>
          <div class="metric">
            <div class="m-label">Working against you</div>
            <div class="m-val mono" style="color:#F2A9A6;">-${f.drainPoints}</div>
            <div class="m-note">From the habits marked "tends to work against you" above.</div>
          </div>
          <div class="metric">
            <div class="m-label">Problem-solving prediction</div>
            <div class="m-val mono">${f.predictedAccuracy}%</div>
            <div class="m-note">Modeled on Isen et al., 1987 — positive mood raised problem-solving accuracy from ~10% to ~58% in that study.</div>
          </div>
          <div class="metric">
            <div class="m-label">Resilience band</div>
            <div class="m-val mono" style="font-size:15px;">${f.resilienceLabel}</div>
            <div class="m-note">${f.resilienceNote}</div>
          </div>
        </div>
      </div>
    `;
  }
}

/* ============================= RENDER: STAGE 6 ============================= */

function renderStage6(root){
  const f = state.situationId ? computeFormula() : null;
  const bScore=beliefScore(), sScore=scenarioScore();
  const s=el(`
    <section class="stage">
      <div class="eyebrow">Stage 06 · Outcome</div>
      <h2>Your report</h2>
      <p class="intro">Here's the full arc — where you started, what the data corrected, and where your own formula landed.</p>

      <div class="card">
        <div class="outcome-item">
          <div class="dot"></div>
          <div class="body"><b>Baseline (Stage 1):</b> you rated your happiness right now as ${state.baselineRating ?? "—"}/10${state.baselineReason ? `, shaped by: "${state.baselineReason}"` : ""}.</div>
        </div>
        <div class="outcome-item">
          <div class="dot"></div>
          <div class="body"><b>Myth-sorting (Stage 2):</b> you sorted ${bScore} of ${BELIEFS.length} beliefs the way the research supports.</div>
        </div>
        <div class="outcome-item">
          <div class="dot"></div>
          <div class="body"><b>Scenario judgment (Stage 3):</b> you read ${sScore} of ${SCENARIOS.length} real-life situations the way the evidence supports.</div>
        </div>
        ${f ? `
        <div class="outcome-item">
          <div class="dot"></div>
          <div class="body"><b>Your formula (Stage 5):</b> for "${f.situation.label}", your habit mix predicted a happiness score of ${f.total}/100 — with a fixed 50% set point, only ${f.situation.circumstance} from circumstance, and the rest shaped by habits you chose.</div>
        </div>` : ""}
      </div>

      <div class="card">
        <h3 style="font-size:16px;margin-bottom:8px;">Try one habit for a week</h3>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 4px;">Pick one "tends to help" habit from your formula to actually practice for seven days, and notice if your own number moves.</p>
        <div class="lever-choice" id="leverChoice">
          ${f ? f.situation.levers.filter(l=>l.type==="boost").map(lv=>`
            <button class="lever-choice-card ${state.chosenLever===lv.id?"chosen":""}" data-id="${lv.id}">
              <div class="lcc-label">${lv.label}</div>
              <div class="lcc-source">${lv.source}</div>
            </button>
          `).join("") : `<p class="intro" style="color:var(--ink-faint);margin:0;">Complete Stage 5 first to see habit choices here.</p>`}
        </div>
      </div>
    </section>
  `);
  s.querySelectorAll(".lever-choice-card").forEach(btn=>{
    btn.addEventListener("click",()=>{
      state.chosenLever = btn.dataset.id;
      render();
    });
  });
  root.appendChild(s);
}

/* ============================= NAV ============================= */

function canAdvance(){
  switch(state.currentStage){
    case 1: return state.baselineRating!==null;
    case 2: return allBeliefsAnswered();
    case 3: return allScenariosAnswered();
    case 4: return true;
    case 5: return !!state.situationId;
    default: return false;
  }
}

function updateNav(){
  const backBtn=document.getElementById("backBtn");
  const nextBtn=document.getElementById("nextBtn");
  backBtn.disabled = state.currentStage===1;
  if(state.currentStage===6){
    nextBtn.textContent="Restart";
    nextBtn.disabled=false;
  } else {
    nextBtn.textContent="Next";
    nextBtn.disabled=!canAdvance();
  }
}

document.getElementById("backBtn").addEventListener("click",()=>{
  if(state.currentStage>1){state.currentStage--;render();scrollTop();}
});
document.getElementById("nextBtn").addEventListener("click",()=>{
  if(state.currentStage===6){
    Object.assign(state,{
      currentStage:1,maxUnlocked:1,baselineRating:null,baselineReason:"",
      beliefAnswers:{},scenarioAnswers:{},situationId:null,
      leverValues:{},chosenLever:null
    });
    render();
    scrollTop();
    return;
  }
  if(canAdvance()){
    state.currentStage++;
    state.maxUnlocked=Math.max(state.maxUnlocked,state.currentStage);
    render();
    scrollTop();
  }
});

/* ============================= MASTER RENDER ============================= */

function render(){
  renderStepper();
  const root=document.getElementById("stage-root");
  root.innerHTML="";
  switch(state.currentStage){
    case 1: renderStage1(root); break;
    case 2: renderStage2(root); break;
    case 3: renderStage3(root); break;
    case 4: renderStage4(root); break;
    case 5: renderStage5(root); break;
    case 6: renderStage6(root); break;
  }
  updateNav();
}
function scrollTop(){window.scrollTo({top:0,behavior:"instant"});}

render();
</script>
</body>
</html>
